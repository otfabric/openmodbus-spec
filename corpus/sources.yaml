      - https://library.e.abb.com/public/d3ef0d113e844c3cb30ec235e3d0471a/RE_615ANSI_modbusprot_057386_ENa.pdf
      format: pdf
      claims: >-
        PLC addresses start from 1 and the traffic carries the PLC address minus one (2.1.4); documentation and
        tools use base address 1 (3.4.2); register value = value x scaleFactor + offset (3.4.5), per-unit default
        scaleFactor 1000 (3.4.5.2); 32-bit registers high word first by default (3.4.8.7); bit address 16 is register
        1, bit 0 (3.4.8.2).
    contracts:
    - path: devices/abb/ret615/protection.omb.yaml
      selector: ret615
      info:
        id: abb/ret615/protection
        title: ABB RET615 ANSI transformer protection measurements and indications
        version: 0.1.0
        description: >
          Read-only subset of the ANSI point list for RET615 Ver. 5.0 FP1. The point list describes a superset of
          the data of standard configurations B (TA02) and F (TA06); the functions used here are listed for both.
          Scale factors and the zero offset are the default settings, and the register holds the value multiplied
          by the scale factor. Register and bit addresses are PLC addresses with base address 1, as the 615 series
          ANSI Modbus communication protocol manual states; registers are listed for both 3X and 4X. HV and MV are
          the high-voltage and medium-voltage sides.
        attribution: Derived from ABB's RET615 ANSI Modbus Point List Manual.
      device:
        manufacturer: ABB
        family: Relion 615 series
        model: RET615
        classes: [protection_relay]
      defaults: {table: holding_register, access: r, wordOrder: big}
