sources:
  victron-cerbo-gx-system:
    publisher: Victron Energy
    title: GX Modbus-TCP manual
    revision: 205bf75ecfc4e6263a3d36db5b5c1ee19f38f74d
    landing_url: https://www.victronenergy.com/live/ccgx:modbustcp_faq
    documentation_url: https://www.victronenergy.com/live/ccgx:modbustcp_faq
    download_urls:
    - https://raw.githubusercontent.com/victronenergy/dbus_modbustcp/205bf75ecfc4e6263a3d36db5b5c1ee19f38f74d/attributes.csv
    format: csv
    extractor: victron_gx_attributes
    contracts:
    - path: devices/victron/cerbo-gx/system.omb.yaml
      info:
        id: victron/cerbo-gx/system
        title: Victron Cerbo GX system battery telemetry
        version: 0.1.0
        description: >
          Read-only pilot subset of the GX system service. Values depend on the battery instrumentation connected
          to the GX device.
        attribution: Derived from Victron Energy BV's GX Modbus-TCP register definitions.
      device:
        manufacturer: Victron Energy
        family: GX
        model: Cerbo GX
        classes: [energy_storage, gateway]
        transports: [{type: tcp}]
        unitId:
          mode: fixed
          default: 100
          notes: The GX system service also responds to unit ID 0.
      defaults: {table: holding_register, access: r}
  eastron-sdm120-modbus:
    publisher: Eastron
    title: SDM120-Modbus RTU Protocol
    revision: '2.4'
    landing_url: https://www.eastrongroup.com/download/
    download_urls:
    - https://www.eastroneurope.com/images/uploads/products/protocol/SDM120-MODBUS_Protocol.pdf
    format: pdf
    extractor: eastron_sdm120
    contracts:
    - path: devices/eastron/sdm120-modbus/telemetry.omb.yaml
      info:
        id: eastron/sdm120-modbus/telemetry
        title: Eastron SDM120-Modbus telemetry
        version: 0.1.0
        description: >
          Pilot subset of the Modbus RTU input registers for the SDM120-Modbus. Read each selected value as a complete
          two-register float.
        attribution: Derived from Eastron's SDM120-Modbus RTU protocol.
      device:
        manufacturer: Eastron
        model: SDM120-Modbus
        classes: [energy_meter]
        transports: [{type: rtu}]
      defaults: {table: input_register, access: r, wordOrder: big, byteOrder: big}
  brainboxes-ed-tables:
    publisher: Brainboxes
    title: ED Modbus Product Data Tables
    landing_url: https://docs.brainboxes.com/reference/protocols/ed-modbus-product-data-tables
    download_urls:
    - https://docs.brainboxes.com/reference/protocols/ed-modbus-product-data-tables
    format: html
    extractor: brainboxes_ed_tables
    contracts:
    - path: devices/brainboxes/ed-516/inputs.omb.yaml
      selector: ed-516
      info:
        id: brainboxes/ed-516/inputs
        title: Brainboxes ED-516 discrete inputs and 16-bit counters
        version: 0.1.0
        description: >
          Read-only input states and counters. The counter mapping applies when the device is configured for 16-bit
          counters or runs firmware with only 16-bit counter support.
        attribution: Derived from the Brainboxes ED-516 Modbus data table.
      device:
        manufacturer: Brainboxes
        model: ED-516
        classes: [remote_io]
        transports: [{type: tcp}]
      defaults: {access: r}
    - path: devices/brainboxes/ed-538/io.omb.yaml
      selector: {model: ed-538, rows: [di, do, counter]}
      info:
        id: brainboxes/ed-538/io
        title: Brainboxes ED-538 digital inputs, outputs and 16-bit counters
        version: 0.1.0
        description: >
          Read-only input states, output states read back with function code 1, and input counters. The counter
          mapping applies when the device is configured for 16-bit counters or runs firmware with only 16-bit counter
          support. The input and output polarity settings decide whether a 1 means voltage present. Output overload
          flags are left out of this subset.
        attribution: Derived from Brainboxes' ED Modbus Product Data Tables.
      device:
        manufacturer: Brainboxes
        model: ED-538
        classes: [remote_io]
        transports: [{type: tcp}]
      defaults: {access: r}
    - path: devices/brainboxes/ed-588/io.omb.yaml
      selector: {model: ed-588, rows: [di, do]}
      info:
        id: brainboxes/ed-588/io
        title: Brainboxes ED-588 digital inputs and outputs
        version: 0.1.0
        description: >
          Read-only input states and output states read back with function code 1. The input and output polarity
          settings decide whether a 1 means voltage present. The input counters and output overload flags, laid
          out as on the ED-538, are left out to keep the subset within 20 points.
        attribution: Derived from Brainboxes' ED Modbus Product Data Tables.
      device:
        manufacturer: Brainboxes
        model: ED-588
        classes: [remote_io]
        transports: [{type: tcp}]
      defaults: {access: r}
  abb-b21-manual:
    publisher: ABB
    title: B21 User Manual
    revision: 2CMC485004M0201 Revision A (2013-06-20)
    landing_url: https://library.e.abb.com/public/a5cc6ae47646bf15c1257c3f00472b35/B21_User_Manual.pdf.pdf
    download_urls:
    - https://library.e.abb.com/public/a5cc6ae47646bf15c1257c3f00472b35/B21_User_Manual.pdf.pdf
    format: pdf
    extractor: abb_b2x_manual
    contracts:
    - path: devices/abb/b21/telemetry.omb.yaml
      selector: b21
      info:
        id: abb/b21/telemetry
        title: ABB B21 telemetry
        version: 0.1.0
        description: >
          Read-only subset of the B21 Modbus mapping tables (function code 3). The B21 is a single-phase, direct-connected
          meter; this applies to variants with RS-485 set to the Modbus protocol. Quantities that the meter variant
          lacks read as the documented "invalid" value: FFFF in every register for unsigned quantities, the highest
          positive value for signed ones.
        attribution: Derived from ABB's B21 User Manual.
      device:
        manufacturer: ABB
        model: B21
        classes: [energy_meter]
        transports:
        - type: rtu
          notes: RS-485 with the protocol set to Modbus; frames carry a CRC (manual chapter 9.1).
      defaults: {table: holding_register, access: r}
