  abb-m4m-modbus-map:
    publisher: ABB
    title: Modbus protocol map for M4M network analyzers
    revision: 9AKK107492A7627 rev. F, map v1.3O
    landing_url: https://www.abb.com/global/en/products/2csg239115r4051
    documentation_url: https://search.abb.com/library/Download.aspx?DocumentID=9AKK107492A7627&LanguageCode=en&DocumentPartId=&Action=Launch
    download_urls:
    - https://library.e.abb.com/public/6a5dc1ea3fe5416da79f7532a578dd0f/9AKK107492A7627_en_F_M4M%20Modbus%20map.xlsx
    - https://search.abb.com/library/Download.aspx?DocumentID=9AKK107492A7627&LanguageCode=en&DocumentPartId=&Action=Launch
    format: xlsx
    extractor: abb_m4m_modbus_map
    evidence:
    - id: abb-m4m-modbus-manual
      publisher: ABB
      title: Modbus manual, M4M network analyzers
      revision: 2CSG445050D0201 v1.05
      documentation_url: https://search.abb.com/library/Download.aspx?DocumentID=2CSG445050D0201&LanguageCode=en&DocumentPartId=&Action=Launch
      download_urls:
      - https://library.e.abb.com/public/ca20a071b8514cc484e55c46ac191436/Modbus%20manual%20v.%201.05.pdf
      format: pdf
      claims: >-
        FC 3 reads the measurement values (section 2, p.8); FC 3 request example reads phase voltage L1 at start
        address 0x5B02 (p.9); readable range, most significant byte in the high byte of the first register, invalid
        values of unused registers (p.12); "Start Reg (Hex)" is the address exactly as sent on the bus (section
        4, p.13).
    contracts:
    - path: devices/abb/m4m-20-modbus/telemetry.omb.yaml
      selector: M4M 20 Modbus
      info:
        id: abb/m4m-20-modbus/telemetry
        title: ABB M4M 20 Modbus telemetry
        version: 0.1.0
        description: >
          Read-only subset of the M4M Modbus map for product type 1 (M4M 20 Modbus). Read with FC 3; 32- and 64-bit
          values put the most significant word first; unavailable quantities read all ones (unsigned) or the largest
          positive value (signed). These conventions are stated in ABB's Modbus manual for M4M network analyzers,
          2CSG445050D0201 v1.05, which defines the map's columns. The selected rows apply to all firmware versions.
        attribution: Derived from ABB's Modbus protocol map for M4M network analyzers.
      device:
        manufacturer: ABB
        family: M4M
        model: M4M 20 Modbus
        classes: [power_meter]
        transports: [{type: rtu}]
      defaults: {table: holding_register, access: r, wordOrder: big, byteOrder: big}
    - path: devices/abb/m4m-30-modbus/telemetry.omb.yaml
      selector: M4M 30 Modbus
      info:
        id: abb/m4m-30-modbus/telemetry
        title: ABB M4M 30 Modbus telemetry
        version: 0.1.0
        description: >
          Read-only subset of the M4M Modbus map for product type 7 (M4M 30 Modbus). Read with FC 3; 32- and 64-bit
          values put the most significant word first; unavailable quantities read all ones (unsigned) or the largest
          positive value (signed). These conventions are stated in ABB's Modbus manual for M4M network analyzers,
          2CSG445050D0201 v1.05, which defines the map's columns. The selected rows apply to all firmware versions.
        attribution: Derived from ABB's Modbus protocol map for M4M network analyzers.
      device:
        manufacturer: ABB
        family: M4M
        model: M4M 30 Modbus
        classes: [power_meter]
        transports: [{type: rtu}]
      defaults: {table: holding_register, access: r, wordOrder: big, byteOrder: big}
    - path: devices/abb/m4m-2x-modbus/telemetry.omb.yaml
      selector: M4M 2X RTU
      info:
        id: abb/m4m-2x-modbus/telemetry
        title: ABB M4M 2X Modbus telemetry
        version: 0.1.0
        description: >
          Read-only subset of the M4M Modbus map for product type 15, which the map's Details sheet names "M4M 2X
          RTU". Read with FC 3; 32- and 64-bit values put the most significant word first; unavailable quantities
          read all ones (unsigned) or the largest positive value (signed). These conventions are stated in ABB's
          Modbus manual for M4M network analyzers, 2CSG445050D0201 v1.05, which defines the map's columns. The PQ,
          RTS and Rogowski variants of the M4M 2X have their own product type IDs and are not covered.
        attribution: Derived from ABB's Modbus protocol map for M4M network analyzers.
      device:
        manufacturer: ABB
        family: M4M
        model: M4M 2X Modbus
        classes: [power_meter]
        transports: [{type: rtu}]
      defaults: {table: holding_register, access: r, wordOrder: big, byteOrder: big}
  janitza-umg96rm-modbus-de:
    publisher: Janitza electronics GmbH
    title: UMG 96RM Modbus-Adressenliste und Formelsammlung (ab Firmware Rel. 1.14)
    revision: Dok. Nr. 1.040.033.u, 11/2023
    landing_url: https://assets.janitza.com/ce18jq9ih0x6/84e474c2bb03ea1ac23190/049ae8165fa5627ffd074d79780a5514/janitza-mal-umg96rm-cbm-p-pn-de.pdf
    download_urls:
    - https://assets.janitza.com/ce18jq9ih0x6/84e474c2bb03ea1ac23190/049ae8165fa5627ffd074d79780a5514/janitza-mal-umg96rm-cbm-p-pn-de.pdf
    format: pdf
    extractor: janitza_umg96rm_modbus
    contracts:
    - path: devices/janitza/umg-96rm/telemetry.omb.yaml
      selector: umg96rm
      info:
        id: janitza/umg-96rm/telemetry
        title: Janitza UMG 96RM telemetry
        version: 0.1.0
        description: >
          Read-only subset of the UMG 96RM base-device address list, firmware 1.14 or later. Floats return big-endian
          data at the listed addresses (the list mirrors them in little-endian at address + 32768). Float values
          include the transformer ratios; the 16-bit short value does not. The document states neither the address
          base nor the register table; the list is read as zero-based because it starts at address 0 and as holding
          registers because read-only and writable (FC 06/16) rows share it.
        attribution: Derived from Janitza's UMG 96RM Modbus-Adressenliste und Formelsammlung.
      device:
        manufacturer: Janitza electronics
        family: UMG 96RM
        model: UMG 96RM
        classes: [power_meter]
        transports: [{type: rtu, notes: RS-485.}]
      defaults: {table: holding_register, access: r, wordOrder: big, byteOrder: big}
    - path: devices/janitza/umg-96rm-pn/telemetry.omb.yaml
      selector: umg96rm-pn
      info:
        id: janitza/umg-96rm-pn/telemetry
        title: Janitza UMG 96RM-PN telemetry
        version: 0.1.0
        description: >
          Read-only subset of the UMG 96RM base-device address list, which the document applies to the UMG 96RM-PN
          extension, firmware 1.14 or later, read over RS-485. Floats return big-endian data at the listed addresses
          and include the transformer ratios; the 16-bit short value does not. The document notes that short-format
          values cannot be read through the PROFINET module of the UMG 96RM-PN but can be read over RS-485. The
          document states neither the address base nor the register table; the list is read as zero-based because
          it starts at address 0 and as holding registers because read-only and writable (FC 06/16) rows share it.
        attribution: Derived from Janitza's UMG 96RM Modbus-Adressenliste und Formelsammlung.
      device:
        manufacturer: Janitza electronics
        family: UMG 96RM
