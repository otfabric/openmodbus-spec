      selector: em511
      info:
        id: carlo-gavazzi/em511/telemetry
        title: Carlo Gavazzi EM511 telemetry
        version: 0.1.0
        description: >
          Read-only subset of the EM511 Modbus RTU map. Function codes 03 and 04 return the same values; the points
          use the input-register (function 04) table. 32-bit values are least significant word first. The firmware
          version and identification code registers must be read one word at a time.
        attribution: Derived from Carlo Gavazzi's EM511 Communication Protocol.
      device:
        manufacturer: Carlo Gavazzi
        model: EM511
        classes: [energy_meter]
        transports: [{type: rtu}]
      defaults: {table: input_register, access: r}
  carlo-gavazzi-em530-em540-protocol:
    publisher: Carlo Gavazzi
    title: EM530/EM540 Modbus Communication Protocol
    revision: Version 1.3 (2024-02-13)
    landing_url: https://www.gavazziautomation.com/fileadmin/images/PIM/OTHERSTUFF/COMPRO/EM500_CPP_Mod_V1.3_13022024.pdf
    download_urls:
    - https://www.gavazziautomation.com/fileadmin/images/PIM/OTHERSTUFF/COMPRO/EM500_CPP_Mod_V1.3_13022024.pdf
    format: pdf
    extractor: carlo_gavazzi_em5xx_protocol
    contracts:
    - path: devices/carlo-gavazzi/em530/telemetry.omb.yaml
      selector: em530
      info:
        id: carlo-gavazzi/em530/telemetry
        title: Carlo Gavazzi EM530 telemetry
        version: 0.1.0
        description: >
          Read-only subset of the EM530/EM540 Modbus RTU map (table grouped by phase). Function codes 03 and 04
          return the same values; the points use the input-register (function 04) table. 32-bit values are least
          significant word first. The firmware version and identification code registers must be read one word at
          a time. The document marks overflow by an MSW of 7FFFh, which no `invalid` list here expresses.
        attribution: Derived from Carlo Gavazzi's EM530/EM540 Modbus Communication Protocol.
      device:
        manufacturer: Carlo Gavazzi
        model: EM530
        classes: [energy_meter]
        transports: [{type: rtu}]
      defaults: {table: input_register, access: r}
    - path: devices/carlo-gavazzi/em540/telemetry.omb.yaml
      selector: em540
      info:
        id: carlo-gavazzi/em540/telemetry
        title: Carlo Gavazzi EM540 telemetry
        version: 0.1.0
        description: >
          Read-only subset of the EM530/EM540 Modbus RTU map (table grouped by phase). Function codes 03 and 04
          return the same values; the points use the input-register (function 04) table. 32-bit values are least
          significant word first. The firmware version and identification code registers must be read one word at
          a time. The document marks overflow by an MSW of 7FFFh, which no `invalid` list here expresses.
        attribution: Derived from Carlo Gavazzi's EM530/EM540 Modbus Communication Protocol.
      device:
        manufacturer: Carlo Gavazzi
        model: EM540
        classes: [energy_meter]
        transports: [{type: rtu}]
      defaults: {table: input_register, access: r}
