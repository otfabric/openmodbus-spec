    landing_url: https://www.eastroneurope.com/images/uploads/products/protocol/SDM630_MODBUS_Protocol.pdf
    download_urls:
    - https://www.eastroneurope.com/images/uploads/products/protocol/SDM630_MODBUS_Protocol.pdf
    format: pdf
    extractor: eastron_sdm230_sdm630
    contracts:
    - path: devices/eastron/sdm630-modbus/telemetry.omb.yaml
      selector: sdm630
      info:
        id: eastron/sdm630-modbus/telemetry
        title: Eastron SDM630-Modbus telemetry
        version: 0.1.0
        description: >
          Subset of the Modbus RTU input registers for the SDM630-Modbus. Read each selected value as a complete
          two-register float. Floats are most significant register first by default; the meter's Register Order
          setting can reverse that order, which this contract does not model. Which phase values are meaningful
          depends on the configured wiring system; each point notes it.
        attribution: Derived from Eastron's SDM630Modbus Smart Meter Modbus Protocol Implementation.
      device:
        manufacturer: Eastron
        model: SDM630-Modbus
        classes: [energy_meter]
        transports: [{type: rtu}]
