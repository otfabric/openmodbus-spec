  carlo-gavazzi-em511-protocol:
    publisher: Carlo Gavazzi
    title: EM511 Communication Protocol
    revision: rev. 1.8 (2023-05-23)
    landing_url: https://www.gavazziautomation.com/fileadmin/images/PIM/OTHERSTUFF/COMPRO/EM511%20CP%20Rev1.8.pdf
    download_urls:
    - https://www.gavazziautomation.com/fileadmin/images/PIM/OTHERSTUFF/COMPRO/EM511%20CP%20Rev1.8.pdf
    format: pdf
    extractor: carlo_gavazzi_em5xx_protocol
