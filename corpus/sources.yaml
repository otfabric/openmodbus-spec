      publisher: Victron Energy
      title: GX Modbus-TCP Manual
      revision: wiki revision 1743181803 (2025-03-28 17:10 UTC)
      documentation_url: https://www.victronenergy.com/live/ccgx:modbustcp_faq?rev=1743181803
      download_urls:
      - https://www.victronenergy.com/live/ccgx:modbustcp_faq?rev=1743181803&do=export_raw
      format: txt
      claims: >-
        Section 5 mapping example: Address column = request data address, Scalefactor = divisor; section 3: function
        codes 3 and 4 supported and equivalent; section 2: the GX device is a Modbus-TCP gateway selected by unit
        ID, com.victronenergy.vebus covers Multis and Quattros.
    contracts:
    - path: devices/victron/multiplus-ii/vebus.omb.yaml
      info:
        id: victron/multiplus-ii/vebus
        title: Victron MultiPlus-II VE.Bus telemetry through a GX device
        version: 0.1.0
        description: >
          Read-only subset of the com.victronenergy.vebus service that a GX device serves for a VE.Bus inverter/charger
          (GX Modbus-TCP register list 3.81, document Rev 54). The inverter/charger has no Modbus interface of its
          own: the GX device is the Modbus TCP server and gateway, and the unit ID selects the VE.Bus system. Values
          are those of the whole VE.Bus system; units in a parallel or three-phase system are not addressed one
          by one. Addresses are request addresses and the Scalefactor column is a divisor, as the mapping example
          of the GX Modbus-TCP Manual shows. Not every register is available on every product. VE.Bus state of charge
          is writable on the GX; this contract only reads it. 32-bit registers are left out because the register
          list does not state their word order.
