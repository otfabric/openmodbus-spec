        version: 0.1.0
        description: >
          Subset of the Modbus RTU input registers for the SDM230-Modbus. Read each selected value as a complete
          two-register float. Floats are most significant register first by default; the meter's Register Order
          setting can reverse that order, which this contract does not model.
        attribution: Derived from Eastron's SDM230Modbus Smart Meter Modbus Protocol Implementation.
      device:
        manufacturer: Eastron
        model: SDM230-Modbus
        classes: [energy_meter]
        transports: [{type: rtu}]
      defaults: {table: input_register, access: r, wordOrder: big, byteOrder: big}
