work_items:
- id: c01-request-shape-dependent-register
  kind: spec-gap
  vendor: Carlo Gavazzi; Eastron
  models: [EM511, EM530, EM540, SDM230, SDM630]
  summary: >-
    A register returns a different quantity depending on the request length; the draft cannot hold both points.
  evidence: >-
    EM511 rev 1.8 p.13 Table 4.1-1 000Ah 'W dmd' INT32 (000Ah-000Bh) and p.16 section 4.5 000Bh 'Carlo Gavazzi Controls
    identification code' UINT16, 'limited to a word at a time'. EM530/EM540 v1.3 p.12 000Ah 'V L3-L1' INT32 and
    p.18 000Bh identification code. Eastron SDM230 v1.4 p.2 and SDM630 v1.8 p.2: 'will response to any single input
    or holding register read with an instrument type specific value'.
  detail: >-
    ranges[].policy isolated (section 7) only restricts how a point is read; E002 still rejects an identification
    point at 11 overlapping an i32 at 10-11, and variants (5.6) select by firmware or hardware, not by request shape.
    The contracts here keep the identification code and drop W dmd / V L3-L1. Options: let an isolated range scope
    an overlap exemption, or a request-shape qualifier.
  decision: D10 (read constraints); touches E002 (D14)
  regression: >-
    Contract with v_l3_l1 (i32, wordOrder little, input 10) and identification_code (u16, input 11, isolated 11/1)
    validates. FC04 11 count 1 -> [0x06E0] -> identification_code 1760 (em540dinav23xs1x); FC04 10 count 2 -> [0x0960,
    0x0000] -> v_l3_l1 = 240.0 V with exponent10 -1.
  owner: maintainer
  class: 1
- id: c01-msw-overflow-sentinel
  kind: question
  vendor: Carlo Gavazzi
  models: [EM530, EM540]
  summary: >-
    Overflow is signalled by the most significant word alone (MSW == 7FFFh); invalid lists exact raw values only,
    so this needs 65536 entries.
  evidence: >-
    EM530/EM540 v1.3 p.10 section 3.3: 'The overflow indication EEE is displayed when the MSW value of the relevant
    variable is 7FFFh.' Applies e.g. to V L1-N 0120h (300289) INT32, LSW first.
  detail: >-
    For an i32 this is 65536 raw values (0x7FFF0000-0x7FFFFFFF): expressible only as a 65536-entry invalid list.
    A masked u16 shadow point over the MSW would overlap the i32 (E002) and cannot drive its quality. Contracts
    here carry no invalid list for EM530/EM540. Option: invalid entries as {mask, value} or a range. Recorded as
    a question because the draft can express it literally.
  decision: D6 (numeric model; section 6.6 validity)
  regression: >-
    FC04 0x0120 count 2 -> [0x0000, 0x7FFF] (LSW first) -> raw 0x7FFF0000 -> quality invalid (today decodes as 214741606.4
    V).
  owner: maintainer
  class: 1
- id: c01-bcd-setting
  kind: spec-gap
  vendor: Eastron
  models: [SDM230]
  summary: Packed BCD configuration word (four 1-byte BCD fields) has no type in the draft.
  evidence: >-
    SDM230 v1.4 p.4 holding 462721 (F500h): 'Demand interval, slide time, automatic scroll display interval (scroll
    Time), Backlight time', 'min-min-s-min', 'Data Format: BCD (length: 4 byte)'.
  detail: >-
    Masks can isolate each byte but cannot turn 0x60 into 60. BCD is listed as reserved in section 11. The byte-to-field
    order (first field in the high byte of the first register) is my reading of 'min-min-s-min' and needs vendor
    confirmation. Not mapped.
  decision: D6 (numeric model; section 11 reserved types)
  regression: >-
    FC03 0xF500 count 2 -> [0x6001, 0x0560] -> demand_interval 60 min, slide_time 1 min, scroll_time 5 s, backlight_time
    60 min.
  owner: maintainer
  class: 1
- id: c01-folded-power-factor
  kind: spec-gap
  vendor: Schneider Electric
  models: [iEM3155, iEM3255, iEM3355]
  summary: >-
    Power factor float folded into -2..+2 to encode the quadrant; no linear conversion recovers PF.
  evidence: >-
    DOCA0005EN-16 p.67, 0x0C0B (register 3084) Total Power Factor Float32: '-1 < PF < 0 = Quad 2 ... -2 < PF < -1
    = Quad 3 ... 0 < PF < 1 = Quad 1 ... 1 < PF < 2 = Quad 4'.
  detail: >-
    The raw float is expressible; the quadrant (and the conventional PF magnitude) needs a piecewise transform (section
    11 reserves conditional conversion). The doc states only the quadrant ranges; the magnitude formula (2 - x above
    1, -2 - x below -1) is an inference to confirm.
  decision: D6 (numeric model / conversion)
  regression: >-
    f32 1.2 (0x3F99999A) -> quadrant 4, active power positive, capacitive (stated); PF 0.8 (inferred). f32 -1.2
    -> quadrant 3 (stated); PF -0.8 (inferred).
  owner: maintainer
  class: 1
- id: c01-validity-bit-datetime
  kind: spec-gap
  vendor: Schneider Electric; ABB
  models: [iEM3155, iEM3255, iEM3355, B21]
  summary: >-
    Packed 4-word DATETIME with an in-band validity bit; fields fit masks, but neither a composite timestamp nor
    bit-driven validity is expressible.
  evidence: >-
    DOCA0005EN-16 p.56-57 DATETIME: word1 year b6:b0 (from 2000), word2 month b11:b8, WD b7:b5, day b4:b0, word3
    SU b15, hour b12:b8, iV b7 ('Bit to 0 if this parameter is not valid'), minute b5:b0, word4 milliseconds; used
    at 0x0083 Date of Manufacture. ABB B21 p.75 8A00 Date/time: 6 bytes year..second, year offset shown only by
    the B23/B24 p.82 example (2010 -> 0x0A).
  detail: >-
    Each field maps to a masked u16 (offset 2000 for the year), but quality depends on another bit (iV), which section
    6.6 cannot express, and a timestamp needs all four words from one read (blocks.coherent only if the vendor guarantees
    it). Timestamps are reserved in section 11. Not mapped.
  decision: D6 (types; section 11) and section 6.6 validity
  regression: >-
    FC03 0x0083 count 4 -> [0x001A, 0x0B0D, 0x0E9E, 0x0000] -> 2026-11-13 14:30:00.000 valid; with word3 0x0E1E
    (iV = 0) -> invalid.
  owner: maintainer
  class: 1
- id: c01-var-unit
  kind: question
  vendor: ABB; Carlo Gavazzi; Eastron
  models: [B21, B23, B24, EM511, EM530, EM540, SDM230, SDM630]
  summary: >-
    UCUM has no var; the draft allows it with warning W006, the corpus builder rejects it, so reactive points carry
    no unit.
  evidence: >-
    ABB B21 p.73 5B1C 'Reactive power Total ... var'; EM511 p.13 0008h 'var*10'; SDM230 p.2 30025 'VAr'.
  detail: >-
    Contracts here omit the unit (W001) and put the vendor unit in description, because corpus/run.py rejects var.
    Decide: accept var under W006, prescribe a UCUM spelling (e.g. V.A{reactive}), or keep omitting it.
  decision: D13 (semantics and units)
  regression: >-
    ABB 0x5B1C i32 raw 12345, exponent10 -2 -> 123.45 with a machine-readable reactive-power unit.
  owner: maintainer
  class: 1
- id: c01-float-coded-enum
  kind: question
  vendor: Eastron
  models: [SDM230, SDM630]
  summary: >-
    Settings are enumerations transported as IEEE floats; may enum apply to an f32 whose value is integral?
  evidence: >-
    SDM630 v1.8 p.7 40029 Network Baud Rate '0 = 2400 baud ... 4 = 38400 baud', 'Data Format : Float'; SDM230 p.4
    40029 and 40087 Pulse1 Energy Type, same pattern.
  detail: >-
    Section 6.5 says enumerations map raw integers; E013 only defines ranges for integer types. Not mapped.
  decision: D6 (numeric model; section 6.5)
  regression: FC03 0x001C count 2 -> [0x4000, 0x0000] (f32 2.0) -> enum 9600 baud.
  owner: maintainer
  class: 1
- id: c01-u64-sentinel-precision
  kind: question
  vendor: ABB
  models: [B21, B23, B24]
  summary: >-
    invalid: [18446744073709551615] on u64 points exceeds 2^53; JSON consumers parsing contracts as binary64 cannot
    match it.
  evidence: >-
    ABB B21 p.69 'Unused registers': unsigned quantities read FFFF in all registers; 5000 Active import kWh is 4
    registers Unsigned (p.70).
  detail: >-
    Section 6.4 requires raws above 2^53 to stay exact and be carried as strings in interchange, but schema $defs/point.invalid
    only allows integers.
  decision: D6 (numeric model)
  regression: >-
    FC03 0x5000 count 4 -> [0xFFFF, 0xFFFF, 0xFFFF, 0xFFFF] -> active_import_energy invalid in every implementation,
    including those reading the contract with a binary64 JSON parser.
  owner: maintainer
  class: 1
- id: c01-odd-length-string
  kind: question
  vendor: Carlo Gavazzi
  models: [EM511, EM530, EM540]
  summary: >-
    13-character serial number in 7 registers with the last low byte 'not to be used'.
  evidence: >-
    EM511 p.21 / EM530-EM540 p.30 section 4.10: 5000h-5006h letters 1-13, 5006h 'LSB: not to be used'.
  detail: >-
    A string point decodes 14 bytes and stops only at NUL; if the unused byte is not NUL or space the value gains
    a stray character. Not mapped.
  decision: D6 (section 6.2 strings)
  regression: >-
    FC04 0x5000 count 7 with the 14th byte 0x41 -> serial_number of 13 characters, without the trailing 'A'.
  owner: maintainer
  class: 1
- id: c01-configurable-word-order
  kind: question
  vendor: Eastron
  models: [SDM230, SDM630]
  summary: >-
    Float word order is a runtime setting (Register Order); contracts assume the default.
  evidence: >-
    SDM630 v1.8 p.1 'Most significant register first (Default) ... See Holding Register Register Order'; p.7 writing
    2141.0 sets the order for all float transactions.
  detail: >-
    Variants (5.6) could duplicate every point per order, but they model firmware/hardware, not configuration. Same
    pattern: SDM630 wiring system decides which values read zero (p.2). Decide whether configuration-dependent semantics
    belong in variants, a conditions profile, or stay out of scope.
  decision: D5 (byte/word order); D3 (scope)
  regression: >-
    Register Order reversed: FC04 0x0000 count 2 -> [0x8000, 0x4370] -> voltage_l1_n 240.5 V.
  owner: maintainer
  class: 1
- id: c01-safe-gap-over-points
  kind: question
  vendor: ABB
  models: [B21, B23, B24]
  summary: A safe_gap range that covers defined points as well as holes.
  evidence: >-
    ABB B21 p.69 / B23-B24 p.85: 'Reading any registers within this range [1000-8EFF] will result in a normal Modbus
    response'.
  detail: >-
    Mapped as one safe_gap range 0x1000 count 0x7F00. Section 7 says 'undefined but safe'; confirm a validator accepts
    points inside a safe_gap range.
  decision: D10 (read constraints)
  owner: maintainer
  class: 1
- id: c01-cg-overflow-word-order
  kind: doc-ambiguity
  vendor: Carlo Gavazzi
  models: [EM511]
  summary: EM511 overflow 0x7FFFFFFF read as the decoded INT32 value under LSW-first order.
  evidence: >-
    EM511 rev 1.8 p.11 section 3.3: 'represented as 0x7FFF for 16-bit registers, 0x7FFFFFFF for 32-bit registers';
    p.10 LSW->MSW.
  detail: >-
    Mapped invalid: [2147483647] (wire [0xFFFF, 0x7FFF]). If the meter puts 7FFF first on the wire the sentinel
    would never match; a device test would settle it.
  owner: vendor
  class: 1
- id: c01-socomec-cloudflare
  kind: source-access
  vendor: Socomec
  models: [COUNTIS E23, COUNTIS E24, COUNTIS E43]
  summary: All Socomec communication tables sit behind a Cloudflare bot challenge.
  evidence: >-
    2026-11-13 from this machine: emea.socomec.com 2024-09/...E23..._2022-08_CMT_EN_0.html, 2024-09/...E24..._2017-08_CMT_EN_0.html,
    2022-11/...E43..._2019-09_CMT201266_EN.html and 2025-01/...E43..._2025-01_CMT201266_EN.html: HTTP 403, cf-mitigated:
    challenge. Same 403 on www.socomec.co.in/.co.uk/.us/.fr/.de/.es/.it. www.socomec.com: HTTP 200 JavaScript SPA
    shell, not the document.
  detail: >-
    Blocked under the admission rules (no challenge solving, no browser UA). Needs a vendor-hosted copy without
    the challenge (e.g. a PDF on a CDN or a repository mirror the vendor publishes). CI will re-test.
