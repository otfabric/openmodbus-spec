  class: 9
- id: c09-woodward-bitlist-int16
  kind: question
  vendor: Woodward
  models: [easYgen-3200XT]
  summary: BITLIST registers declared int16 are read as u16 for mask and flags.
  evidence: >-
    B37574 50099 Control mode "int16 BITLIST" Mask 000Fh (p. 991); 50120 Alarms 1 latched int16 BITLIST (p. 999).
  detail: >-
    Spec 6.3 allows masks only on u16/u32/u64, so the declared int16 cannot carry the mask. Reading the same 16
    bits as u16 gives identical bits. Should the draft say that a mask or flag set reads the register as unsigned
    regardless of a vendor's declared signedness, or allow masks on signed types?
