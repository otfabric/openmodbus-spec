    from 9250 with a written read selection (table 121) and timestamped demand values (tables 139, 141). Siemens
    1.6.7 event recorder 40601-40626 and "Absolute time" in the profile manual.
  detail: >-
    Timestamps and BCD/packed time are reserved (§11), and reading these structures needs writes (D3, D11). The
    packed FH fields could be split into byte masks (§6.3), but no type yields one timestamp. Record this as input
    for a later events/timestamps profile. Not a strict spec-gap, because §11 already reserves it.
