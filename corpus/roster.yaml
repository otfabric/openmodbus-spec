      url: https://www.eastroneurope.com/images/uploads/products/protocol/Correct_SDM230_Protocol.pdf
      landing_url: https://eastroneurope.com/images/uploads/products/protocol/Correct_SDM230_Protocol.pdf
      format: pdf
      http_status: 200
      admitted: true
      notes: >-
        Roster URL on the bare host eastroneurope.com fails TLS (curl 60, certificate name mismatch); the www host
