- id: p-fronius-float-word-order
  kind: doc-ambiguity
  vendor: Fronius
  models:
  - Primo GEN24
  - Symo GEN24
  - Primo GEN24 Plus
  - Symo GEN24 Plus
  - Smart Meter
  - Tauro
  - Tauro ECO
  - Verto (3 MPPT)
  - Verto (4 MPPT)
  - Verto Plus
  summary: >-
    No Fronius document states the register order of 32/64-bit SunSpec values, so the float maps (the default model
    type) cannot be mapped and the new contracts cover the int+SF setting only.
  evidence: >-
    gen24-modbus-api-external-docs.zip 1.2.7-2: every measurement of the float inverter model (11x/113) and meter
    model (21x) is a float32, e.g. Gen24_Primo_Symo_Inverter_Register_Map_Float_ROW.xlsx Complete Map row 29 (W,
    registers 40092-40093) and Smart_Meter_Register_Map_Float.xlsx row 32 (W, 40098-40099); no sheet states an order.
    Manual 034-28092026: The Modbus Protocol > General, 'individual data points may also cover several data blocks
    (e.g., 2 registers = 32 bit value)'; General > Unavailable data records, 'float32 (range see IEEE 754): 0x7FC00000
    (NaN)', 'in accordance with the SunSpec specification'; the worked frames in Register addresses cover a string
    read and a one-register write. Workbook SID row (register 40001-40002): uint32 '0x53756e53 ('SunS')'.
  detail: >-
    Same ambiguity as c04-fronius-word-order and c03-fronius-word-order; this item records what it costs for parity
    and what Proxus does. Unstated convention: which register of a two- or four-register value is the most significant.
    Proxus assumes ABCD (connection.default_byte_order) for every float32, uint32, uint64 and bitfield value and
    gives no reason in connection.notes. Blocked: like-for-like contracts from the float workbooks for all ten models,
    that is the factory-default configuration; and in the int+SF contracts WH (acc32), Evt1/EvtVnd1/EvtVnd2 (bitfield32),
    ActWh (acc64), module/N/DCWH (acc32), Tms (uint32) and all meter energy counters (TotWhExp, TotWhImp, acc32).
    The ten contracts are valid only while 'SunSpec Model Type' is int + SF. If the maintainer accepts the SunSpec
    convention (p-fronius-sunspec-spec-access) or the SID row as evidence, add the float workbooks as layouts to
    fronius_gen24_storage_map.py (same sheet structure) and the left-out points.
  owner: maintainer
  class: [1, 3]
