  owner: maintainer
  class: 9
- id: c09-woodward-exponent-stability
  kind: question
  vendor: Woodward
  models: [easYgen-3400, easYgen-3500, easYgen-3200XT]
  summary: >-
    The exponent registers are configuration parameters; their stability is left at the default.
  evidence: >-
    37528J p. 405 / B37574 p. 633-634: parameters 3181-3183 "adjust the format of the 16 bit ... values in the data
    telegram"; Protocol 5010 rows 450002-450004 / 50001-50003.
  detail: >-
    W005 expects a referenced scale factor to be constant or session. The manuals present these as settings but
    do not say whether they can change while connected (parameters are writable over Modbus), so the points carry
    no stability. Should configuration-backed scale factors be marked session?
  decision: D9
  owner: maintainer
  class: 9
- id: c10-negated-scale-factor
  kind: spec-gap
