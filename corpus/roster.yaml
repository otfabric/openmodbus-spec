- id: p-schneider-ion-altivar-ion-address-base
  kind: doc-ambiguity
  vendor: Schneider Electric
  models: [ION7400, PM8000, ION9000]
  summary: >-
    The ION7400, PM8000 and ION9000 Modbus maps never say whether "Modbus Register" N is read at PDU address N or
    N-1.
  evidence: >-
    Workbooks (sha256 fcacc3fe..., 35021b89..., 240a95e6... and the 004.006.000 editions in the firmware packages):
    'Detailed Modbus Map'!B "Modbus Register", lowest value 30, e.g. Current A 3000 (B80); 'High-Level Modbus Map'
    "Start Address" / "End Address" with Generic data 0 to 65535 and Modbus Slave Modules 0 to 65535, External Control
    52001 to 53000 (first detailed register 52001). User manuals 7EN02-0374-10 p. 108, 7EN02-0336-12 p. 106, 7EN02-0390-10
    p. 112: "Your meter's Modbus registers are specified differently than previous devices using ION architecture
    ... refer to your meter's Modbus map"; ION Setup tooltip "indicates the Modbus function code and start address
    to send" (pp. 110, 108, 114). ION Reference 7EN02-0290-16 p. 427 BaseAddr. Technical note 70072-0104-14 covers
    only 4xxxx-style older meters. FAQ FA332210: "In some meters the registers start from Zero and others may start
    from 1 ... Check the Modbus Register List". FAQ000222926 writes PM8000 Power Factor Total (map register 3150)
    as "(403150-403151)".
  detail: >-
    The only fact blocking all three models; every point is affected. Two readings: (a) register minus one, which
    Proxus uses, giving as reason "the workbook numbers registers like the PM5000 lists (Current A = 3000)", and
    which the 4xxxxx notation in FAQ000222926 would also give; (b) register equals address, which the workbook's
    own 0 to 65535 range suggests, since a one-based numbering has no register 0. Neither is stated, the two conflict,
    and the FAQ pages are not byte-stable (per-response nonce), so they cannot be pinned. Everything else is stated
    in the pinnable user manuals: function 3, MSW-first 32-bit values, invalid patterns. Decide whether one of the
    hints, or corroboration by independent implementations, may count; otherwise ask Schneider for a one-line statement
    in the readme sheet. Same question as c02-schneider-base-wordorder for the PM5000.
