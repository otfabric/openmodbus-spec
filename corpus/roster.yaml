        control word and references (written by the master), coils and discrete inputs (p-abb-efb-bit-references),
        16-bit values that scale to another parameter (c08-abb-ratio-scaling). actual_value_1 is exposed raw.
    - model: ACH580
      status: mapped
      contracts: [devices/abb/ach580/status.omb.yaml]
