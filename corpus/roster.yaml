  owner: vendor
  class: 9
- id: c09-woodward-37528-long-word-order
  kind: doc-ambiguity
  vendor: Woodward
  models: [easYgen-3400, easYgen-3500]
  summary: Manual 37528J gives no register order for the Long (32-bit) Protocol 5010 rows.
  evidence: >-
    37528J p. 737-739, "AC Generator And Busbar Values (Long - 32 bits)" (e.g. 450323 Total gen. power, 450367 Gen.
