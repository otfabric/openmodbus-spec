  owner: maintainer
  class: 6
- id: c06-time-tagged-records
  kind: question
  vendor: Schneider Electric
  models:
  - Sepam S20
  - Sepam T20
  - Sepam M20
  - SIL-A
  - SIA-C
  - SIA-B Specific CT
  - REF615
  - REM615
  - RET615
  - 7SJ80
  - 7SK80
  - 7RW80
  summary: >-
    Every relay delivers time-tagged events and fault records through handshake structures that read-only flat points
    cannot express.
  evidence: >-
    Sepam: event zones 0040-0060 and 0070-0090 with an exchange word written by functions 6/16 (pdf page 112), and
    TS transitions time-tagged (pdf page 116). Fanox SIL-A general memory map (pdf page 7): "Read the oldest Event
    400 11 EVENTO2", "Read a complete fault report 8400 54 EVENTO2", with FH = Year(UINT).month(UCHAR).day(UCHAR)...
