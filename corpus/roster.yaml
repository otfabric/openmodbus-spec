- id: c09-kohler-unit-system-register
  kind: spec-gap
  vendor: Kohler
  models: [Decision-Maker 550]
  summary: >-
    A readable register (400139 Metric Units) switches the unit of other registers between metric and English.
  evidence: >-
    TP-6113 12/21 p.15: "The controller display setting determines whether the units are returned or interpreted
    as metric or English. Read or alter this setting in register 40139 (550 controller only)." p.46: "400139 Metric
    Units RW WORD 1 = True, 0 = False". p.43: "400033 Oil Pressure* RO WORD kPa/psi", "400034 Coolant Temperature*
    RO SWORD Degrees C/Degrees F".
  detail: >-
    A point has one static unit and conversion (6.4); variants (5.6) select firmware/hardware subsets, not a runtime
    register value; section 11 reserves conditional conversion (`when`). The contract could only pick one setting
    or drop the unit. Related: c08-schneider-cmi-frequency-unit (control bit selects the scale) and c10-config-selected-unit
    (setting not readable over Modbus); this case is readable, so a runtime could follow it.
  decision: D9
  regression: >-
    400139 = 0x0001, 400034 = 0x0055 -> 85 Cel; 400139 = 0x0000, 400034 = 0x00B9 -> 185 [degF]. Register numbers
    as in the document; PDU addresses pending c09-kohler-address-base.
