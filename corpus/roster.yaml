version: 1
updated: '2026-11-14'
classes:
- id: 1
  name: Electrical energy submeters
  vendors:
  - vendor: ABB
    slug: abb
    models:
    - model: B21
      status: mapped
      contracts: [devices/abb/b21/telemetry.omb.yaml]
      source: abb-b21-manual
      layout: abb-eq-b2x
      encodings:
      - u64
      - i64
      - u32
      - i32
      - u16
      - i16
      - exponent10
      - invalid
      - string
      - mask
      - enum
      - safe_gap_range
      notes: >-
        Single-phase: only total and L1 quantities selected. Applies to RS-485 variants set to Modbus; quantities
        a subgroup (Steel/Bronze/Silver) lacks read as invalid. Left out: 64-bit Error/Information/Warning/Alarm
        flag words (no bit definitions), byte-packed Date/time (8A00), DMTME compatibility map, writable operations.
    - model: B23
      status: mapped
      contracts: [devices/abb/b23/telemetry.omb.yaml]
      source: abb-b23-b24-manual
      layout: abb-eq-b2x
      encodings:
      - u64
      - i64
      - u32
      - i32
      - u16
      - i16
      - exponent10
      - invalid
      - string
      - mask
      - enum
      - safe_gap_range
      notes: >-
        Same selection as B21 plus L2/L3 voltage and current. Same register addresses as B21 for every selected
        point.
    - model: B24
      status: mapped
      contracts: [devices/abb/b24/telemetry.omb.yaml]
      source: abb-b23-b24-manual
      layout: abb-eq-b2x
      encodings:
      - u64
      - i64
      - u32
      - i32
      - u16
      - i16
      - exponent10
      - invalid
      - string
      - mask
      - enum
      - safe_gap_range
      notes: >-
        Identical points to B23 (one manual, one map). CT/VT ratio settings (8C04-8C0A) not selected.
    sources:
    - id: abb-b21-manual
      title: B21 User Manual
      revision: 2CMC485004M0201 Revision A (2013-06-20)
      url: https://library.e.abb.com/public/a5cc6ae47646bf15c1257c3f00472b35/B21_User_Manual.pdf.pdf
      landing_url: https://library.e.abb.com/public/a5cc6ae47646bf15c1257c3f00472b35/B21_User_Manual.pdf.pdf
      format: pdf
      http_status: 200
      admitted: true
      notes: >-
        Fetched twice with curl and once by corpus/run.py (urllib): identical bytes. PDF page numbers equal printed
        page numbers.
    - id: abb-b23-b24-manual
      title: B23/B24 User Manual
      revision: 2CMC485003M0201 Revision A (2013-06-20)
      url: https://library.e.abb.com/public/6d7783fdb45ace75c1257c3f00474022/B23_B24_User_Manual.pdf.pdf
      landing_url: https://library.e.abb.com/public/6d7783fdb45ace75c1257c3f00474022/B23_B24_User_Manual.pdf.pdf
      format: pdf
      http_status: 200
      admitted: true
      notes: >-
        Stable over three fetches. The B23/B24 Miscellaneous table has no Date/time row, but the p.82 FC16 example
        writes Date/Time at 0x8A00.
  - vendor: Carlo Gavazzi
    slug: carlo-gavazzi
    models:
    - model: EM511
      status: mapped
      contracts: [devices/carlo-gavazzi/em511/telemetry.omb.yaml]
      source: carlo-gavazzi-em511-protocol
      layout: carlo-gavazzi-em511
      encodings:
      - i32_cdab
      - i16
      - u16
      - exponent10
      - invalid
      - enum
      - enum_negative
      - mask
      - isolated_range
      notes: >-
        Table 4.1-1 rows. Overflow sentinels 0x7FFF/0x7FFFFFFF (p.11) on instantaneous values. Left out: INT64 Wh
        energies (0500h..; word order not stated for INT64), W dmd 000Ah (overlaps the identification code at 000Bh),
        13-character serial number (5000h-5006h), settings. Identification enum omits EM511DINAV81XS1SFA (vendor
        erratum).
    - model: EM530
      status: mapped
      contracts: [devices/carlo-gavazzi/em530/telemetry.omb.yaml]
      source: carlo-gavazzi-em530-em540-protocol
      layout: carlo-gavazzi-em5x0
      encodings: [i32_cdab, u16, exponent10, enum, mask, isolated_range]
      notes: >-
        Table 4.2 (grouped by phase), which gives a weight per row. No invalid lists: this document defines overflow
        as MSW == 7FFFh (spec-gap c01-msw-overflow-sentinel). Identification enum limited to EM530 part numbers
        via selector.
    - model: EM540
      status: mapped
      contracts: [devices/carlo-gavazzi/em540/telemetry.omb.yaml]
      source: carlo-gavazzi-em530-em540-protocol
      layout: carlo-gavazzi-em5x0
      encodings: [i32_cdab, u16, exponent10, enum, mask, isolated_range]
      notes: Same points as EM530; identification enum limited to EM540 part numbers.
    sources:
    - id: carlo-gavazzi-em511-protocol
      title: EM511 Communication Protocol
      revision: rev. 1.8 (2023-05-23)
      url: https://www.gavazziautomation.com/fileadmin/images/PIM/OTHERSTUFF/COMPRO/EM511%20CP%20Rev1.8.pdf
      landing_url: https://www.gavazziautomation.com/fileadmin/images/PIM/OTHERSTUFF/COMPRO/EM511%20CP%20Rev1.8.pdf
      format: pdf
      http_status: 200
      admitted: true
      notes: >-
        FC03 and FC04 read the same values (p.4); contracts use the input-register table.
    - id: carlo-gavazzi-em530-em540-protocol
      title: EM530/EM540 Modbus Communication Protocol
      revision: Version 1.3 (2024-02-13)
      url: https://www.gavazziautomation.com/fileadmin/images/PIM/OTHERSTUFF/COMPRO/EM500_CPP_Mod_V1.3_13022024.pdf
      landing_url: https://www.gavazziautomation.com/fileadmin/images/PIM/OTHERSTUFF/COMPRO/EM500_CPP_Mod_V1.3_13022024.pdf
      format: pdf
      http_status: 200
      admitted: true
      notes: >-
        Revision table on p.32 ends at Rev 1.3 dated 03/Jun/2021 while the cover says Version 1.3, February 13th,
        2024.
  - vendor: Eastron
    slug: eastron
    models:
    - model: SDM120
      status: mapped
      contracts: [devices/eastron/sdm120-modbus/telemetry.omb.yaml]
      source: eastron-sdm120-modbus
      layout: eastron-sdm-single-phase
      encodings: [f32]
      notes: Already mapped in the pilot; not touched.
    - model: SDM230
      status: mapped
      contracts: [devices/eastron/sdm230-modbus/telemetry.omb.yaml]
      source: eastron-sdm230-modbus
      layout: eastron-sdm-single-phase
      encodings: [f32, max_read_registers]
      notes: >-
        Same input addresses as SDM120 for the common quantities. Left out: holding registers (float-coded settings,
        BCD 462721, 2-byte Hex parameters 463761/463776, uint32 serial 464513), see work items. The even-address/even-count
        rule is covered by f32 points plus gaps: forbid, as in the SDM120 finding; nothing new.
    - model: SDM630
      status: mapped
      contracts: [devices/eastron/sdm630-modbus/telemetry.omb.yaml]
      source: eastron-sdm630-modbus
      layout: eastron-sdm630
      encodings: [f32, max_read_registers, side_effects_range]
      notes: >-
        Wiring-system validity columns (3P4W/3P3W/1P2W, X reads zero) copied into each point description. side_effects
        ranges for Password Lock (40015) and Password (40025): reading either resets the password timeout (p.8).
        Left out: holding settings and serial number.
    sources:
    - id: eastron-sdm120-modbus
      title: SDM120-Modbus RTU Protocol
      revision: '2.4'
      url: https://www.eastroneurope.com/images/uploads/products/protocol/SDM120-MODBUS_Protocol.pdf
      landing_url: https://www.eastrongroup.com/download/
      format: pdf
      admitted: true
      notes: >-
        Already in corpus/sources.yaml; not touched and not re-fetched by this class run.
    - id: eastron-sdm230-modbus
