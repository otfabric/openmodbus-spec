    each carries a scale) are excluded until the default offset is confirmed for REF615 Ver. 3.0 and REM615 Ver.
    2.0, and info.description says so. Both models stay mapped with their indication bits (7 points each). RET615
    5.0 FP1 is not affected: its own point list states the offset is 0 by default. To restore the measurands, ABB
    (or an edition of the point lists or protocol manual for these versions) has to state the default offset; the
    extractor would then require that statement as it does for RET615.
