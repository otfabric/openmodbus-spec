  evidence: >-
    B37574 pp. 988-1023 Model column (e.g. 50024 Busbar 1 Voltage L2-L3 "EG3500XT-P2").
  detail: >-
    The table is shared with the 3400XT/3500XT. Only rows marked "All" were mapped. The table does not distinguish
    3100XT-P1 from 3200XT-P1, so the 3200XT contract could also serve the 3100XT-P1 if the roster wants it.
