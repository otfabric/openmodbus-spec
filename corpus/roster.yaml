- id: 2
  name: Multifunction power and power-quality meters
  vendors:
  - vendor: ABB
    slug: abb
    models:
    - model: M4M 20 Modbus
      status: mapped
      contracts: [devices/abb/m4m-20-modbus/telemetry.omb.yaml]
      source: abb-m4m-modbus-map
      layout: abb-m4m-map-v1.3O
      encodings: [u64, i64, u32, i32, u16, i16, exponent10, invalid, string]
      notes: >-
        Product type ID 1. Energies (import, export, net, reactive import; 4 registers, 0.01 kWh), phase and line
        voltage, phase currents, total P/Q/S, frequency, total PF, THD of voltage and current on L1, serial number
        (ASCII, 5 registers). The invalid values are parsed from the manual: FFFF in every register for unsigned
        values, the highest value of the register count for signed ones. Left out: the product type ID (no data
        type in the map, c02-abb-product-type-dtype), the current quadrant (values not documented, c02-abb-quadrant-enum),
        per-phase powers and harmonics beyond THD, and writable configuration.
    - model: M4M 30 Modbus
      status: mapped
      contracts: [devices/abb/m4m-30-modbus/telemetry.omb.yaml]
      source: abb-m4m-modbus-map
      layout: abb-m4m-map-v1.3O
      encodings: [u64, i64, u32, i32, u16, i16, exponent10, invalid, string]
      notes: Product type ID 7. Same rows and point list as the M4M 20 Modbus.
    - model: M4M 2X Modbus
      status: mapped
      contracts: [devices/abb/m4m-2x-modbus/telemetry.omb.yaml]
      source: abb-m4m-modbus-map
      layout: abb-m4m-map-v1.3O
      encodings: [u64, i64, u32, i32, u16, i16, exponent10, invalid, string]
      notes: >-
        Mapped as product type ID 15, which the Details sheet names "M4M 2X RTU"; the name "M4M 2X Modbus" does
        not occur in the map (c02-abb-2x-naming). The PQ1, PQ2, RTS and +R variants (IDs 16 to 20) have their own
        IDs and are not covered.
    sources:
    - id: abb-m4m-modbus-map
      title: Modbus protocol map for M4M network analyzers
      revision: 9AKK107492A7627 rev. F, map v1.3O
      url: https://library.e.abb.com/public/6a5dc1ea3fe5416da79f7532a578dd0f/9AKK107492A7627_en_F_M4M%20Modbus%20map.xlsx
      landing_url: https://www.abb.com/global/en/products/2csg239115r4051
      format: xlsx
      http_status: 200
      admitted: true
      notes: >-
        The product landing page timed out from this machine; the document ID was resolved by web search. The second
        download URL (search.abb.com Download.aspx, a 302 to library.e.abb.com with an x-sign query) returned the
        same SHA-256 when fetched with urllib. Vendor-sheet anomaly with no effect on the mapped models: in many
        rows the ID-29 column (AQ) holds "29 30" and the ID-30 column (AR) is empty. Column M ("Product Type") reads
        "M4M 20 (all versions); M4M 30 (all versions)" even on rows whose ID columns include the M4M 2X IDs.
    - id: abb-m4m-modbus-manual
      title: Modbus manual, M4M network analyzers
      revision: 2CSG445050D0201 v1.05
      url: https://library.e.abb.com/public/ca20a071b8514cc484e55c46ac191436/Modbus%20manual%20v.%201.05.pdf
      landing_url: https://search.abb.com/library/Download.aspx?DocumentID=2CSG445050D0201&LanguageCode=en&DocumentPartId=&Action=Launch
      format: pdf
      http_status: 200
      admitted: true
      notes: >-
        Admitted as an evidence document on abb-m4m-modbus-map (fetched twice with the corpus-fetch curl command,
        identical bytes); run.py adds it to device.documentation. The manual's column names ("Start Reg (Hex)")
        differ from the map's ("Register (Hex)"); the CRC-checked example ties the two. The FC 16 example on PDF
        p.10 carries a CRC that does not match its bytes (not used).
