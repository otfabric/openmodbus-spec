  - Verto (3 MPPT)
  - Verto (4 MPPT)
  - Verto Plus
  summary: >-
    The SunSpec document that the Fronius manual links states the 32-bit register order, but sunspec.org blocks
    the corpus client.
  evidence: >-
    Manual 034-28092026, Immediate Control Model (123) > Power reduction: 'Further information can be found at:
    http://sunspec.org/wp-content/uploads/2015/06/SunSpec-Information-Models-12041.pdf'. GET of the https URL with
    corpus-fetch/1 on 2026-11-14 (twice): HTTP 403, body 'Just a moment...', header 'cf-mitigated: challenge'; the
    same for https://sunspec.org/ and https://sunspec.org/specifications/. An Internet Archive capture of the PDF
    (2022-01-19, 1535953 bytes, title 'SunSpec Information Models - 12041', read for discovery only) says '32-bit
    integers are stored using two registers in big-endian order', '64-bit integers are stored using four registers
    in big-endian order' and 'float32 ... Not Implemented: 0x7FC00000 (NaN)'.
  detail: >-
    An archive mirror is not admissible, and the manual links the document for scale factors, not for data types.
    Decide whether a SunSpec Alliance document may be evidence for a Fronius contract (the manual says unavailable
    data follows 'the SunSpec specification' and that the device serves SunSpec models), and from which SunSpec
    host the corpus client can fetch it. https://raw.githubusercontent.com/sunspec/models/master/README.md is fetchable
    (HTTP 200) but states no encoding. Until then the 32/64-bit points stay unmapped.
  owner: maintainer
  class: [1, 3]
