  class: 1
- id: c01-tooling-pdf-columns
  kind: tooling
  vendor: Carlo Gavazzi; ABB
  models: [EM511, EM530, EM540, B21, B23, B24]
  summary: >-
    sourcelib has no word-position helper; extractors infer table cells from pdftotext -layout columns.
  evidence: >-
    corpus/extractors/carlo_gavazzi_em5xx_protocol.py rebuilds multi-line Notes cells by column position; abb_b2x_manual.py
    splits cells on runs of two spaces.
  detail: >-
    A sourcelib pdf_words(data, page) helper on pdftotext -bbox-layout would make cell assignment explicit. Layout
