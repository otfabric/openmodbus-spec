    EM511 p.12 EM511DINAV81XS1SFA decimal 1795 vs hex 0702 (PFB's code); EM511 p.17 304360/110Bh (expected 1107h);
    EM511 p.21 and EM530-EM540 p.29 316657/4210h (expected 4110h); EM530-EM540 p.20 304357/1105h (expected 1104h)
