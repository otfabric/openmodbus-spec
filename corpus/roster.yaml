- id: c01-eastron-holding-gaps
  kind: doc-ambiguity
  vendor: Eastron
  models: [SDM230, SDM630]
  summary: >-
    Holding parameters with unclear encoding: 2-byte Hex values in 2-register slots, uint32 serial word order, missing
    Register Order row.
  evidence: >-
    SDM230 p.5 463761 (F910h) Pulse 1 constant and 463776 (F920h) Measurement mode 'Data Format: Hex (length: 2
    byte)' while p.2 requires even register counts and single-register reads return an instrument type value; SDM230
    p.5 / SDM630 p.7 464513 (FC00h) Serial number 'unsigned int32' (word order stated only for floats); SDM230 p.1
    and SDM630 p.1/p.7 refer to a 'Register Order' holding register that neither table lists.
  detail: >-
    All left out. If the 2-byte value sits in the first register of the pair, it could be a u32 with mask 0xFFFF0000;
