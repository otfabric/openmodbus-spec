themes:
- id: validity-from-other-points
  title: Validity decided by another register or bit
  decisions: D6 (invalid), D9
  summary: >-
    A value is valid only when a status bit, a mode or a device-level flag says so. invalid lists raw sentinels
    of the point itself and cannot reference another point.
  items:
  - c01-validity-bit-datetime
  - c04-schneider-device-present-gate
  - c05-tecsystem-disabled-channel-zero
  - c06-siemens-data-invalid-flag
  - c07-validity-from-status-register
- id: configuration-selects-decode
  title: Scale, unit, word order or layout selected by configuration
  decisions: D3 (variants), D5, D9, D13
  summary: >-
    A configuration register or device setting changes how other registers decode. variants.match covers firmware
    and hardware only, and exponent10 references take the raw exponent only.
  items:
  - c01-configurable-word-order
  - c03-config-dependent-layout
  - c06-configured-default-scaling
  - c07-enum-selected-scale-unit
  - c08-schneider-cmi-frequency-unit
  - c08-schneider-current-decade
  - c09-kohler-unit-system-register
  - c09-woodward-exponent-stability
  - c10-config-selected-unit
  - c10-register-type-profiles
  - c10-scaling-factor-register
  - p-janitza-lovato-klemsan-lovato-power-resolution
- id: non-linear-conversion
  title: Conversions the linear model cannot express
  decisions: D6, D9
  summary: >-
