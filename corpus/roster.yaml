  models: [SMP3, SMP6, SMP10]
  summary: >-
    A scale-factor register that divides by 10^SF cannot be expressed; exponent10 references only multiply.
  evidence: >-
    Smart Pyranometer Modbus Communication Manual 0426210, p5, IO_SCALE_FACTOR (PDU address 4, S16): "2 floating
    point result = integer register X / 100; 1 ... / 10; 0 ... X; -1 ... X * 10", applying to IO_SENSOR1_DATA (5),
    IO_RAW_SENSOR1_DATA (6), IO_SENSOR2_DATA (10), IO_RAW_SENSOR2_DATA (11).
  detail: >-
    exponent10: {point: scale_factor} computes raw × 10^SF, the inverse of the vendor rule. E007 forbids a conversion
    on the referenced point, so multiplier -1 cannot negate it, and the factor is dynamic (IO_AUTO_RANGE), so variants
    do not help. The contracts carry the irradiance unconverted and unitless with the rule in the description. Options
    for the maintainer: a sign on the reference (for example exponent10: {point: scale_factor, negate: true}) or
    allowing an integer multiplier of -1 on the referenced point.
  decision: D9 (D6)
  regression: >-
    input registers 4 = 0x0002, 5 = 0x3039 -> irradiance 123.45 W/m2; 4 = 0xFFFF, 5 = 0x0064 -> 1000 W/m2 (the current
    draft with exponent10 {point} would give 1234500 and 10).
  owner: maintainer
  class: 10
