- id: c06-measurement-saturation
  kind: question
  vendor: Schneider Electric
  models: [Sepam S20, Sepam T20, Sepam M20, REF615, REM615, RET615]
  summary: >-
    Sepam and the ABB 615 series clamp over-range measurements to the format maximum; the draft has no "saturated"
    quality.
  evidence: >-
    Data encoding, pdf page 111: "If a measurement overruns the maximum permissible value for the related format,
    the value read for the measurement will be the maximum permissible value for the format." ABB 1MRS756468 table
    11: "If the Modbus value exceeds the register size limit after the scaling, then it saturates at the register
    max value", and 3.4.8.7 "the register value always saturates at the min. and max. values for the register type
    in question. The value does not roll over." Unavailable ABB points "always return value 0" (REF615 pdf page
    17).
  detail: >-
    0xFFFF (16 NS) is a valid but clamped reading, not an `invalid` sentinel (§6.6). Should §6.6 offer an over-range
    or clamped quality? Zero-for-unavailable cannot be a sentinel either, because 0 is a legal value.
