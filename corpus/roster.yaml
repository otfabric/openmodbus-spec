- id: c02-schneider-4q-pf
  kind: spec-gap
  vendor: Schneider Electric
  models: [PM5560]
  summary: >-
    The four-quadrant float power factor needs a piecewise decode that the draft's linear conversion cannot express.
  evidence: >-
    PM556x workbook 'Data Types'!A15 "4Q FP PF" (B15 "Four Quadrant Floating Point Power Factor", C15 "-2 - 2",
    D15 N/A 0xFFC00000, E15 pseudo code). Used by 'Register List' row 230 Power Factor Total, register 3084, 2 registers,
    4Q_FP_PF; also rows 234 (3092), 4904 (27312), 4993 (27788).
  detail: >-
    E15: if reg > 1 then PF = 2 - reg, leading; if reg < -1 then PF = -2 - reg, leading; if |reg| = 1 then unity;
    otherwise PF = reg, lagging. §6.4 is one linear formula and §11 reserves conditional conversion (`when`). The
    same workbook offers plain float PF registers (3192 "Power Factor Total IEC", -1 to 1), so a contract can avoid
    the encoding, but the 4Q registers (including min/max) cannot be decoded. The INT16U "IEC" and "Lead Lag" PF
    registers (3196, 3197: "if a negative value is reported, add 32768 then divide by 1000" for lagging) are expressible
    as a 0x7FFF mask with exponent10 -3 plus a bit-15 flag point.
  decision: D6
  regression: >-
    f32 0x3F99 0x999A (1.2) -> 0.8, leading; f32 0xBFE6 0x6666 (-1.8) -> -0.2, leading; f32 0xBF4C 0xCCCD (-0.8)
    -> -0.8, lagging; f32 0x3F80 0x0000 (1.0) -> 1.0, unity (once the word order is known).
  owner: maintainer
  class: 2
