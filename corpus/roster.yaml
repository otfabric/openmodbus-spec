  detail: >-
    The 3200XT contract has no invalid sentinels for J1939 coolant temperature and oil pressure. 37528J uses 32766/32767
    for the 3400/3500; the 3000XT may do the same but the manual does not say so.
  owner: vendor
  class: 9
- id: c09-woodward-b37574-model-column
  kind: model-scope
  vendor: Woodward
  models: [easYgen-3200XT]
