- id: c07-enum-selected-scale-unit
  kind: spec-gap
  vendor: AutomationDirect
  models: [SIO-MB08THMS]
  summary: >-
    The scale and unit of a temperature register are selected by enum configuration registers, which 0.1 cannot
    express.
  evidence: >-
    SIO-MB08THMS guide PDF p. 5: 40041-40048 ANALOG INPUT #n VALUE, i16, "Values for thermocouple sensor types are
    stored with one implied decimal place. Values are stored with two implied decimal places for mV inputs" (examples
    246 -> 24.6 °C, 24656 -> 246.56 mV); Input Type 40031 (low byte channel 0, codes 1 = 250mV, 4-11 = TC J..N;
    PDF p. 4); Degree Units 41218 (0 Celsius, 1 Fahrenheit, 2 Kelvin; PDF p. 6). Same pattern without a stated formula:
    Moxa E1240 AI_mode 40025 selects the range of AI_rawValue 30001.
  detail: >-
    Checked: exponent10 point references (6.4) need a register holding the exponent itself, not a type code; enum
    (6.5) only names values; variants (5.6) are firmware/hardware, not runtime configuration; masks (6.3) and repeats
    (5.3) do not apply. Section 11 reserves conditional conversion ("when"). The contract fixes exponent10 -1 and
    unit Cel and states the condition in info.description.
  decision: D9 (dependencies), with D6 (numeric model) and D13 (units)
  regression: >-
    Input Type 40031 = 0x0505, Degree Units 41218 = 0x0000, 40041 = 0x00F6 -> ai_0 = 24.6 Cel. Input Type 40031
    = 0x0501, 41218 = 0x0000, 40041 = 0x6050 -> ai_0 = 246.56 mV. Input Type 40031 = 0x0505, 41218 = 0x0001, 40041
    = 0x00F6 -> ai_0 = 24.6 [degF].
  owner: maintainer
  class: 7
- id: c07-validity-from-status-register
  kind: spec-gap
  vendor: AutomationDirect
  models: [SIO-MB08THMS, ioLogik E1240]
  summary: >-
    A channel value's validity is flagged in a separate status register (or depends on a mode), which `invalid`
    sentinels cannot express.
  evidence: >-
    SIO-MB08THMS PDF p. 5: 40050 BREAK STATUS, bit n set "When a break condition is detected (e.g., broken sensor,
    disconnected cable, or over temperature)" for channel n, whose value is at 40041 + n. Moxa E1200 manual PDF
    p. 106 AI_status 30061+n (1 burnout, 2 over range, 3 under range) and section 3 p. 3-14: in 4-20 mA burnout
    mode raw 0000h means burnout and FFFFh over range, while 0000h is a valid raw value in the 0-10 V and 0-20 mA
    modes.
  detail: >-
    Checked: 6.6 `invalid` lists raw sentinels of the point itself, so a status bit in another register cannot invalidate
    it, and a sentinel that applies in one AI_mode only cannot be scoped. Section 11 reserves conditional availability
    ("when"). The contracts expose the status register as flags/enum and do not mark sentinels.
  decision: D9 (dependencies; failure => invalid)
  regression: >-
    40050 = 0x0001, 40041 = 0x0000 -> ai_0 invalid; 40050 = 0x0000, 40041 = 0x00F6 -> ai_0 = 24.6 Cel. E1240: 40025
    = 4 (4-20 mA burnout), 30001 = 0x0000 -> ai_raw_value[0] invalid; 40025 = 0 (0-10 V), 30001 = 0x0000 -> 0.
  owner: maintainer
  class: 7
