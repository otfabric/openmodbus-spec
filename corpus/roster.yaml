- id: c01-schneider-word-order
  kind: doc-ambiguity
  vendor: Schneider Electric
  models: [iEM3155, iEM3255, iEM3355]
  summary: DOCA0005EN never states the register order of Float32, UInt32 or Int64 values.
  evidence: >-
    DOCA0005EN-16 p.56 'Unit table' defines the types; no word-order statement or worked example anywhere (searched
    for order, significant, endian, MSW/LSW, example frames).
  detail: >-
    Blocks every core measurement (p.66-68). Needs a Schneider source that states the order (e.g. a Modbus FAQ or
    register-list file) before mapping. Also note the edition-pinned URL in this report.
  owner: vendor
  class: 1
- id: c01-schneider-int64-signedness
  kind: doc-ambiguity
  vendor: Schneider Electric
  models: [iEM3155, iEM3255, iEM3355]
  summary: Int64 is defined as unsigned on p.56 but called signed on p.67.
