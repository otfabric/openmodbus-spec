      format: pdf
      http_status: 200
      admitted: true
      notes: Roster URL on the bare host fails TLS as for SDM230; www host used.
  - vendor: Schneider Electric
    slug: schneider-electric
    models:
    - model: iEM3155
      status: mapped
      contracts: [devices/schneider-electric/iem3155/status.omb.yaml]
      source: schneider-electric-iem3000-user-manual
      layout: schneider-iem3000-doca0005en-16-direct
      encodings: [u16, mask, offset, enum, flags]
      notes: >-
        Partial contract: single-register UInt16 and Bitmap rows only (firmware version, clock bit fields, wiring,
        nominal frequency, tariff, serial settings, digital I/O mode, diagnostics bitmap, overload alarm status).
        Left out because the manual does not state the register order: every measurement and energy (Float32, Int64),
        the serial number (UInt32) and the UTF8 strings (p-schneider-meters-word-order). Also left out: the UInt16
        power factor registers 3196/3197 (no scale stated) and Digital Input Status (two-register Bitmap, and its
        Address 0x22C8 and Register 8906 disagree).
