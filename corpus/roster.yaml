- id: c05-tecsystem-disabled-channel-zero
  kind: spec-gap
  vendor: TECSYSTEM
  models: [NT935 AD, NT935 ETH, T1048 with Modbus]
  summary: >-
    A disabled channel reads temperature 0000 (0 degC); validity depends on a bit in another register.
  evidence: >-
    NT935 AD p. 20 notes for remote programming: "If the channel 4 is not enabled ... 1. Measured temperatures =
    0000 (0°C) ... 4. Channel setting = %xxxxxxx0"; the enable bit is CAN_enabled, bit 0 of "Ch4 Setting" (address
    60, CHn SETTING note p. 26); the value is "Ch4 temper." at address 37. T1048 p. 20 applies the same rule to
    every channel (Ch1..Ch4 temper. 25/29/33/37, settings 57..60).
  detail: >-
    0x0000 is also a legitimate 0 degC reading on an enabled channel, so listing it in `invalid` would discard real
    data, and the draft cannot make validity conditional on another point's bit (6.6 only knows raw sentinels, non-finite
    floats and failed dependencies). Spec 11 reserves "conditional conversion and availability (when)"; this is
    a concrete corpus case for it. The contracts only say it in the description.
  decision: D9
  regression: >-
    ch4_setting (HR 60) = 0x0000, ch4_temperature (HR 37) = 0x0000 -> expected ch4_temperature invalid; the draft
    yields 0 Cel good. With ch4_setting = 0x0001 and the same raw value -> 0 Cel good.
  owner: maintainer
  class: 5
