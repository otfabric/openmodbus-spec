- id: 6
  name: Protection relays
  vendors:
  - vendor: ABB
    slug: abb
    models:
    - model: REF615
      status: mapped
      contracts: [devices/abb/ref615/protection.omb.yaml]
      source: abb-ref615-modbus
      layout: abb-615-point-list-ref615-v3.0
      encodings: [flags, mask, discrete_input_bool, holding_register]
      notes: >-
        Pinned to REF615 Ver. 3.0, standard configurations FE01-FE08; indication bits only. Points: start, operate
        and master trip flags (171), phase and residual current high alarm/warning flags (172), two trip-circuit
        alarm masks (173.12, 173.14), CB position flags (175), CB condition monitoring alarm and lockout flags (178,
        listed under "Circuit breaker condition monitoring, FE02,04,05,06", which the description names) and the
        CB closed 1X bit (2804). The extractor reads the configuration heading above each indication row and names
        it when it is not "all variants"; it requires the MCD copy on the next bit wherever a description says so.
        Left out, by the default-offset decision (rule 4, c06-abb-default-offset): every row of Table 2 Registers,
        since each carries a scale and passes through scaleFactor/Offset, including the CB operation counter and
        the internal fault code (scale 1). The earlier contract had phase currents, residual current, object temperature,
        voltage, active power, power factor, frequency, CB operation counter and internal fault code. SSR1 (register
        128, "See Modbus CPM") is left out because the protocol manuals and the RET615 point list give different
        bit meanings (c06-abb-ssr1-bit-conflict). The low warning/alarm bits of 172 are left out for parity with
        REM615 (c06-abb-scale-range-mismatch). Also left out: event/fault records and time structures (c06-time-tagged-records),
        controls and writes.
    - model: REM615
      status: mapped
      contracts: [devices/abb/rem615/protection.omb.yaml]
      source: abb-rem615-modbus
      layout: abb-615-point-list-rem615-v2.0
      encodings: [flags, mask, discrete_input_bool, holding_register]
      notes: >-
        Pinned to REM615 Ver. 2.0, standard configuration ME03; indication bits only, the same seven points as REF615
        (171, 172, 173.12, 173.14, 175, 178 and the CB closed 1X bit 2804). Left out by the default-offset decision:
        every Table 2 register row, including the thermal level, thermal level at start, forward active energy,
        CB operation counter and internal fault code. 172.04/172.06 (low warning/alarm) are left out because their
        labels are swapped (c06-abb-scale-range-mismatch). SSR1 is left out (c06-abb-ssr1-bit-conflict).
    - model: RET615
      status: mapped
      contracts: [devices/abb/ret615/protection.omb.yaml]
      source: abb-ret615-ansi-modbus
      layout: abb-615-point-list-ret615-ansi-v5.0fp1
      encodings:
      - u16_exponent10
      - i16
      - flags
      - mask
      - discrete_input_bool
      - holding_register
      notes: >-
        Pinned to RET615 ANSI Ver. 5.0 FP1. Points: HV-side and MV-side phase currents (CMMXU1/CMMXU2), 87T differential
        currents, 49T object temperature, tap position (84T), CB operation counter, internal fault code, global
        pickup/trip and master trip flags (171), CB position flags (175), 87T trip flags (187), two trip-circuit
        alarm masks (173.12, 173.14) and the CB closed 1X bit. The SSR1 device health flags of the first RET615
        contract were removed: table 127 gives 128.00 "Device global error" and 128.01 "Device global warning",
        while the pinned ANSI protocol manual (table 18) gives bit 0 warning and bit 1 error (c06-abb-ssr1-bit-conflict).
        The offset default is stated in the point list itself, so the measurands stay. The extractor requires that
        table 2 lists each function used (CMMXU, TR2PTDF, T2PTTR, TPOSYLTC, CBXCBR1, TCSSCBR, TRPPTRC) in both configurations
        B and F. Left out: phase voltages, residual voltage, power and frequency, which table 2 lists for configuration
        F only (frequency has no default register at all, 2.4.2); residual current, because table 2 lists one RESCMMXU
        instance "IG (2)" for the MV side while the registers list both RESCMMXU1 (141) and RESCMMXU2 (155), and
        "(2)" marks the side, not the instance (VMMXU is "VA, VB, VC (2)" but only VMMXU1 exists); the relative
        temperature (147, unit "[C]" for a relative value, see c06-abb-scale-range-mismatch); demand and event structures.
        ANSI and IEC naming differences against the REF615/REM615 point lists: the ANSI list splits the IEC 61850
        name into a group line (logical device and node) and a row (".A.phsA.instCVal.mag"), with columns BitA/RegA
        instead of "Bit addr"/"Reg.bit addr"; measurement designations are ANSI (IA, IB, IC, IG, VA, VG; function
        numbers 49T, 87T, 84T, 52, TCM, 86/94) where the IEC lists use IL1-IL3, Io and IEC 60617 symbols; LEDPTRC1
        Str/Op are labelled "Global pickup" and "Global trip" (values 1=Pickup, 1=Trip) where REF615 says "Start"
        and "Operate", so the RET615 flags are named pickup and trip instead of start and operate; the trip-circuit
        alarm attribute is "TCSSCBR1.CircAlm.stVal" where REF615/REM615 write "CirAlm"; the temperature unit is
        written "[C]" where REF615 writes "[Celsius]"; and the zero-sequence rows (144 and 150) repeat ".SeqA.c2"
        where REF615 has ".SeqA.c3" (not mapped). The IEC 61850 names are kept verbatim as aliases.
    sources:
    - id: abb-ref615-modbus
      title: Relion 615 series REF615 Modbus Point List Manual
      revision: 1MRS756581 rev. D, issued 2010-06-11, product version 3.0
      url: https://library.e.abb.com/public/6e6afc6bb11fa2bbc1257b0c00560230/REF615_modbuspoint_756581_ENd.pdf
      landing_url: https://library.e.abb.com/public/6e6afc6bb11fa2bbc1257b0c00560230/REF615_modbuspoint_756581_ENd.pdf
      format: pdf
      http_status: 200
      admitted: true
      notes: >-
        Two fetches identical. run.py fetched it itself into an empty cache (admission tested from this machine).
        The point list names 1MRS756468 as its protocol manual (1.3.3, pdf page 12); that manual is pinned as evidence.
        It confirms the address base and bit rule, and states that every register value is value x scaleFactor +
        Offset with both configurable (3.4.5) but gives no default Offset, so the measurands are not mapped (c06-abb-default-offset).
        Its revision history covers product series 3.0 (revisions G and H).
    - id: abb-rem615-modbus
      title: Relion 615 series REM615 Modbus Point List Manual
      revision: 1MRS756877 rev. A, issued 2009-07-03, product version 2.0
      url: https://library.e.abb.com/public/70d8ff196a5b4f6cc1257b0c00560c63/REM615_modbuspoint_756877_ENa.pdf
      landing_url: https://library.e.abb.com/public/70d8ff196a5b4f6cc1257b0c00560c63/REM615_modbuspoint_756877_ENa.pdf
      format: pdf
      http_status: 200
      admitted: true
      notes: >-
        Two fetches identical; fetched by run.py into an empty cache. The point list names 1MRS756468 as its protocol
        manual (1.3.3, pdf page 11); the same pinned evidence as REF615 (one document, one pin) confirms the address
        base and bit rule and leaves the default Offset unstated, so the measurands are not mapped. Its revision
        history covers product series 2.0 (revisions E and F).
    - id: abb-ret615-ansi-modbus
      title: Relion 615 series RET615 ANSI Modbus Point List Manual
      revision: 1MAC203705-MB rev. B, 2019-06-07, product version 5.0 FP1
      url: https://library.e.abb.com/public/a1aa125c30c9473989a8e24a8873ffdd/RET615_ANSI_modbuspoint_203705_ENb.pdf
      landing_url: https://library.e.abb.com/public/a1aa125c30c9473989a8e24a8873ffdd/RET615_ANSI_modbuspoint_203705_ENb.pdf
      format: pdf
      http_status: 200
      admitted: true
      notes: >-
        Two fetches identical; fetched by run.py into an empty cache. Admitted now that the protocol manual is pinned
        as evidence. The ANSI point list names the ANSI protocol manual 1MAC057386-MB, not 1MRS756468, so RET615
        pins that edition (same product version 5.0 FP1, same statements). The point list itself states "Scale factor
        as default. Also, an adjustable offset value exists that is set to 0 by default." (table 110, pdf page 71).
