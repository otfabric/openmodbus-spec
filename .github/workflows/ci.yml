name: CI
run-name: "CI (${{ github.event_name }}) on ${{ github.ref_name }} by @${{ github.actor }}"

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: make check
        env:
          PYTHON: python
  corpus:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PDF extraction tool
        run: |
          if ! command -v pdftotext >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y poppler-utils
          fi
      - name: Download, extract and verify public mappings
        run: make corpus CORPUS_SET=pilot
        env:
          PYTHON: python
          CORPUS_CACHE: ${{ runner.temp }}/openmodbus-corpus
      - name: Rebuild the catalog offline
        run: |
          rm devices/victron/cerbo-gx/system.omb.yaml devices/eastron/sdm120-modbus/telemetry.omb.yaml
          make corpus CORPUS_SET=pilot CORPUS_ARGS="--offline --write-catalog"
          make corpus CORPUS_SET=pilot CORPUS_ARGS=--offline
          git diff --exit-code -- devices/
        env:
          CORPUS_CACHE: ${{ runner.temp }}/openmodbus-corpus
      - name: Measure the Socomec source
        run: |
          source_file="$(mktemp "$RUNNER_TEMP/socomec.XXXXXXXX")"
          trap 'rm -f "$source_file"' EXIT
          curl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' --max-time 30 --output "$source_file" 'https://apac.socomec.com/sites/default/files/2025-01/COUNTIS-E43-MODBUS---ACTIVE-ENERGY-METERS_COMMUNICATION-TABLE_2025-01_CMT201266_EN.html'
          sha256sum "$source_file"
          wc -c < "$source_file"
          file "$source_file"
          python - "$source_file" <<'PY'
          import pathlib, re, sys
          data = pathlib.Path(sys.argv[1]).read_bytes()
          print(repr(data[:180]))
          print(repr(data[max(0,data.find(b'51284')-50):data.find(b'51284')+300]))
          PY
