name: CI
run-name: "CI (${{ github.event_name }}) on ${{ github.ref_name }} by @${{ github.actor }}"

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: make check
        env:
          PYTHON: python
  corpus:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PDF extraction tool
        run: |
          if ! command -v pdftotext >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y poppler-utils
          fi
      # Live downloads only for sources this pull request changes; the scheduled
      # corpus-health workflow re-fetches every source.
      - name: Download, extract and verify changed sources
        run: make corpus CORPUS_ARGS="--changed-from origin/$BASE_REF --write-catalog"
        env:
          PYTHON: python
          BASE_REF: ${{ github.base_ref }}
          CORPUS_CACHE: ${{ runner.temp }}/openmodbus-corpus
      - name: Rebuild changed sources offline and compare the catalog
        run: |
          make corpus CORPUS_ARGS="--changed-from origin/$BASE_REF --offline"
          if [ -n "$(git status --porcelain -- devices/)" ]; then
            git status --short -- devices/
            git diff -- devices/
            exit 1
          fi
        env:
          BASE_REF: ${{ github.base_ref }}
          CORPUS_CACHE: ${{ runner.temp }}/openmodbus-corpus
