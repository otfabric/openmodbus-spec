name: CI
run-name: "CI (${{ github.event_name }}) on ${{ github.ref_name }} by @${{ github.actor }}"

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: make check
        env:
          PYTHON: python
  corpus:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PDF extraction tool
        run: |
          if ! command -v pdftotext >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y poppler-utils
          fi
      - name: Download, extract and verify public mappings
        run: make corpus CORPUS_SET=pilot
        env:
          PYTHON: python
          CORPUS_CACHE: ${{ runner.temp }}/openmodbus-corpus
      - name: Rebuild the catalog offline
        run: |
          rm devices/victron/cerbo-gx/system.omb.yaml devices/eastron/sdm120-modbus/telemetry.omb.yaml
          make corpus CORPUS_SET=pilot CORPUS_ARGS="--offline --write-catalog"
          make corpus CORPUS_SET=pilot CORPUS_ARGS=--offline
          git diff --exit-code -- devices/
        env:
          CORPUS_CACHE: ${{ runner.temp }}/openmodbus-corpus
      - name: Verify public source candidates
        run: |
          source_file="$(mktemp "$RUNNER_TEMP/map.XXXXXXXX")"
          trap 'rm -f "$source_file"' EXIT
          for url in 'https://emea.socomec.com/sites/default/files/2022-11/COUNTIS-E43-MODBUS---ACTIVE-ENERGY-METERS_COMMUNICATION-TABLE_2019-09_CMT201266_EN.html' 'https://emea.socomec.com/sites/default/files/2025-01/COUNTIS-E43-MODBUS---ACTIVE-ENERGY-METERS_COMMUNICATION-TABLE_2025-01_CMT201266_EN.html' 'https://docs.brainboxes.com/reference/protocols/ed-modbus-product-data-tables' 'https://www.brainboxes.com/files/catalog/product/ED/ED-588/documents/Brainboxes%20Modbus%20TCP%20Manual.pdf'; do
            printf '%s\n' "$url"
            if curl -fsSL --proto '=https' --proto-redir '=https' --max-time 15 -o "$source_file" "$url"; then
              sha256sum "$source_file"
              wc -c < "$source_file"
              file "$source_file"
              python - "$source_file" <<'PY'
          import pathlib, sys
          data = pathlib.Path(sys.argv[1]).read_bytes()
          print(repr(data[:120]))
          for key in (b'51284', b'ED-588'):
              index = data.find(key)
              if index >= 0:
                  print(repr(data[index-60:index+260]))
          PY
            fi
          done
