openmodbus: 0.1.0
info:
  id: victron/easysolar-ii-gx/vebus
  title: Victron EasySolar-II GX VE.Bus telemetry through its built-in GX device
  version: 0.1.0
  description: 'Read-only subset of the com.victronenergy.vebus service that a GX
    device serves for a VE.Bus inverter/charger (GX Modbus-TCP register list 3.81,
    document Rev 54). The inverter/charger has no Modbus interface of its own: the
    GX device is the Modbus TCP server and gateway, and the unit ID selects the VE.Bus
    system. Values are those of the whole VE.Bus system; units in a parallel or three-phase
    system are not addressed one by one. Addresses are request addresses and the Scalefactor
    column is a divisor, as the mapping example of the GX Modbus-TCP Manual shows.
    Not every register is available on every product. VE.Bus state of charge is writable
    on the GX; this contract only reads it. 32-bit registers are left out because
    the register list does not state their word order.

    '
  attribution: Derived from Victron Energy's GX Modbus-TCP register list.
  source: integrator
  verification: documented
  x-otfabric-corpus-source: victron-gx-vebus
device:
  manufacturer: Victron Energy
  family: VE.Bus inverter/charger
  model: EasySolar-II GX
  classes:
  - energy_storage
  - battery_inverter
  transports:
  - type: tcp
    notes: Served by the built-in GX device acting as Modbus TCP gateway for the internal
      VE.Bus inverter/charger.
  unitId:
    notes: 'Assigned by the GX device. Since Venus OS 2.60 unit IDs are dynamic and
      generally equal the VE.Bus device instance; the GX lists them under Settings,
      Integrations, Modbus TCP server, Available services. Preferred ID for the built-in
      VE.Bus port: 228.'
  documentation:
  - title: GX Modbus-TCP register list
    url: https://www.victronenergy.com/upload/documents/CCGX-Modbus-TCP-register-list-3.81.xlsx
    revision: 3.81 (document Rev 54)
  - title: GX Modbus-TCP Manual
    url: https://www.victronenergy.com/live/ccgx:modbustcp_faq?rev=1743181803
    revision: wiki revision 1743181803 (2025-03-28 17:10 UTC)
defaults:
