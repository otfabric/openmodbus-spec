openmodbus: 0.1.0
info:
  id: carlo-gavazzi/em24-is/telemetry
  title: Carlo Gavazzi EM24-IS telemetry
  version: 0.1.0
  description: Read-only subset of the EM24-IS (SFA and SFB versions) Modbus RTU map
    (Table 2.3-1); the document marks the power, demand and most energy registers
    of the EM24-DIN map as reserved. Function codes 03 and 04 return the same values;
    the points use the input-register (function 04) table. 32-bit values are least
    significant word first. A request reads at most 11 registers; the digital input,
    firmware, front selector and identification registers must be read one word at
    a time. The document says the display shows overflow when the MSB value of the
    relevant variable is 7FFFh; no `invalid` list here expresses that.
  attribution: Derived from Carlo Gavazzi's EM24-IS SFA and SFB versions Communication
    Protocol.
  source: integrator
  verification: documented
  x-otfabric-corpus-source: carlo-gavazzi-em24-is-protocol
device:
  manufacturer: Carlo Gavazzi
  model: EM24-IS
  classes:
  - energy_meter
  transports:
  - type: rtu
  documentation:
  - title: EM24-IS SFA and SFB versions Communication Protocol
    url: https://www.gavazziautomation.com/fileadmin/images/PIM/OTHERSTUFF/COMPRO/EM24_IS_SFA_SFB.pdf
    revision: Revision 2.0
defaults:
  table: input_register
  access: r
constraints:
  maxReadRegisters: 11
  ranges:
  - table: input_register
    start: 11
    count: 1
    policy: isolated
    reason: 'Vendor: read only with function 03 or 04, limited to a word at a time.'
  - table: input_register
    start: 768
    count: 1
    policy: isolated
    reason: 'Vendor: read only with function 03 or 04, limited to a word at a time.'
  - table: input_register
    start: 770
    count: 1
    policy: isolated
    reason: 'Vendor: read only with function 03 or 04, limited to a word at a time.'
  - table: input_register
    start: 772
    count: 1
    policy: isolated
    reason: 'Vendor: read only with function 03 or 04, limited to a word at a time.'
