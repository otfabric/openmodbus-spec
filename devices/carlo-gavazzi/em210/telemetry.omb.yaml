openmodbus: 0.1.0
info:
  id: carlo-gavazzi/em210/telemetry
  title: Carlo Gavazzi EM210 telemetry
  version: 0.1.0
  description: 'Read-only subset of the EM210 Modbus RTU map (Table 2.3-1, grouped
    by variable type); the document is titled EM210_AV. Function codes 03 and 04 return
    the same values; the points use the input-register (function 04) table. 32-bit
    values are least significant word first. The firmware, programming lock and identification
    registers must be read one word at a time. The document says the display shows
    overflow when the MSB value of the relevant variable is 7FFFh; no `invalid` list
    here expresses that. Frequency is left out: the document gives its weight as Hz
    without a factor. The document gives two request limits (61 registers in the text,
    11 in the frame tables); none is set here.'
  attribution: Derived from Carlo Gavazzi's EM210_AV Communication Protocol.
  source: integrator
  verification: documented
  x-otfabric-corpus-source: carlo-gavazzi-em210-protocol
device:
  manufacturer: Carlo Gavazzi
  model: EM210
  classes:
  - energy_meter
  transports:
  - type: rtu
  documentation:
  - title: EM210_AV Communication Protocol
    url: https://www.gavazziautomation.com/fileadmin/images/PIM/OTHERSTUFF/COMPRO/EM210_CP.pdf
    revision: Version 4 Revision 3 (2018-05-10)
defaults:
  table: input_register
  access: r
constraints:
  ranges:
  - table: input_register
    start: 11
    count: 1
    policy: isolated
    reason: 'Vendor: read only with function 03 or 04, limited to a word at a time.'
  - table: input_register
    start: 770
    count: 1
    policy: isolated
    reason: 'Vendor: read only with function 03 or 04, limited to a word at a time.'
  - table: input_register
    start: 771
    count: 1
    policy: isolated
    reason: 'Vendor: read only with function 03 or 04, limited to a word at a time.'
  - table: input_register
    start: 772
    count: 1
    policy: isolated
    reason: 'Vendor: read only with function 03 or 04, limited to a word at a time.'
