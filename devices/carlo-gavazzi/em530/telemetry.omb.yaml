openmodbus: 0.1.0
info:
  id: carlo-gavazzi/em530/telemetry
  title: Carlo Gavazzi EM530 telemetry
  version: 0.1.0
  description: 'Read-only subset of the EM530/EM540 Modbus RTU map (table grouped
    by phase). Function codes 03 and 04 return the same values; the points use the
    input-register (function 04) table. 32-bit values are least significant word first.
    The firmware version and identification code registers must be read one word at
    a time. The document marks overflow by an MSW of 7FFFh, which no `invalid` list
    here expresses.

    '
  attribution: Derived from Carlo Gavazzi's EM530/EM540 Modbus Communication Protocol.
  source: integrator
  verification: documented
  x-otfabric-corpus-source: carlo-gavazzi-em530-em540-protocol
device:
  manufacturer: Carlo Gavazzi
  model: EM530
  classes:
  - energy_meter
  transports:
  - type: rtu
  documentation:
  - title: EM530/EM540 Modbus Communication Protocol
    url: https://www.gavazziautomation.com/fileadmin/images/PIM/OTHERSTUFF/COMPRO/EM500_CPP_Mod_V1.3_13022024.pdf
    revision: Version 1.3 (2024-02-13)
defaults:
  table: input_register
  access: r
constraints:
  ranges:
  - table: input_register
    start: 11
    count: 1
    policy: isolated
    reason: 'Vendor: read only with function 03 or 04, limited to a word at a time.'
  - table: input_register
    start: 770
    count: 1
    policy: isolated
    reason: 'Vendor: read only with function 03 or 04, limited to a word at a time.'
points:
- id: identification_code
  address: 11
  type: u16
  enum:
    values:
    - value: 1744
      name: em530dinav53xs1x
      label: EM530DINAV53XS1X
    - value: 1745
      name: em530dinav53xs1pfa
      label: EM530DINAV53XS1PFA
    - value: 1746
      name: em530dinav53xs1pfb
      label: EM530DINAV53XS1PFB
    - value: 1747
      name: em530dinav53xs1pfc
      label: EM530DINAV53XS1PFC
  stability: constant
  aliases:
  - Carlo Gavazzi Controls identification code
  source:
    address: 000Bh
    page: 18
    reference: Carlo Gavazzi Controls identification code; 300012
- id: active_power_total
