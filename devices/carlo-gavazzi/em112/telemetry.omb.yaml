openmodbus: 0.1.0
info:
  id: carlo-gavazzi/em112/telemetry
  title: Carlo Gavazzi EM112 telemetry
  version: 0.1.0
  description: Read-only subset of the EM100/ET100 series Modbus RTU map (Table 2.4-1)
    for the EM112. Function codes 03 and 04 return the same values; the points use
    the input-register (function 04) table. 32-bit values are least significant word
    first. The document gives 7FFFFFFFh (wire order FFFF 7FFF) as the overflow value
    of a 32-bit variable; the voltage, current and power points list it as invalid.
    The identification code at 000Bh lies inside W dmd (000Ah-000Bh) and is left out.
    The additional energy totalizers at 0400h and 0500h exist only from firmware b.10
    (meters made from 2020) and are left out. The document gives two request limits
    (50 registers in the text, 20 in the frame tables); none is set here.
  attribution: Derived from Carlo Gavazzi's EM100 Series and ET100 Series Communication
    Protocol.
  source: integrator
  verification: documented
  x-otfabric-corpus-source: carlo-gavazzi-em100-et100-protocol
device:
  manufacturer: Carlo Gavazzi
  model: EM112
  family: EM100 Series
  classes:
  - energy_meter
  transports:
  - type: rtu
  documentation:
  - title: EM100 Series and ET100 Series Communication Protocol
    url: https://www.gavazziautomation.com/fileadmin/images/PIM/OTHERSTUFF/COMPRO/1-phase%20Modbus%20serial%20protocol%20EM%20and%20ET-rev.2.14.pdf
    revision: Version 2 Revision 14
