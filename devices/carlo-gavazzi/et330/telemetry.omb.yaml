openmodbus: 0.1.0
info:
  id: carlo-gavazzi/et330/telemetry
  title: Carlo Gavazzi ET330 telemetry
  version: 0.1.0
  description: Read-only subset of the EM300/ET300 series Modbus RTU map (Table 2.4-1,
    grouped by variable type) for the ET330. Function codes 03 and 04 return the same
    values; the points use the input-register (function 04) table. 32-bit values are
    least significant word first. The document gives 7FFFFFFFh (wire order FFFF 7FFF)
    as the overflow value of a 32-bit variable; the voltage, current and power points
    list it as invalid. The identification code must be read one word at a time. The
    document gives two request limits (50 registers in the text, 20 in the frame tables);
    none is set here.
  attribution: Derived from Carlo Gavazzi's EM300 Series and ET300 Series Communication
    Protocol.
  source: integrator
  verification: documented
  x-otfabric-corpus-source: carlo-gavazzi-em300-et300-protocol
device:
  manufacturer: Carlo Gavazzi
  model: ET330
  family: ET300 Series
  classes:
  - energy_meter
  transports:
  - type: rtu
  documentation:
  - title: EM300 Series and ET300 Series Communication Protocol
    url: https://www.gavazziautomation.com/fileadmin/images/PIM/OTHERSTUFF/COMPRO/EM330_EM340_ET330_ET340_CP.pdf
    revision: Version 2 Revision 17 (2021-07-05)
defaults:
  table: input_register
  access: r
constraints:
  ranges:
  - table: input_register
    start: 11
    count: 1
    policy: isolated
    reason: 'Vendor: read only with function 03 or 04, limited to a word at a time.'
