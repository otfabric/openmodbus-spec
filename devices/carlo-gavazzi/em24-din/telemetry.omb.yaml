  source:
    address: 005Ch
    page: 8
    reference: Table 2.3-1; 300093
- id: digital_input_status
  address: 768
  type: u16
  flags:
    flags:
    - bit: 0
      name: ch1_open
      label: input status Ch1
      description: bit=0 input close, bit=1 input open
    - bit: 1
      name: ch2_open
      label: input status Ch2
      description: bit=0 input close, bit=1 input open
    - bit: 2
      name: ch3_open
      label: input status Ch3
      description: bit=0 input close, bit=1 input open
  aliases:
  - Digital input status
  source:
    address: 0300h
    page: 8
    reference: Table 2.4-1; 300769
- id: current_tariff
  address: 769
  type: u16
  enum:
    values:
    - value: 0
      name: tariff_1
      label: tariff 1
    - value: 1
      name: tariff_2
      label: tariff 2
    - value: 2
      name: tariff_3
      label: tariff 3
    - value: 3
      name: tariff_4
      label: tariff 4
  aliases:
  - Current tariff
  source:
    address: 0301h
    page: 9
    reference: Table 2.5-1; 300770
- id: front_selector_status
  address: 772
  type: u16
  enum:
    values:
    - value: 3
      name: keypad_locked
      label: keypad locked
    - value: 2
      name: keypad_unlocked_2
      label: keypad unlocked
    - value: 1
      name: keypad_unlocked_1
      label: keypad unlocked
    - value: 0
      name: keypad_unlocked_0
      label: keypad unlocked
  aliases:
  - Front selector status
  source:
    address: 0304h
    page: 9
    reference: Table 2.7-1; 300773
