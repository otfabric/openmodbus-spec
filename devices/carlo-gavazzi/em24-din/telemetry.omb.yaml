  source:
    address: 0036h
    page: 8
    reference: Table 2.3-1; 300055
- id: frequency
  address: 55
  type: i16
  conversion:
    exponent10: -1
  unit: Hz
  aliases:
  - Hz
  source:
    address: 0037h
    page: 8
    reference: Table 2.3-1; 300056
- id: import_active_energy
  address: 62
  type: i32
  wordOrder: little
  conversion:
    exponent10: -1
  unit: kW.h
  aliases:
  - kWh(+) TOT
  source:
    address: 003Eh
    page: 8
    reference: Table 2.3-1; 300063
- id: export_active_energy
  address: 92
  type: i32
  wordOrder: little
  conversion:
