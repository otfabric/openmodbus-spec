openmodbus: 0.1.0
info:
  id: vaisala/opt100/telemetry
  title: Vaisala OPT100 DGA monitor telemetry
  version: 0.1.0
  description: 'Read-only subset of the OPT100 Modbus registers (Appendix A): status
    bits, gas caution and alarm bit fields, 32-bit float gas, moisture, temperature
    and pressure values, and one 16-bit integer gas value. 32-bit values are least
    significant word first; the user guide''s own A.6 example contradicts that order,
    so read test_value_u32 (expected 1234567890) to confirm the order on a real device.
    The 64-bit measurement timestamp and the scaled 16-bit values are left out.

    '
  attribution: Derived from Vaisala's Optimus DGA Monitor for power transformers OPT100
    User Guide.
  source: integrator
  verification: documented
  x-otfabric-corpus-source: vaisala-opt100
device:
  manufacturer: Vaisala
  family: Optimus DGA Monitor
  model: OPT100
  classes:
  - transformer_monitor
  transports:
  - type: tcp
    notes: Modbus TCP over the ETH0 interface, server port 502.
  - type: rtu
    notes: RS-485; default 19200 baud, 8 data bits, even parity, 1 stop bit.
  unitId:
    mode: configurable
    default: 240
    notes: Default Modbus RTU slave address 240 (Table 8).
  documentation:
  - title: Optimus DGA Monitor for power transformers OPT100 User Guide
    url: https://docs.vaisala.com/r/M211858EN-AC/en-US/GUID-E824E3DB-16EE-4BB4-80A0-57E39B595A65
    revision: M211858EN-AC
defaults:
  table: holding_register
  access: r
points:
- id: device_stopped
  address: 0
  type: u16
  mask: 1
  enum:
    values:
    - value: 0
      name: measuring_normally
      label: Device measuring normally
    - value: 1
      name: stopped
      label: Device stopped (either automatically or by administrator), being initialized,
        or being uninstalled
  description: Only the first bit of the register is used.
  aliases:
  - Device stopped
  source:
    address: '1'
    page: 139
    reference: Table 35 Status registers
- id: measurement_reliable
  address: 2
  type: u16
  mask: 1
  enum:
    values:
    - value: 0
      name: unreliable
      label: Measurement is unreliable because of high ambient temperature
    - value: 1
      name: reliable
