openmodbus: 0.1.0
info:
  id: siemens/7rw80/protection
  title: Siemens SIPROTEC 7RW80 indications and measured values
  version: 0.1.0
  description: 'Read-only subset of Modbus standard mapping 3-1 for the 7RW80 (firmware
    V4.60 or higher) with a Modbus communication module (firmware 04.00.05 or higher,
    hardware version 4 or higher). Indications follow the 7RW80 functional scope;
    measured values use the default scaling, which depends on the full-scale parameter
    1101 and can be changed.

    '
  attribution: Derived from Siemens' SIPROTEC Communication Modules Modbus Bus mapping
    7SJ80/7SK80/7RW80.
  source: integrator
  verification: documented
  x-otfabric-corpus-source: siemens-siprotec-7sx80-modbus
device:
  manufacturer: Siemens
  family: SIPROTEC
  model: 7RW80
  classes:
  - protection_relay
  documentation:
  - title: SIPROTEC Communication Modules Modbus Bus mapping 7SJ80/7SK80/7RW80
    url: https://cache.industry.siemens.com/dl/files/228/109743228/att_903021/v1/com_modbus_7sj80_7sk80_7rw80_us.pdf
    revision: C53000-L2240-A320-3, edition September 2010
