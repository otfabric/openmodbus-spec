- id: diagnostics
  table: holding_register
  address: 128
  type: u16
  flags:
    flags:
    - bit: 0
      name: device_ok
      label: Device OK
    - bit: 1
      name: settings_calculation
      label: Settings Calc.
    - bit: 2
      name: protection_active
      label: ProtActive
    - bit: 3
      name: error_summary_alarm
      label: Error Sum Alarm
    - bit: 4
      name: alarm_summary_event
      label: Alarm Sum Event
    - bit: 5
      name: relay_pickup
      label: Relay PICKUP
    - bit: 6
      name: relay_trip
      label: Relay TRIP
    - bit: 8
      name: test_mode
      label: Test mode
    - bit: 15
      name: data_invalid
      label: Data invalid
  description: Diagnostic register; bit n is listed as 40129/2^n. Data invalid (bit
    15) is set by the Modbus slave when the data in the message are invalid.
  source:
    address: '40129'
    page: 31
    reference: Chapter 1.6.3 Diagnostics
