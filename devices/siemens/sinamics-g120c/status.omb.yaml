openmodbus: 0.1.0
info:
  id: siemens/sinamics-g120c/status
  title: Siemens SINAMICS G120C drive status and actual values
  version: 0.1.0
  description: 'Read-only subset of the Modbus RTU register tables 5-12 to 5-15 for
    the G120C USS/MB (table 5-1), firmware V4.7 SP13: status word, speed, frequency,
    voltage, current, torque, power, energy, analog input and output, fault and alarm
    numbers. Registers are holding registers read with FC 03. Register 4xxxx is sent
    as address xxxx - 1: the manual''s read example sends 00 6D for register 40110.
    A scaled register holds the value multiplied by the scaling factor; the manual
    does not say so, but its ranges at factor 100 end at 327.67. The tables state
    no data type: a register whose documented range has a negative bound is decoded
    as signed, any other as unsigned, which gives the same value over the documented
    range. The main actual value (40111) is left out because the tables give it no
    unit, range or data type, and the registers with ON/OFF texts because the manual
    does not state their values. The status word carries the converter''s process
    data 1; its bits depend on the interconnection in the converter.

    '
  attribution: Derived from Siemens' SINAMICS G120, G120P, G120C, G120D, G110M, G115D
    Fieldbuses Function Manual.
  source: integrator
  verification: documented
  x-otfabric-corpus-source: siemens-g120-fieldbus-manual
device:
  manufacturer: Siemens
  family: SINAMICS G120
  model: SINAMICS G120C
  classes:
  - drive
  transports:
  - type: rtu
    notes: G120C USS/MB on RS485; select Modbus RTU with p2030 = 2.
  documentation:
  - title: SINAMICS G120, G120P, G120C, G120D, G110M, G115D Fieldbuses Function Manual
    url: https://cache.industry.siemens.com/dl/files/930/109791930/att_1049446/v1/G120_fieldbus_fct_man_1120_en-US.pdf
    revision: A5E34229197B AG, 11/2020, FW V4.7 SP13
