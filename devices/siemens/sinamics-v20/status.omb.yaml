openmodbus: 0.1.0
info:
  id: siemens/sinamics-v20/status
  title: Siemens SINAMICS V20 inverter status and actual values
  version: 0.1.0
  description: 'Read-only subset of the MODBUS mapping table (section 7.2): status
    word, frequency, speed, current, torque, power, energy, voltages, analog input
    and output, last fault and warning, inverter version and model. Registers are
    holding registers read with FC 3. The table prints each register as an inverter
    register number and as a MODBUS number, 0 and 40001 in its first row; the inverter
    number is used as the address. A scaled register holds the value multiplied by
    the scaling factor. The table states no data type: a register whose documented
    range has a negative bound is decoded as signed, any other as unsigned, which
    gives the same value over the documented range. Most values are listed a second
    time from register 40200 on; the first listing is used. The status word flags
    are the bits the table assigns to its single-bit registers; it does not state
    which text of an ON/OFF pair stands for 1.

    '
  attribution: Derived from Siemens' SINAMICS V20 Inverter Operating Instructions.
  source: integrator
  verification: documented
  x-otfabric-corpus-source: siemens-v20-operating-instructions
device:
  manufacturer: Siemens
  family: SINAMICS V20
  model: SINAMICS V20
  classes:
  - drive
  transports:
  - type: rtu
    notes: RS485; select MODBUS with P2023 = 2.
  documentation:
  - title: SINAMICS V20 Inverter Operating Instructions
    url: https://cache.industry.siemens.com/dl/files/193/109756193/att_942991/v1/V20_op_instr_0118_en-US.pdf
    revision: A5E34559884-009, 01/2018
