- id: status_word
  address: 109
  type: u16
  aliases:
  - ZSW
  flags:
    flags:
    - bit: 0
      name: enabled
      label: Enabled
      description: ON/OFF texts ON / OFF; also readable as register 37 (40038).
    - bit: 1
      name: ready_to_run
      label: Ready to run
      description: ON/OFF texts READY / OFF; also readable as register 38 (40039).
    - bit: 2
      name: stop_run
      label: Stop/run
      description: ON/OFF texts STOP / RUN; also readable as register 34 (40035).
    - bit: 3
      name: fault
      label: Fault
      description: ON/OFF texts FAULT / OFF; also readable as register 53 (40054).
    - bit: 7
      name: warning
      label: Warning
      description: ON/OFF texts WARN / OK; also readable as register 58 (40059).
    - bit: 9
      name: control_mode
      label: Control mode
      description: ON/OFF texts SERIAL / LOCAL; also readable as register 36 (40037).
    - bit: 10
      name: run_at_maximum_frequency
      label: Run at maximum frequency
      description: ON/OFF texts MAX / NO; also readable as register 35 (40036).
    - bit: 14
      name: forward_reverse
      label: Forward/reverse
      description: ON/OFF texts FWD / REV; also readable as register 33 (40034).
  description: Status word (ZSW, PZD 1). The mapping table assigns the listed bits;
    it does not state which text of an ON/OFF pair stands for 1.
  source:
    address: 109 (40110)
    page: 179
    reference: Mapping table, ZSW
