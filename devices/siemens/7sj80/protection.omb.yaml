openmodbus: 0.1.0
info:
  id: siemens/7sj80/protection
  title: Siemens SIPROTEC 7SJ80 indications and measured values
  version: 0.1.0
  description: 'Read-only subset of Modbus standard mapping 3-1 for the 7SJ80 (firmware
    V4.60 or higher) with a Modbus communication module (firmware 04.00.05 or higher,
    hardware version 4 or higher). Indications follow the 7SJ80 functional scope;
    measured values use the default scaling, which depends on the full-scale parameters
    1101 and 1102 and can be changed.

    '
  attribution: Derived from Siemens' SIPROTEC Communication Modules Modbus Bus mapping
    7SJ80/7SK80/7RW80.
  source: integrator
  verification: documented
  x-otfabric-corpus-source: siemens-siprotec-7sx80-modbus
device:
  manufacturer: Siemens
  family: SIPROTEC
  model: 7SJ80
  classes:
  - protection_relay
  documentation:
