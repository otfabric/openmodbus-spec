openmodbus: 0.1.0
info:
  id: siemens/pac3220/telemetry
  title: Siemens SENTRON PAC3220 telemetry
  version: 0.1.0
  description: 'Read-only subset of the measured variables (appendix A.1.3): voltages,
    currents, power, power factor, frequency, device status, active tariff, operating
    hours and the float copies of the tariff 1 energy counters, which the manual recommends
    for display only. Function codes 0x03 and 0x04 read the same values; the points
    use the input-register (0x04) table. The manual does not say what an "Offset"
    is on the wire or how multi-register values are ordered: the offset is taken as
    the PDU address, and float and Unsigned long values as most significant word first,
    because the PAC RS485 expansion module manual, which this manual names for the
    PAC3220''s RS485 interface, prints a captured exchange (from a PAC3200) that reads
    "offset 0001: voltage Va-n" at start address 00 01 and returns 43 68 70 22 for
    232.4 V. The energy counters in double format are left out: no Siemens document
    shows the register order of a double. A read that starts or ends inside a multi-register
    value returns an error code.

    '
  attribution: Derived from Siemens' SENTRON 7KM PAC3120 and PAC3220 Power Monitoring
    Device Equipment Manual.
  source: integrator
  verification: documented
  x-otfabric-corpus-source: siemens-pac3120-pac3220-manual
device:
  manufacturer: Siemens
  family: SENTRON PAC
  model: PAC3220
  classes:
  - power_meter
  transports:
  - type: tcp
    notes: Port 502 by default, configurable.
  - type: rtu
    notes: With the PAC RS485 expansion module.
  documentation:
  - title: SENTRON 7KM PAC3120 and PAC3220 Power Monitoring Device Equipment Manual
    url: https://cache.industry.siemens.com/dl/files/307/109767307/att_1298442/v1/MAN_L1V30425208F_RS-AA_002_en_en-US.pdf
    revision: L1V30425208F_RS-AA_002, 07/2024
  - title: SENTRON Expansion Module PAC RS485 Manual
    url: https://support.industry.siemens.com/cs/ww/en/view/28865965
    revision: A5E02091800B-01, 02/2008
