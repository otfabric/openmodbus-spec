- id: device_status
  address: 205
  type: u32
  aliases:
  - PMD Diagnostics and Status
  flags:
    flags:
    - bit: 0
      name: slot_1_parameters_changed
      label: Bit 0 Slot 1 Parameters changed
      description: Byte 3, bit 0, mask 0x00000001; type saving.
    - bit: 1
      name: slot_1_im_data_changed
      label: Bit 1 Slot 1 IMDATA changed
      description: Byte 3, bit 1, mask 0x00000002; type saving.
    - bit: 2
      name: slot_1_firmware_update_active
      label: Bit 2 Slot 1 Firmware update active
      description: Byte 3, bit 2, mask 0x00000004; type saving.
    - bit: 3
      name: firmware_data_block_available
      label: Bit 3 Firmware data block available
      description: Byte 3, bit 3, mask 0x00000008; type saving.
    - bit: 4
      name: bootloader_update_flag
      label: Bit 4 Bootloader update flag
      description: Byte 3, bit 4, mask 0x00000010; type saving.
    - bit: 5
      name: slot_2_firmware_update_active
      label: Bit 5 Slot 2 Firmware update active
      description: Byte 3, bit 5, mask 0x00000020; type saving.
    - bit: 6
      name: slot_2_parameters_changed
      label: Bit 6 Slot 2 Parameters changed
      description: Byte 3, bit 6, mask 0x00000040; type saving.
    - bit: 7
      name: slot_2_im_data_changed
      label: Bit 7 Slot 2 IMDATA changed
      description: Byte 3, bit 7, mask 0x00000080; type saving.
    - bit: 8
      name: configuration_changed_stored
      label: Basic configuration changed
      description: Byte 2, bit 0, mask 0x00000100; type saving.
    - bit: 9
      name: limit_violation_stored
      label: Upper or lower limit violation
      description: Byte 2, bit 1, mask 0x00000200; type saving.
    - bit: 10
      name: pulse_rate_exceeded_stored
      label: Maximum pulse rate exceeded
      description: Byte 2, bit 2, mask 0x00000400; type saving.
    - bit: 11
      name: device_restarted_stored
      label: Device has rebooted
      description: Byte 2, bit 3, mask 0x00000800; type saving.
    - bit: 12
      name: energy_counters_reset_stored
      label: Energy counters reset
      description: Byte 2, bit 4, mask 0x00001000; type saving.
    - bit: 13
      name: power_quality_stored
      label: Power quality
      description: Byte 2, bit 5, mask 0x00002000; type saving.
    - bit: 16
      name: module_slot_1
      label: Module slot 1
      description: Byte 1, bit 0, mask 0x00010000; type Status.
    - bit: 17
      name: pulse_rate_exceeded
      label: Maximum pulse rate exceeded
      description: Byte 1, bit 1, mask 0x00020000; type Status.
    - bit: 18
      name: module_slot_2
      label: Module slot 2
      description: Byte 1, bit 2, mask 0x00040000; type Status.
    - bit: 20
      name: process_counter_active
      label: Process counter active
      description: Byte 1, bit 4, mask 0x00100000; type Status.
    - bit: 24
      name: no_synchronization_pulse
      label: No synchronization pulse
      description: Byte 0, bit 0, mask 0x01000000; type Status.
    - bit: 25
      name: configuration_menu_active
      label: Device Configuration menu is active
      description: Byte 0, bit 1, mask 0x02000000; type Status.
    - bit: 26
      name: voltage_out_of_range
      label: Voltage out of range
      description: Byte 0, bit 2, mask 0x04000000; type Status.
    - bit: 27
      name: current_out_of_range
      label: Current out of range
      description: Byte 0, bit 3, mask 0x08000000; type Status.
    - bit: 28
      name: device_time_undefined
      label: Device time undefined
      description: Byte 0, bit 4, mask 0x10000000; type Status.
    - bit: 30
      name: hardware_write_protection
      label: Hardware write protection is active
      description: Byte 0, bit 6, mask 0x40000000; type Status.
  description: Bits as listed in the device status table on page 156.
  source:
