openmodbus: 0.1.0
info:
  id: siemens/pac4200/telemetry
  title: Siemens SENTRON PAC4200 telemetry
  version: 0.1.0
  description: 'Read-only subset of the measured variables without a time stamp (table
    A-1) and of the tariff-specific energy values in float format (table A-14): voltages,
    currents, power, power factor, frequency, device status, active tariff and tariff
    1 energy. Function codes 0x03 and 0x04 read the same values; the points use the
    input-register (0x04) table. The manual does not say what an "Offset" is on the
    wire or how multi-register values are ordered: the offset is taken as the PDU
    address, and Float and Unsigned long values as most significant word first, because
    the PAC RS485 expansion module manual, which this manual names for Modbus RTU,
    prints a captured exchange (from a PAC3200) that reads "offset 0001: voltage Va-n"
    at start address 00 01 and returns 43 68 70 22 for 232.4 V. The energy values
    in Double format (table A-12) are left out: no Siemens document shows the register
    order of a Double. A read that starts or ends inside a multi-register value returns
    an error code.

    '
  attribution: Derived from Siemens' SENTRON PAC4200 Power Monitoring Device System
    Manual.
  source: integrator
  verification: documented
  x-otfabric-corpus-source: siemens-pac4200-manual
device:
  manufacturer: Siemens
  family: SENTRON PAC
  model: PAC4200
  classes:
  - power_meter
  transports:
  - type: tcp
  - type: rtu
    notes: With the PAC RS485 expansion module.
  documentation:
  - title: SENTRON PAC4200 Power Monitoring Device System Manual
    url: https://cache.industry.siemens.com/dl/files/595/34261595/att_951630/v1/manual_pac4200_en-US_en-US.pdf
    revision: A5E02316180B-05, 05/2019
  - title: SENTRON Expansion Module PAC RS485 Manual
    url: https://support.industry.siemens.com/cs/ww/en/view/28865965
    revision: A5E02091800B-01, 02/2008
