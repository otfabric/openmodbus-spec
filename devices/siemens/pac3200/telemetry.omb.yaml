openmodbus: 0.1.0
info:
  id: siemens/pac3200/telemetry
  title: Siemens SENTRON PAC3200 telemetry
  version: 0.1.0
  description: 'Read-only subset of the measured variables (table 3-6): voltages,
    currents, power, power factor, frequency, THD, device status, active tariff and
    the working hours counter. Function codes 0x03 and 0x04 read the same values;
    the points use the input-register (0x04) table. The manual does not say what an
    "Offset" is on the wire or how multi-register values are ordered: the offset is
    taken as the PDU address, and Float and Unsigned long values as most significant
    word first, because the PAC RS485 expansion module manual that this manual lists
    as further documentation prints a captured PAC3200 exchange that reads "offset
    0001: voltage Va-n" at start address 00 01 and returns 43 68 70 22 for 232.4 V.
    The energy counters exist only in Double format, whose register order no Siemens
    document shows, so they are left out. A read that starts or ends inside a multi-register
    value returns an error code. Modbus TCP must be selected on the device (SEAbus
    TCP is the default); Modbus RTU needs the PAC RS485 expansion module and firmware
    V2.0x or later.

    '
  attribution: Derived from Siemens' SENTRON PAC3200 Power Monitoring Device Manual.
  source: integrator
  verification: documented
  x-otfabric-corpus-source: siemens-pac3200-manual
device:
  manufacturer: Siemens
  family: SENTRON PAC
  model: PAC3200
  classes:
  - power_meter
  transports:
  - type: tcp
    notes: Port 502, after switching the protocol from SEAbus TCP to MODBUS TCP.
  - type: rtu
    notes: With the PAC RS485 expansion module.
  documentation:
  - title: SENTRON PAC3200 Power Monitoring Device Manual
    url: https://cache.industry.siemens.com/dl/files/150/26504150/att_906558/v1/A5E01168664B-04_EN-US_122016_201612221316360495.pdf
    revision: A5E01168664B-04, 02/2008
  - title: SENTRON Expansion Module PAC RS485 Manual
    url: https://support.industry.siemens.com/cs/ww/en/view/28865965
    revision: A5E02091800B-01, 02/2008
