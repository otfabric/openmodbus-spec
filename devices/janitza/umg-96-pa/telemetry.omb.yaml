openmodbus: 0.1.0
info:
  id: janitza/umg-96-pa/telemetry
  title: Janitza UMG 96-PA telemetry
  version: 0.1.0
  description: 'Read-only subset of the UMG 96-PA address list, firmware 3.54 or later,
    read from the workbook in the vendor''s archive. Floats and doubles return big-endian
    data at the listed addresses (the list mirrors them in little-endian at address
    + 32768) and include the transformer ratios; the two 16-bit short values do not.
    The list states neither the address base nor the register table; both come from
    the user manual''s request example, which reads list address 19000 with function
    03 and the start address bytes 4A 38.

    '
  attribution: Derived from Janitza's UMG 96-PA, UMG 96-PAMID+ Modbus-address list
    and Formulary.
  source: integrator
  verification: documented
  x-otfabric-corpus-source: janitza-umg96pa-modbus
device:
  manufacturer: Janitza electronics
  family: UMG 96-PA
  model: UMG 96-PA
  classes:
  - power_meter
  transports:
  - type: rtu
    notes: RS-485.
  documentation:
  - title: UMG 96-PA, UMG 96-PAMID+ Modbus-address list and Formulary (from firmware
      3.54)
    url: https://assets.janitza.com/ce18jq9ih0x6/75730e79d6b9bb7b43018d/f90faad4edfd24d91b2db81eee1a4791/janitza-mal-umg96pa-fw3-en.zip
    revision: Doc. no. 2.061.029.3.e, 12/2025; workbook Doc. No. 2.061.164.1.a
  - title: UMG 96-PA, UMG 96-PAMID+ (as of firmware 3.54) User manual and technical
      data
    url: https://www.janitza.com/en-us/products/umg-96-pa/downloads
    revision: Doc no. 2.061.059.4.a, 11/2025
defaults:
  table: holding_register
  access: r
  wordOrder: big
  byteOrder: big
points:
- id: serial_number
  address: 911
  type: u32
  aliases:
  - Serial number
  source:
    address: '911'
    page: 104
    reference: Sheet1(EN)!C3134, Other parameters
- id: cos_phi_total
  address: 1050
  type: f32
  aliases:
  - 'Measured value (float): cos(ϕ) sum'
  source:
    address: '1050'
    page: 14
    reference: Sheet1(EN)!C90, Measured values
- id: active_energy_import
  address: 6012
  type: f64
  unit: W.h
  aliases:
  - Active Energy sum, consumed
  source:
    address: '6012'
    page: 39
    reference: Sheet1(EN)!C892, Energy values
- id: active_energy_export
  address: 6156
  type: f64
  unit: W.h
  aliases:
  - Active Energy sum, delivered
  source:
    address: '6156'
    page: 40
    reference: Sheet1(EN)!C928, Energy values
- id: voltage_l1_n_secondary
  address: 11000
  type: i16
  conversion:
    exponent10: -1
  unit: V
  description: 16-bit value without the voltage transformer ratio.
  aliases:
  - 'Measured value (short): voltage L1-N'
  source:
    address: '11000'
    page: 15
    reference: Sheet1(EN)!C140, Measured values
- id: current_l1_secondary
  address: 11006
  type: i16
