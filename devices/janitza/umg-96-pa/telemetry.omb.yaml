    exponent10: -3
  unit: A
  description: 16-bit value without the current transformer ratio.
  aliases:
  - 'Measured value (short): current L1'
  source:
    address: '11006'
    page: 15
    reference: Sheet1(EN)!C146, Measured values
- id: voltage_l1_n
