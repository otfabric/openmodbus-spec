openmodbus: 0.1.0
info:
  id: janitza/umg-509-pro/telemetry
  title: Janitza UMG 509-PRO telemetry
  version: 0.1.0
  description: 'Read-only subset of the UMG 509-PRO address list. Floats return big-endian
    data at the listed addresses (the list mirrors them in little-endian at address
    + 32768) and include the transformer ratios. The list states neither the address
    base nor the register table; both come from the user manual''s request example,
    which reads list address 19000 with function 03 and the start address bytes 4A
    38. The differential current alarm status belongs to the residual current inputs.

    '
  attribution: Derived from Janitza's UMG 509-PRO Modbus-address and Formulary.
  source: integrator
  verification: documented
  x-otfabric-corpus-source: janitza-umg509pro-modbus
device:
  manufacturer: Janitza electronics
  family: UMG 509
  model: UMG 509-PRO
  classes:
  - power_meter
  transports:
  - type: rtu
    notes: RS-485.
  - type: tcp
    notes: Ethernet.
  - type: rtu_over_tcp
    notes: Ethernet.
  documentation:
  - title: UMG 509-PRO Modbus-address and Formulary
    url: https://assets.janitza.com/ce18jq9ih0x6/5c8ee9f3d1da8aad64bfd2/dfeccbf4f7f8abca71d0c3c0f7ae8b78/janitza-mal-umg509pro-en.pdf
    revision: Dok. Nr. 1.059.004.2.o, 06/2025
  - title: UMG 509-PRO User manual and technical data
    url: https://www.janitza.com/en-us/products/umg-509-pro/downloads
    revision: Doc. no. 2.059.011.3.a, 12/2025
defaults:
  table: holding_register
  access: r
  wordOrder: big
  byteOrder: big
points:
- id: system_time
  address: 4
  type: i32
  unit: s
  aliases:
  - _SYSTIME
  - time (UTC)
  source:
    address: '4'
    page: 13
    reference: Address list, _SYSTIME
- id: active_energy_import
  address: 13995
  type: f32
  unit: W.h
  aliases:
  - _WH_V[4]
  - Real energy L1..L3, consumed
  source:
    address: '13995'
    page: 26
    reference: Address list, _WH_V[4]
- id: active_energy_export
  address: 14007
  type: f32
  unit: W.h
  aliases:
  - _WH_Z[4]
  - Real energy L1..L3, delivered
  source:
    address: '14007'
    page: 26
    reference: Address list, _WH_Z[4]
- id: digital_input_1
  address: 14119
  type: i16
  enum:
    values:
    - value: 0
      name: not_active
      label: not active
    - value: 1
      name: active
      label: active
  aliases:
  - _DIGIN_STAT[0]
  - Status digital input, 0=not active, 1=active
  source:
    address: '14119'
    page: 30
    reference: Address list, _DIGIN_STAT[0]
- id: event_counter
  address: 14121
  type: u32
  aliases:
  - _EVT_COUNT
