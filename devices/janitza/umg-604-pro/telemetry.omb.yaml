openmodbus: 0.1.0
info:
  id: janitza/umg-604-pro/telemetry
  title: Janitza UMG 604-PRO telemetry
  version: 0.1.0
  description: 'Read-only subset of the UMG 604-PRO address list, firmware 5.030 or
    later. Floats return big-endian data at the listed addresses (the list mirrors
    them in little-endian at address + 32768) and include the transformer ratios.
    Neither the list nor the user manual states the address base or the register table;
    the list is read as zero-based because it contains address 0 and as holding registers
    because rows marked read-only and read/write share it.

    '
  attribution: Derived from Janitza's UMG 604-PRO Modbus-address and Formulary.
  source: integrator
  verification: documented
  x-otfabric-corpus-source: janitza-umg604pro-modbus
device:
  manufacturer: Janitza electronics
  family: UMG 604
  model: UMG 604-PRO
  classes:
  - power_meter
  transports:
  - type: rtu
    notes: RS-485 and RS-232.
  - type: tcp
    notes: Ethernet, port 502.
  - type: rtu_over_tcp
    notes: Ethernet, port 8000.
  documentation:
  - title: UMG 604-PRO Modbus-address and Formulary (Firmware rel. 5.030 and higher)
    url: https://assets.janitza.com/ce18jq9ih0x6/d052b9d04bf01ab4aeb03c/b2dd607ab83dbe66c89e6f49e570a715/janitza-mal-umg604pro-en.pdf
    revision: Doc. no. 1.033.034.h, 07/2025
  - title: UMG 604-PRO User manual and technical data
    url: https://www.janitza.com/en-us/products/umg-604-pro/downloads
    revision: Doc. no. 1.033.059.7.a, 02/2026
defaults:
  table: holding_register
  access: r
  wordOrder: big
  byteOrder: big
