openmodbus: 0.1.0
info:
  id: janitza/umg-96rm-e/telemetry
  title: Janitza UMG 96RM-E telemetry
  version: 0.1.0
  description: 'Read-only subset of the UMG 96RM-E address list, firmware 3.01 / hardware
    release 104 or later. Floats return big-endian data at the listed addresses (the
    list mirrors them in little-endian at address + 32768). Float values include the
    transformer ratios; the 16-bit short value does not. The document states neither
    the address base nor the register table; the list is read as zero-based because
    it starts at address 0 and as holding registers because read-only and writable
    (FC 06/16) rows share it.

    '
  attribution: Derived from Janitza's UMG 96RM-E Modbus-address list and Formulary.
  source: integrator
  verification: documented
  x-otfabric-corpus-source: janitza-umg96rm-e-modbus
device:
  manufacturer: Janitza electronics
  family: UMG 96RM
  model: UMG 96RM-E
  classes:
  - power_meter
  transports:
  - type: rtu
    notes: RS-485.
  documentation:
  - title: UMG 96RM-E Modbus-address list and Formulary
    url: https://assets.janitza.com/ce18jq9ih0x6/b80ca06dda38d37f864115/703a1d1d3014935a5c3327ed6b978d37/janitza-mal-umg96rme-en.pdf
    revision: Dok. Nr. 1.040.085.8.o, 07/2025
defaults:
  table: holding_register
  access: r
  wordOrder: big
  byteOrder: big
points:
- id: power_factor_total
  address: 834
  type: f32
  aliases:
  - Sum; Power factor sum3=Psum3/Ssum3 [3]
  source:
    address: '834'
    page: 20
    reference: Measured values, type float
- id: voltage_l1_n_secondary
  address: 3530
  type: i16
  conversion:
    exponent10: -1
  unit: V
  description: 16-bit value without the voltage transformer ratio.
  aliases:
  - Voltage U1 L1-N [0]
  source:
    address: '3530'
    page: 22
    reference: Measured values, type short
- id: active_energy_import
  address: 5352
  type: f32
  unit: W.h
  description: Rate index 0; the document states tariff 0 is always active.
  aliases:
  - Real energy, sum. L1..L3, obtained, rate [0]
  source:
    address: '5352'
    page: 42
    reference: Energy, type float
- id: active_energy_export
  address: 5368
  type: f32
  unit: W.h
  description: Rate index 0; the document states tariff 0 is always active.
  aliases:
