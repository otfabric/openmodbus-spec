openmodbus: 0.1.0
info:
  id: janitza/umg-96rm/telemetry
  title: Janitza UMG 96RM telemetry
  version: 0.1.0
  description: 'Read-only subset of the UMG 96RM base-device address list, firmware
    1.14 or later. Floats return big-endian data at the listed addresses (the list
    mirrors them in little-endian at address + 32768). Float values include the transformer
    ratios; the 16-bit short value does not. The document states neither the address
    base nor the register table; the list is read as zero-based because it starts
    at address 0 and as holding registers because read-only and writable (FC 06/16)
    rows share it.

    '
  attribution: Derived from Janitza's UMG 96RM Modbus-Adressenliste und Formelsammlung.
  source: integrator
  verification: documented
  x-otfabric-corpus-source: janitza-umg96rm-modbus-de
device:
  manufacturer: Janitza electronics
  family: UMG 96RM
  model: UMG 96RM
  classes:
  - power_meter
  transports:
  - type: rtu
    notes: RS-485.
  documentation:
  - title: UMG 96RM Modbus-Adressenliste und Formelsammlung (ab Firmware Rel. 1.14)
    url: https://assets.janitza.com/ce18jq9ih0x6/84e474c2bb03ea1ac23190/049ae8165fa5627ffd074d79780a5514/janitza-mal-umg96rm-cbm-p-pn-de.pdf
    revision: Dok. Nr. 1.040.033.u, 11/2023
defaults:
  table: holding_register
  access: r
  wordOrder: big
  byteOrder: big
points:
