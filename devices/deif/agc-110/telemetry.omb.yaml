openmodbus: 0.1.0
info:
  id: deif/agc-110/telemetry
  title: DEIF AGC 110 engine and status registers
  version: 0.1.0
  description: 'Read-only subset of the measurement table and the alarm and status
    table (function code 04h) for AGC 100 series software version 4.0x.x or later
    with the Modbus RS-485 option H2. Only rows the document marks as standard (X)
    for AGC 110 are included; the document marks no generator voltage, current, frequency,
    power, run-hour or start counter rows for AGC 110 in the measurement table. The
    document does not state signedness, so only quantities that cannot be negative
    are mapped, as unsigned.

    '
  attribution: Derived from DEIF's Multi-line 2 Description of options, Options H2
    and H9 Modbus communication.
  source: integrator
  verification: documented
  x-otfabric-corpus-source: deif-ml2-h2-h9
device:
  manufacturer: DEIF
  family: Multi-line 2
  model: AGC 110
  classes:
  - genset_controller
  transports:
  - type: rtu
    notes: RS-485 with hardware option H2.
  documentation:
  - title: Multi-line 2 Description of options, Options H2 and H9 Modbus communication
    url: https://www.deif.com/media/qmtcw1ih/option-h2-and-h9-modbus-communication-4189340442-uk.pdf
    revision: 4189340442Z
defaults:
  table: input_register
  access: r
points:
- id: alarm_count
  address: 558
  type: u16
  aliases:
  - No. of alarms
  source:
    address: '558'
    page: 52
    reference: Measurement table (read only) (function code 04h)
- id: dc_supply_voltage
  address: 567
  type: u16
  conversion:
    exponent10: -1
  unit: V
  aliases:
  - DC supply term. 1-2 [V/10]
  source:
    address: '567'
    page: 53
    reference: Measurement table (read only) (function code 04h)
- id: engine_speed
  address: 576
  type: u16
  unit: /min
  aliases:
  - RPM
  description: Unit taken from the row label; the document gives no unit bracket or
    scale.
  source:
    address: '576'
    page: 53
    reference: Measurement table (read only) (function code 04h)
- id: fan_a_running_hours
  address: 702
  type: u32
  wordOrder: big
  unit: h
  aliases:
  - Fan A running hours
  description: Unit taken from the row label; the document gives no unit bracket or
    scale.
  source:
    address: 702 [Hi], 703 [Lo]
    page: 58
    reference: Measurement table (read only) (function code 04h)
- id: engine_alarms
  address: 1013
  type: u16
  flags:
    flags:
    - bit: 9
      name: overspeed_1
      label: Overspeed 1
    - bit: 10
      name: overspeed_2
      label: Overspeed 2
    - bit: 11
      name: crank_failure
      label: Crank failure
    - bit: 12
      name: running_feedback_failure
      label: Running feedback failure
    - bit: 13
      name: mpu_wire_failure
      label: MPU wire failure
    - bit: 14
      name: hz_v_failure
      label: Hz/V failure
    - bit: 15
      name: start_failure
      label: Start failure
  aliases:
  - Multi-functional input
  description: Bits the document marks as standard (X) for AGC 110 (page 83); bits
    that are empty or refer to an option or input are not named.
  source:
    address: '1013'
    page: 80
    reference: Alarm and status table (read only) (function code 04h)
- id: status_flags
  address: 1018
  type: u16
  flags:
    flags:
    - bit: 13
      name: bb_hz_v_ok
      label: BB Hz/V OK
  aliases:
  - Status
  description: Bits the document marks as standard (X) for AGC 110 (page 88); bits
    that are empty or refer to an option or input are not named.
  source:
    address: '1018'
    page: 87
    reference: Alarm and status table (read only) (function code 04h)
- id: mode_flags
  address: 1019
  type: u16
  flags:
    flags:
    - bit: 0
      name: block_mode
      label: Block mode
    - bit: 2
      name: semi_auto_mode
      label: Semi auto mode
    - bit: 3
      name: auto_mode
      label: Auto mode
  aliases:
  - General/Modes
  description: Bits the document marks as standard (X) for AGC 110 (page 88); bits
    that are empty or refer to an option or input are not named.
  source:
    address: '1019'
    page: 88
    reference: Alarm and status table (read only) (function code 04h)
