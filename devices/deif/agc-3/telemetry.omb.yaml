openmodbus: 0.1.0
info:
  id: deif/agc-3/telemetry
  title: DEIF AGC-3 generator, engine and status registers
  version: 0.1.0
  description: 'Read-only subset of the measurement table and the alarm and status
    table (function code 04h) for AGC-3 software version 3.6x.x or later with the
    Modbus RS-485 option H2. Only rows the document marks as standard (X) for AGC-3
    are included. The document does not state signedness, so only quantities that
    cannot be negative are mapped, as unsigned.

    '
  attribution: Derived from DEIF's Multi-line 2 Description of options, Options H2
    and H9 Modbus communication.
  source: integrator
  verification: documented
  x-otfabric-corpus-source: deif-ml2-h2-h9
device:
  manufacturer: DEIF
  family: Multi-line 2
  model: AGC-3
  classes:
  - genset_controller
  transports:
  - type: rtu
    notes: RS-485 with hardware option H2.
  documentation:
  - title: Multi-line 2 Description of options, Options H2 and H9 Modbus communication
    url: https://www.deif.com/media/qmtcw1ih/option-h2-and-h9-modbus-communication-4189340442-uk.pdf
    revision: 4189340442Z
