      label: Overcurrent during Accel (ocA)
    - value: 2
      name: overcurrent_during_decel
      label: Overcurrent during Decel (ocd)
    - value: 3
      name: overcurrent_during_normal_speed
      label: Overcurrent during normal speed (ocn)
    - value: 4
      name: ground_fault
      label: Ground Fault (GFF)
    - value: 5
      name: igbt_short_circuit
      label: IGBT short circuit (occ)
    - value: 6
      name: overcurrent_during_stop
      label: Overcurrent during Stop (ocS)
    - value: 7
      name: overvoltage_during_accel
      label: Overvoltage during Accel (ovA)
    - value: 8
      name: overvoltage_during_decel
      label: Overvoltage during Decel (ovd)
    - value: 9
      name: overvoltage_during_normal_speed
      label: Overvoltage during normal speed (ovn)
    - value: 10
      name: overvoltage_during_stop
      label: Overvoltage during Stop (ovS)
    - value: 11
      name: low_voltage_during_accel
      label: Low voltage during Accel (LvA)
    - value: 12
      name: low_voltage_during_decel
      label: Low voltage during Decel (Lvd)
    - value: 13
      name: low_voltage_during_normal_speed
      label: Low voltage during normal speed (Lvn)
    - value: 14
      name: low_voltage_during_stop
      label: Low voltage during Stop (LvS)
    - value: 15
      name: input_phase_loss
      label: Input phase loss (OrP)
    - value: 16
      name: igbt_overheat_1
