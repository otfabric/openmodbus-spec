    - value: 17
      name: cap_overheat_2
      label: Cap Overheat 2 (oH2)
    - value: 18
      name: thermister_1_open
      label: Thermister 1 open (tH1o)
    - value: 19
      name: thermister_2_open
      label: Thermister 2 open (tH2o)
    - value: 20
      name: power_reset_off
      label: Power Reset Off (PWR)
    - value: 21
      name: overload
      label: Overload (oL) (150% 1Min, Inverter)
    - value: 22
