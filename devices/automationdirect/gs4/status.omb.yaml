      label: CPU Command error (TRAP)
    - value: 111
      name: inrcom_time_out
      label: InrCom Time Out (ictE)
  source:
    address: 2100h
    page: 312
    reference: Status Addresses (Read Only), Status Monitor 1
- id: operation_status
  address: 8449
  type: u16
  mask: 3
  enum:
    values:
    - value: 0
      name: stop
      label: Stop
    - value: 1
      name: decelerating
      label: Decelerate during the drive stopping
    - value: 2
      name: standby
      label: The drive standby
    - value: 3
      name: run
      label: Run
  description: Bit 0,1 of status monitor 2 (2101h).
  source:
    address: 2101h
    page: 313
    reference: Status Addresses (Read Only), Status Monitor 2
- id: operation_direction
  address: 8449
  type: u16
  mask: 24
  enum:
    values:
    - value: 0
      name: forward
      label: FWD
    - value: 1
      name: reverse_to_forward
      label: REV to FWD
    - value: 2
      name: forward_to_reverse
      label: FWD to REV
    - value: 3
      name: reverse
      label: REV
  description: Bit 3,4 of status monitor 2 (2101h).
  source:
    address: 2101h
    page: 313
    reference: Status Addresses (Read Only), Status Monitor 2
- id: running
  address: 8449
  type: u16
  mask: 4096
  enum:
    values:
    - value: 0
      name: stopped
      label: Drive stopped
    - value: 1
      name: running
      label: Drive running (including Standby)
  description: 'Bit 12 of status monitor 2 (2101h): running status.'
  source:
    address: 2101h
    page: 313
    reference: Status Addresses (Read Only), Status Monitor 2
- id: dc_bus_voltage
  label: DC-BUS Voltage U (xxx.x)
  address: 8453
  type: u16
  conversion:
    exponent10: -1
  unit: V
  source:
    address: 2105h
    page: 313
    reference: Status Addresses (Read Only)
- id: output_voltage
  label: Output Voltage E (xxx.x)
  address: 8454
  type: u16
  conversion:
    exponent10: -1
  unit: V
  source:
    address: 2106h
    page: 313
    reference: Status Addresses (Read Only)
- id: active_warning
  label: Active Warning
  address: 8456
  type: u16
  source:
    address: 2108h
    page: 313
    reference: Status Addresses (Read Only)
- id: active_error_low_byte
  address: 8472
  type: u16
  mask: 255
  description: 'Low byte of status address 2118h: Low Byte Active Error [2100h = Active
    Error/Fault].'
  source:
    address: 2118h
    page: 313
    reference: Status Addresses (Read Only)
- id: active_warning_high_byte
  address: 8472
  type: u16
  mask: 65280
  description: 'High byte of status address 2118h: High Byte Active Warning [2108h
    = Active Warning].'
  source:
    address: 2118h
    page: 313
    reference: Status Addresses (Read Only)
