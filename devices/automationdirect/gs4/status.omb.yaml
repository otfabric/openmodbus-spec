openmodbus: 0.1.0
info:
  id: automationdirect/gs4/status
  title: AutomationDirect DURApulse GS4 drive status
  version: 0.1.0
  description: 'Read-only subset of the serial Modbus status addresses (2100h block):
    error code, run status, DC bus and output voltage, active warning and error/warning
    bytes. Output frequency, output current and output power are left out because
    the manual gives conflicting or no scales for them; motor speed (210Ch) is left
    out because the list does not state its signedness. The manual limits a read to
    12 registers.

    '
  attribution: Derived from AutomationDirect's DURApulse GS4 AC Drive User Manual.
  source: integrator
  verification: documented
  x-otfabric-corpus-source: automationdirect-gs4-manual
device:
  manufacturer: AutomationDirect
  family: DURApulse
  model: GS4
  classes:
  - drive
  transports:
  - type: rtu
  - type: ascii
  documentation:
  - title: DURApulse GS4 AC Drive User Manual
    url: https://cdn.automationdirect.com/static/manuals/gs4m/gs4umw.pdf
    revision: 1st Ed. Rev N, 04/02/2025
defaults:
  table: holding_register
  access: r
constraints:
  maxReadRegisters: 12
points:
- id: error_code
  label: Status Monitor 1 error code
  address: 8448
  type: u16
  enum:
    values:
    - value: 0
      name: no_error
      label: No Error
    - value: 1
