      label: V Phase Short (Voc)
    - value: 81
      name: w_phase_short
      label: W Phase Short (Woc)
    - value: 82
      name: u_phase_loss
      label: U Phase Loss (UPHL)
    - value: 83
      name: v_phase_loss
