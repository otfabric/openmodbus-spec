openmodbus: 0.1.0
info:
  id: automationdirect/sio-mb16cdd2/io
  title: AutomationDirect Stride SIO-MB16CDD2 discrete I/O
  version: 0.1.0
  description: 'Read-only input and output states from the coil table, system flags
    and firmware registers. The guide writes references as 0xxxx and 4xxxx without
    stating the base; the bit diagrams that mirror coils into registers only fit 1-based
    references, which the extractor checks. The input frequency registers are left
    out to keep the subset within 20 points. Writable coils and registers are read-only
    in this contract.

    '
  attribution: Derived from AutomationDirect's Stride Field I/O SIO-MB16CDD2 User
    Guide.
  source: integrator
  verification: documented
  x-otfabric-corpus-source: automationdirect-sio-mb16cdd2
device:
  manufacturer: AutomationDirect
  family: Stride Field I/O
  model: SIO-MB16CDD2
  classes:
  - remote_io
  transports:
