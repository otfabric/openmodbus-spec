openmodbus: 0.1.0
info:
  id: automationdirect/sio-mb12cdr/io
  title: AutomationDirect Stride SIO-MB12CDR discrete I/O and input frequency
  version: 0.1.0
  description: 'Read-only input and relay output states from the coil table, system
    flags, input frequencies and firmware registers. The guide writes references as
    0xxxx and 4xxxx without stating the base; the bit diagrams that mirror coils into
    registers only fit 1-based references, which the extractor checks. Writable coils
    and registers are read-only in this contract.

    '
  attribution: Derived from AutomationDirect's Stride Field I/O SIO-MB12CDR User Guide.
  source: integrator
  verification: documented
  x-otfabric-corpus-source: automationdirect-sio-mb12cdr
device:
  manufacturer: AutomationDirect
  family: Stride Field I/O
  model: SIO-MB12CDR
  classes:
  - remote_io
  transports:
  - type: tcp
  documentation:
  - title: Stride Field I/O SIO-MB12CDR User Guide
    url: https://cdn.automationdirect.com/static/manuals/stridefio/siomb12cdrug.pdf
    revision: 1st Edition, Rev. B
