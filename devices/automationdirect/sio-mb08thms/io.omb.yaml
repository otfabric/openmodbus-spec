openmodbus: 0.1.0
info:
  id: automationdirect/sio-mb08thms/io
  title: AutomationDirect Stride SIO-MB08THMS thermocouple inputs
  version: 0.1.0
  description: 'Read-only temperatures, input types, break status, system flags and
    firmware registers. The temperature scale of 0.1 Cel applies when a channel''s
    input type is a thermocouple and its Degree Units register is Celsius, the defaults;
    250 mV inputs carry two implied decimals in mV, and the Fahrenheit and Kelvin
    settings change the unit. Measurements are not updated while INIT mode is active.
    The guide writes references as 0xxxx and 4xxxx without stating the base; the system-flag
    bit diagram that mirrors coils into a register only fits 1-based references, which
    the extractor checks. Writable registers are read-only in this contract.

    '
  attribution: Derived from AutomationDirect's Stride Field I/O SIO-MB08THMS User
    Guide.
  source: integrator
  verification: documented
  x-otfabric-corpus-source: automationdirect-sio-mb08thms
