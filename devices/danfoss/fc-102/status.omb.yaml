openmodbus: 0.1.0
info:
  id: danfoss/fc-102/status
  title: Danfoss VLT HVAC Drive FC 102 drive status and readouts
  version: 0.1.0
  description: 'Read-only subset of the data readouts (parameter group 16-**) over
    the built-in RS-485 Modbus RTU (parameter 8-30 Protocol set to Modbus RTU): reference,
    motor voltage, frequency, DC link voltage and digital inputs. Data types and conversion
    indexes are from the Programming Guide for software version 7.3X, which refers
    to the VLT HVAC Drive FC 102 Design Guide (MG11BB22) for the Modbus RTU protocol.
    The design guide states that parameters are holding registers at 10 x parameter
    number - 1, with request examples, and gives the conversion factors; it is older
    than the Programming Guide. Only 16-bit parameters with a defined data type are
    included: the design guide does not state the register order of 32-bit parameters
    or where an 8-bit value sits in its register, and does not define data type V2
    of the status word. Array parameters are not included.'
  attribution: Derived from Danfoss's VLT HVAC Drive FC 102 Programming Guide.
  source: integrator
  verification: documented
  x-otfabric-corpus-source: danfoss-fc102-pg
device:
  manufacturer: Danfoss
  family: VLT HVAC Drive
  model: FC 102
  classes:
  - drive
  transports:
  - type: rtu
  unitId:
    mode: configurable
    notes: Parameter 8-31 Address, 1 to 247.
  documentation:
  - title: VLT HVAC Drive FC 102 Programming Guide
    url: https://assets.danfoss.com/documents/284244/AU430028034214en-001801.pdf
    revision: AU430028034214en-000101 / 130R0318, 2023.07, software version 7.3X
  - title: VLT HVAC Drive Design Guide
    url: https://assets.danfoss.com/documents/272739/AJ299549559248en-US1501.pdf
    revision: MG11BB22
defaults:
  table: holding_register
  access: r
  wordOrder: big
  byteOrder: big
