openmodbus: 0.1.0
info:
  id: danfoss/fc-51/status
  title: Danfoss VLT Micro Drive FC 51 drive status and readouts
  version: 0.1.0
  description: 'Read-only subset of the parameter readouts (groups 15 and 16) over
    Modbus RTU: FC profile status word, power, motor voltage, frequency, motor current,
    DC link voltage, alarm and warning words, running hours and kWh counter. Parameters
    are holding registers at 10 x parameter number - 1. The manual states no unit
    for the DC link voltage (16-30). Written for software version 2.1x as stated in
    the manual.

    '
  attribution: Derived from Danfoss's VLT Micro Drive FC 51 Operating Instructions.
  source: integrator
  verification: documented
  x-otfabric-corpus-source: danfoss-fc51-oi
device:
  manufacturer: Danfoss
  family: VLT Micro Drive
  model: FC 51
  classes:
  - drive
  transports:
  - type: rtu
  documentation:
  - title: VLT Micro Drive FC 51 Operating Instructions
    url: https://assets.danfoss.com/documents/274690/AQ361180435097en-000501.pdf
    revision: MG.02.A4.02
defaults:
  table: holding_register
  access: r
  wordOrder: big
  byteOrder: big
points:
- id: running_hours
  label: Running Hours
  aliases:
  - 15-01
  address: 15009
  type: u32
  unit: h
  source:
    address: 15-01
    page: 57
    reference: Parameter overview 15-**, PNU 1501
- id: energy_counter
  label: kWh Counter
  aliases:
  - 15-02
  address: 15019
  type: u32
  unit: kW.h
  source:
    address: 15-02
    page: 57
    reference: Parameter overview 15-**, PNU 1502
- id: status_word
  label: Status Word
  aliases:
  - 16-03
  address: 16029
  type: u16
  flags:
    flags:
    - bit: 0
      name: control_ready
      label: Control ready
      description: '0: Control not ready; 1: Control ready'
    - bit: 1
      name: unit_ready
      label: Unit ready
      description: '0: Unit not ready; 1: Unit ready'
    - bit: 2
      name: enable
      label: Enable
      description: '0: Coasting; 1: Enable'
    - bit: 3
      name: trip
      label: Error, trip
      description: '0: No error; 1: Error, trip'
    - bit: 4
      name: error_no_trip
      label: Error (no trip)
      description: '0: No error; 1: Error (no trip)'
    - bit: 6
      name: trip_locked
      label: Trip locked
      description: '0: Not trip locked; 1: Trip locked'
    - bit: 7
      name: warning
      label: Warning
      description: '0: No warning; 1: Warning'
    - bit: 8
      name: speed_equals_reference
      label: Speed = reference
      description: '0: Speed ≠ reference; 1: Speed = reference'
    - bit: 9
      name: bus_control
      label: Bus control
      description: '0: Local operation; 1: Bus control'
    - bit: 10
      name: frequency_limit_ok
      label: Frequency limit OK
      description: '0: Out of frequency limit; 1: Frequency limit OK'
    - bit: 11
      name: running
      label: Running
      description: '0: Not running; 1: Running'
    - bit: 12
      name: resistor_brake_fault
      label: Resistor brake fault
      description: '0: No resistor brake fault; 1: Resistor brake fault'
    - bit: 13
      name: voltage_exceeded
      label: Voltage exceeded
      description: '0: Voltage OK; 1: Voltage exceeded'
    - bit: 14
      name: torque_exceeded
      label: Torque exceeded
      description: '0: Torque OK; 1: Torque exceeded'
    - bit: 15
      name: thermal_warning
      label: Thermal warning
      description: '0: No thermal warning; 1: Thermal warning'
  description: Status word according to the FC profile (section 5.6.3).
  source:
    address: 16-03
    page: 58
    reference: 'Parameter overview 16-**, PNU 1603; bits: section 5.6.3, page 37'
- id: power
  label: Power [kW]
  aliases:
  - 16-10
  address: 16099
  type: u16
  conversion:
    exponent10: -3
