openmodbus: 0.1.0
info:
  id: datakom/d-700/telemetry
  title: Datakom D-700 engine, status and alarm registers
  version: 0.1.0
  description: 'Read-only subset of the register definitions and the list of alarm
    bits (function 3) of the D-300 / 500 / 700 Modbus Application Manual V5.6. The
    manual states both register orders for 32-bit values, so no 32-bit value is mapped:
    generator voltages, currents and power, engine hours, the start counter and the
    energy counters are left out. It does not state signedness, so only quantities
    that cannot be negative are mapped, as unsigned. The COEFF column is read as register
    = value x COEFF.

    '
  attribution: Derived from Datakom's D-300 / 500 / 700 Modbus Application Manual.
  source: integrator
  verification: documented
  x-otfabric-corpus-source: datakom-500-modbus
device:
  manufacturer: Datakom
  family: D-series
  model: D-700
  classes:
  - genset_controller
  transports:
  - type: rtu
    notes: RS-485 or RS-232 serial port.
  - type: tcp
    notes: Ethernet port or GSM-GPRS modem; the manual does not say which models have
      them.
  unitId:
    mode: configurable
    default: 1
    notes: Modbus slave address 1 to 240.
  documentation:
  - title: D-300 / 500 / 700 Modbus Application Manual
    url: https://www.datakom.com.tr/upload/Files/500_MODBUS.pdf
    revision: V5.6 (25.04.2016)
defaults:
  table: holding_register
  access: r
constraints:
  maxReadRegisters: 16
points:
