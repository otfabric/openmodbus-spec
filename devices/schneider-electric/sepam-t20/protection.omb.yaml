openmodbus: 0.1.0
info:
  id: schneider-electric/sepam-t20/protection
  title: Schneider Electric Sepam T20 status and measurements
  version: 0.1.0
  description: 'Read-only status and measurement zones of the Sepam series 20 transformer
    application T20. Only the remote annunciation bits (TS) and measurements marked
    for T20 are listed; measurements that do not apply read zero. Temperatures need
    the MET148-2 module.

    '
  attribution: Derived from Schneider Electric's Sepam series 20 User's manual.
  source: integrator
  verification: documented
  x-otfabric-corpus-source: schneider-electric-sepam-series20-manual
device:
  manufacturer: Schneider Electric
  family: Sepam series 20
  model: Sepam T20
  classes:
  - protection_relay
  transports:
  - type: rtu
  documentation:
  - title: Sepam series 20 User's manual
    url: https://download.se.com/files?p_Doc_Ref=PCRED301005EN&p_enDocType=User+guide&p_File_Name=PCRED301005EN_14.pdf
    revision: PCRED301005EN/14, 06/2025
defaults:
  table: holding_register
  access: r
points:
- id: check_word
  address: 256
  type: u16
  flags:
    flags:
    - bit: 4
      name: tripping_by_protection
      label: remote indication of tripping by protection function
    - bit: 6
      name: setting_group_b
      label: setting group B in service
    - bit: 7
      name: setting_group_a
      label: setting group A in service
    - bit: 8
      name: partial_fault
      label: partial fault in Sepam
    - bit: 9
      name: major_fault
      label: major fault in Sepam
    - bit: 10
      name: local_setting_mode
      label: Sepam in local setting mode
    - bit: 11
      name: slan_monitoring_active
      label: S-LAN communication monitoring active
    - bit: 12
      name: time_not_correct
      label: Sepam time not correct
    - bit: 13
      name: not_synchronous
      label: Sepam not synchronous
    - bit: 14
      name: data_loss
      label: Sepam in “data loss” status
    - bit: 15
      name: event_present
      label: event present
  aliases:
  - Sepam check-word
  description: Format X. Bits 3-0 carry the mapping number and the other bits are
    reserved (undetermined values). Changes of bits 6, 7, 8, 10, 12, 13 and 14 are
    time-tagged events.
  source:
    address: '0100'
    page: 111
    reference: 'Format X: Sepam check-word'
