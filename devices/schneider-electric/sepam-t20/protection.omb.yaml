      label: TS5 Protection 50N/51N relay 1 group A
    - bit: 5
      name: protection_50n_51n_relay_2_group_a
      label: TS6 Protection 50N/51N relay 2 group A
    - bit: 6
      name: protection_50n_51n_relay_1_group_b
      label: TS7 Protection 50N/51N relay 1 group B
    - bit: 7
