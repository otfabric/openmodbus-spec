      label: TS12 Protection 46
  aliases:
  - TS1-TS16
  description: Remote annunciation bits pre-assigned to protection and control functions;
    only the TS marked for T20 are listed. Each TS transition is time-tagged in the
    event stack.
  source:
    address: '0101'
    page: 116
    reference: 'Address word 0101: TS1 to TS16'
- id: annunciation_ts33_ts48
