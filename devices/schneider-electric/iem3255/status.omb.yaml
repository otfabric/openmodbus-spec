openmodbus: 0.1.0
info:
  id: schneider-electric/iem3255/status
  title: Schneider Electric iEM3255 setup and status
  version: 0.1.0
  description: 'Read-only subset of the Modbus register list in the iEM3100 / iEM3200
    / iEM3300 series user manual for the iEM3255: single-register setup and status
    values only. The measurements and energies are Float32 and Int64 values whose
    register order the manual does not state, so they are left out. Read with FC 3;
    addresses are the manual''s Address column, which it defines as the data used
    in the Modbus frame (register = address + 1). The VT and CT settings apply to
    this model only.

    '
  attribution: Derived from Schneider Electric's Energy meters iEM3100 / iEM3200 /
    iEM3300 series User manual.
  source: integrator
  verification: documented
  x-otfabric-corpus-source: schneider-electric-iem3000-user-manual
device:
  manufacturer: Schneider Electric
  family: iEM3000
  model: iEM3255
  classes:
  - energy_meter
  transports:
  - type: rtu
  documentation:
  - title: Energy meters iEM3100 / iEM3200 / iEM3300 series User manual
    url: https://download.se.com/files?p_Doc_Ref=DOCA0005EN&p_enDocType=User+guide&p_File_Name=DOCA0005EN-16.pdf
    revision: DOCA0005EN-16, 05/2026
defaults:
  table: holding_register
  access: r
