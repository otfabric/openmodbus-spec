openmodbus: 0.1.0
info:
  id: schneider-electric/conext-sw-2524-230/status
  title: Schneider Electric Conext SW 2524-230 status and battery temperature
  version: 0.1.0
  description: 'Read-only subset of the Conext SW device Modbus map (503-0244-01-01
    Revision A.4). The inverter/charger is read through a Conext ComBox, whose datasheet
    (DS20130702_ConextComBox) lists a Modbus TCP/IP server on its Ethernet port and
    this model as a supported Xanbus device. The map names no function code, but read-only
    and read/write rows share one register list and read/write rows can only be holding
    registers, so the list is read as the holding-register table. Only single-register
    points are included: the map does not state the register order of 32-bit values,
    so battery voltage, current and power are left out. Device Present reports 0 when
    all data of the unit is invalid.

    '
  attribution: Derived from Schneider Electric's Conext Modbus Maps V4 (Modbus Map
    Conext SW Device).
  source: integrator
  verification: documented
  x-otfabric-corpus-source: schneider-electric-conext-modbus-maps-v4
device:
  manufacturer: Schneider Electric
  family: Conext SW
  model: Conext SW 2524-230
  hardware:
  - 865-2524-61
  classes:
  - energy_storage
  - battery_inverter
  transports:
  - type: tcp
    notes: Through the Modbus TCP/IP server of a Conext ComBox; the inverter/charger
      connects to the ComBox over Xanbus. The ComBox datasheet also lists an RS485
      Modbus port (2-wire, 19200 bit/s) without naming its framing, so no serial transport
      is listed.
  unitId:
    mode: configurable
    notes: Set in the read/write Modbus Address register (0x0028) of the device map,
      which warns not to assign the same address to two Modbus devices.
  documentation:
  - title: Conext Modbus Maps V4
    url: https://download.se.com/files?p_Doc_Ref=Conext-Modbus-Maps-V4&p_enDocType=Application+Notes&p_File_Name=Conext-Modbus-Maps-V4.zip
    revision: Modbus Map Conext SW Device 503-0244-01-01 Revision A.4
  - title: Conext ComBox communication device datasheet
    url: https://download.se.com/files?p_Doc_Ref=DS20130702_ConextComBox
    revision: DS20130702_ConextComBox
