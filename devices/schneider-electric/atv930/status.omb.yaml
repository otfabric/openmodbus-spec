openmodbus: 0.1.0
info:
  id: schneider-electric/atv930/status
  title: Schneider Electric Altivar Process ATV930 drive status and actual values
  version: 0.1.0
  description: 'Read-only subset of the ATV900 communication parameters, applied to
    the ATV930: the Altivar Process 900 Modbus SL Manual (NHA80939) lists this workbook
    and the Altivar Process ATV930, ATV950, ATV960, ATV980 Programming Manual among
    the user guides of the drive. CiA402 status word, drive state, last fault, actual
    values and the input energy counter. Parameters are read with Read Holding Registers
    (function 3), the only read function that manual lists. The output frequency scale
    assumes bit 9 of the extended control word CMI is 0. The workbook gives no fixed
    scale for motor current (LCR), so it is left out. Input energy is split over five
    registers (Wh, kWh, MWh, GWh, TWh), each counting 0 to 999.

    '
  attribution: Derived from Schneider Electric's ATV900 - Communication Parameters
    (NHA80944).
  source: integrator
  verification: documented
  x-otfabric-corpus-source: schneider-electric-atv900-comm
device:
  manufacturer: Schneider Electric
  family: Altivar Process
  model: ATV930
  classes:
  - drive
  documentation:
  - title: ATV900 - Communication Parameters
    url: https://www.se.com/us/en/download/document/NHA80944/
    revision: NHA80944 V4.6
  - title: Altivar Process 900 Modbus SL Manual
    url: https://www.se.com/us/en/download/document/NHA80939/
    revision: NHA80939.01, 07/2015
defaults:
  table: holding_register
  access: r
constraints:
  maxReadRegisters: 63
points:
- id: status_word
  label: Status Register
  aliases:
  - ETA
  address: 3201
  type: u16
  flags:
    flags:
    - bit: 0
      name: ready_to_switch_on
      label: '= 1: "Ready to switch on", awaiting power section line supply'
    - bit: 1
      name: switched_on
      label: '= 1: "Switched on", ready'
    - bit: 2
      name: operation_enabled
      label: '= 1: "Operation enabled", running'
    - bit: 3
      name: fault
      label: '= 1: Fault detection'
    - bit: 4
      name: voltage_enabled
      label: '"Voltage enabled", power part connected to supply mains'
      description: '"Voltage enabled", power part connected to supply mains = 0: Power
        part not connected to supply mains = 1: Power part connected to supply mains
        When the drive is powered by the power section only, this bit is always at
        1.'
    - bit: 6
      name: switch_on_disabled
      label: '= 1: "Switched on disabled", power section line supply locked'
    - bit: 7
      name: warning
      label: Warning
      description: 'Warning = 0: No warning = 1: Warning active'
    - bit: 9
      name: remote
      label: 'Remote: command or reference via fieldbus'
      description: 'Remote: command or reference via fieldbus = 0: Command or reference
        given via the graphic display terminal or remote display terminal = 1: Command
        or reference via fieldbus'
    - bit: 10
      name: target_reached
      label: Target reference reached
      description: 'Target reference reached = 0: The reference is not reached = 1:
        The reference has been reached When the drive is in speed mode, this is the
        reference frequency.'
    - bit: 11
      name: internal_limit_active
      label: '"Internal limit active", reference outside limits'
      description: '"Internal limit active", reference outside limits = 0: The reference
        is within the limits = 1: The reference is not within the limits When the
        drive is in speed mode, the limits are defined by the [Low speed] (LSP) and
        [High speed] (HSP) parameters.'
    - bit: 14
      name: stop_key
      label: '"Stop key", STOP via stop key'
      description: '"Stop key", STOP via stop key = 0: STOP key not active = 1: Stop
        triggered by the STOP key on the graphic display terminal or the remote display
        terminal'
    - bit: 15
      name: reverse_rotation
      label: '"Direction", direction of rotation'
      description: '"Direction", direction of rotation = 0: Forward rotation at output
        = 1: Reverse rotation at output The combination of Bits 0, 1, 2, 4, 5 and
        6 defines the state in the DSP 402 state chart (refer to fieldbus manuals).'
  description: Bit meanings for the CiA402 profile.
  source:
    address: 16#0C81 = 3201
    reference: Parameters!A10:L10; Registers!A52:D86
- id: output_frequency
  label: Motor frequency
  aliases:
  - RFR
  address: 3202
  type: i16
  conversion:
    exponent10: -1
  unit: Hz
  description: 0.1 Hz while bit 9 of the extended control word CMI is 0. With CMI
    bit 9 at 1 the drive reports a standardised value where 32767 corresponds to [Max
    frequency] (tFr); this contract does not describe that mode.
  source:
    address: 16#0C82 = 3202
    reference: Parameters!A24:L24; Registers!C13:D16
