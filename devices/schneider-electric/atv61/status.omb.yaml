openmodbus: 0.1.0
info:
  id: schneider-electric/atv61/status
  title: Schneider Electric Altivar 61 drive status and actual values
  version: 0.1.0
  description: 'Read-only subset of the Altivar 61 communication parameters workbook
    that Schneider FAQ FA225538 attaches: CiA402 status word, drive state, last fault,
    actual values and one 32-bit CiA402 setting. The workbook names no drive; the
    Altivar 61 Communication parameters manual (1760661, software V5.8) describes
    the same parameters at the same logic addresses and gives the unit of the motor
    current. Parameters are read with Read Holding Registers (function 3), the only
    read function that the Altivar 61/71 Modbus TCP/IP Ethernet card manual (1755879)
    lists. The Integrated Modbus manual (1755863) for the built-in serial ports names
    only the Altivar 71 and is not used here. A 32-bit parameter has its low-order
    word at the lower address: the workbook marks the two addresses lsb and msb. The
    output frequency scale assumes bit 9 of the extended control word CMI is 0. Motor
    torque, operating times and consumption have no fixed unit in the workbook and
    are left out.

    '
  attribution: Derived from Schneider Electric's Altivar 61 communication parameters
    workbook (FAQ FA225538).
  source: integrator
  verification: documented
  x-otfabric-corpus-source: schneider-electric-atv61-comm
device:
  manufacturer: Schneider Electric
  family: Altivar
  model: ATV61
  classes:
  - drive
  transports:
  - type: tcp
    notes: With the VW3 A3 310 Modbus TCP/IP Ethernet card (manual 1755879); the drive's
      parameters are served on unit ID 0.
  - type: rtu
    notes: Built-in Modbus ports (RS485). The manual that lists their Modbus functions
      (1755863) names only the Altivar 71.
  documentation:
  - title: Altivar 61 communication parameters workbook
    url: https://www.se.com/us/en/faqs/FA225538/
    revision: atv61_communication_parameters_en_v5.8_ie29 (attachment of FAQ FA225538,
      saved 2023-06-08)
  - title: Altivar 61 Communication parameters User's manual
    url: https://www.se.com/us/en/download/document/1760661/
    revision: 1760661, Software V5.8, 02/2013
  - title: Altivar 61/71 Modbus TCP/IP Ethernet card User manual (VW3 A3 310)
    url: https://www.se.com/us/en/download/document/1755879/
    revision: 1755879, 11/2009
defaults:
  table: holding_register
  access: r
constraints:
  maxReadRegisters: 63
points:
- id: status_word
  label: Status word
  aliases:
  - ETA
  address: 3201
  type: u16
  flags:
    flags:
    - bit: 0
      name: ready_to_switch_on
      label: Ready to switch on, power section line supply pending
    - bit: 1
      name: switched_on
      label: Switched on, ready
    - bit: 2
      name: operation_enabled
      label: Operation enabled, running
    - bit: 3
      name: fault
      label: Fault
      description: 'Fault = 0: No fault = 1: Fault'
    - bit: 4
      name: voltage_enabled
      label: Voltage enabled, power section line supply present
      description: 'Voltage enabled, power section line supply present = 0: Power
        section line supply absent = 1: Power section line supply present When the
        drive is powered by the power section only, this bit is always at 1.'
    - bit: 6
      name: switch_on_disabled
      label: Switched on disabled, power section line supply locked.
    - bit: 7
      name: warning
      label: Warning, alarm
      description: 'Warning, alarm = 0: No alarm = 1: Alarm'
    - bit: 9
      name: remote
      label: Remote, command or reference via the network
      description: 'Remote, command or reference via the network = 0: Command or reference
        via the terminals = 1: Command or reference via the network'
    - bit: 10
      name: target_reached
      label: Target reached, reference reached
      description: 'Target reached, reference reached = 0: The reference is not reached
        = 1: The reference has been reached When the drive is in speed mode, this
        is the speed reference. When the torque function is activated, refer to the
        description of this function (see the programming manual). When the drive
        stops, the reference has been reached.'
    - bit: 11
      name: internal_limit_active
      label: Internal limit active, reference outside limits
      description: 'Internal limit active, reference outside limits = 0: The reference
        is within the limits = 1: The reference is not within the limits When the
        drive is in speed mode, the limits are defined by the "Low speed (LSP)" and
        "High speed (HSP)" parameters. When the torque function is activated, refer
        to the description of this function (see the programming manual).'
    - bit: 14
      name: stop_key
      label: Stop key, STOP via stop key
      description: 'Stop key, STOP via stop key = 0: STOP key not pressed = 1: Stop
        triggered by the STOP key on the graphic display terminal'
    - bit: 15
      name: reverse_rotation
      label: Direction, direction of rotation
      description: 'Direction, direction of rotation = 0: Forward rotation at output
        = 1: Reverse rotation at output'
  description: Bit meanings for the CiA402 profile. Read here next to the output frequency;
    the workbook lists the same word at 8603, next to the output speed.
  source:
    address: 16#219B = 8603 (speed) 16#0C81 = 3201 (frequency)
    reference: Parameters!A10:M10; Registers!A129:D167
- id: output_frequency
  label: Output frequency
  aliases:
  - RFR
  address: 3202
  type: i16
  conversion:
    exponent10: -1
  unit: Hz
  description: 0.1 Hz while bit 9 of the extended control word CMI is 0. With CMI
    bit 9 at 1 the drive reports a standardised value where 32767 corresponds to [Max
    frequency] (tFr); this contract does not describe that mode.
  source:
    address: 16#0C82 = 3202
    reference: Parameters!A27:M27; Registers!C69:D72
- id: motor_current
  label: Motor current
  aliases:
  - LCR
  address: 3204
  type: u16
  conversion:
    exponent10: -1
  unit: A
  description: The workbook gives no unit; 0.1 A is the unit in the Altivar 61 Communication
    parameters manual.
  source:
    address: 16#0C84 = 3204
    reference: Parameters!A29:M29
- id: mains_voltage
  label: Mains voltage
  aliases:
  - ULN
  address: 3207
  type: u16
  conversion:
    exponent10: -1
  unit: V
  description: The workbook's range starts at [No meas.] (----); it does not give
    the register value that stands for it.
  source:
    address: 16#0C87 = 3207
    reference: Parameters!A43:M43
- id: motor_voltage
  label: Motor voltage
  aliases:
