openmodbus: 0.1.0
info:
  id: smartgen/hgm9530n/telemetry
  title: SmartGen HGM9530N generator, engine and status registers
  version: 0.1.0
  description: 'Read-only subset of the function code 03H map data field of the HGM9530N
    Genset Controller Communication Protocol version 1.0. The document has no unit
    column, so units are given only where the item text names one. The (*10), (*100)
    and (*1000) marks are read as register = value x N, and rows not marked Signed
    as unsigned. The alarm areas that refer to the alarm data form are not mapped;
    the common alarm register 0000 is.

    '
  attribution: Derived from SmartGen's HGM9530N Genset Controller Communication Protocol.
  source: integrator
  verification: documented
  x-otfabric-corpus-source: smartgen-hgm9530n
device:
  manufacturer: SmartGen
  model: HGM9530N
  classes:
  - genset_controller
  transports:
  - type: rtu
    notes: Serial Modbus with CRC-16 framing; the document does not name the port.
  unitId:
    mode: configurable
    notes: Slave address 1 to 255; the document states no default.
  documentation:
  - title: HGM9530N Genset Controller Communication Protocol
    url: https://www.smartgen.cn/yun/data/download/HGM9530N_Protocol_en.pdf
    revision: 1.0 (2018-12-21)
defaults:
  table: holding_register
  access: r
constraints:
  maxReadRegisters: 125
points:
- id: common_status
  label: Common alarm and mode bits
  aliases:
  - Common Alarm
  address: 0
  type: u16
  flags:
    flags:
    - bit: 0
      name: common_alarm
      label: Common Alarm
    - bit: 1
      name: common_shutdown_alarm
      label: Common Shutdown Alarm
    - bit: 2
      name: common_warning_alarm
      label: Common Warning Alarm
    - bit: 3
      name: common_trip_and_stop_alarm
      label: Common Trip and Stop Alarm
    - bit: 4
      name: common_trip_alarm
      label: Common Trip Alarm
    - bit: 5
      name: common_safe_trip_and_stop_alarm
      label: Common Safe Trip and Stop Alarm
    - bit: 6
      name: common_safe_trip_alarm
      label: Common Safe Trip Alarm
    - bit: 7
      name: common_lock_alarm
      label: Common Lock Alarm
    - bit: 9
      name: system_in_auto_mode
      label: System In Auto Mode
    - bit: 10
      name: system_in_manual_mode
      label: System In Manual Mode
    - bit: 11
      name: system_in_stop_mode
      label: System In Stop Mode
  description: Bit 0 is the row the document marks LSB; reserved bits are left out.
  source:
    address: '0000'
    page: 12
    reference: 5.1 map data field, 0000
