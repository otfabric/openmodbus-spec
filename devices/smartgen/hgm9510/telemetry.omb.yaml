- id: generator_voltage_a
  aliases:
  - Gen UA
  address: 78
  type: i16
  unit: V
  source:
    address: '0078'
    page: 28
    reference: Table 6 Value Data Field, Gen UA
- id: generator_voltage_b
  aliases:
