- id: generator_status
  aliases:
  - Gen Working Status
  address: 189
  type: u16
  enum:
    values:
    - value: 0
      name: standby
      label: Standby
    - value: 1
      name: preheat
      label: Preheat
    - value: 2
      name: fuel_output
      label: Fuel Output
    - value: 3
      name: cranking
      label: Cranking
    - value: 4
      name: crank_rest
      label: Crank Rest
    - value: 5
      name: safety_delay
      label: Safety Delay
    - value: 6
      name: start_idle
      label: Start Idle
    - value: 7
      name: high_speed_warming_up
      label: High-speed Warming Up
    - value: 8
      name: wait_for_load
      label: Wait for Load
    - value: 9
      name: normal_running
      label: Normal Running
    - value: 10
      name: high_speed_cooling
      label: High-speed Cooling
    - value: 11
      name: stop_idle
      label: Stop Idle
    - value: 12
      name: ets
      label: ETS
    - value: 13
      name: wait_for_stop
      label: Wait for Stop
    - value: 14
      name: stop_failure
      label: Stop Failure
    - value: 15
      name: after_stop
      label: After Stop
  source:
    address: '0189'
    page: 32
    reference: Table 6 Value Data Field, Gen Working Status; Generator Status Table
- id: mains_status
  aliases:
  - Mains Status
  address: 195
  type: u16
  enum:
    values:
    - value: 0
      name: mains_normal
      label: Mains Normal
    - value: 1
      name: mains_normal_delay
      label: Mains Normal Delay
    - value: 2
      name: mains_abnormal
      label: Mains Abnormal
    - value: 3
      name: mains_abnormal_delay
      label: Mains Abnormal Delay
  source:
    address: '0195'
    page: 32
    reference: Table 6 Value Data Field, Mains Status; Mains Status Table
- id: running_hours
  aliases:
  - Accum. Running Hours
  address: 199
  type: u16
  unit: h
  description: The document gives the range 0~23 for this register; the minutes and
    seconds of the accumulated running time follow in the next two registers.
  source:
    address: '0199'
    page: 32
    reference: Table 6 Value Data Field, Accum. Running Hours
- id: energy_counter_a
  aliases:
  - A Gen Power kWh
  address: 274
  type: i32
  wordOrder: little
  unit: kW.h
  description: The document lists A and B counter sets (running time, starts, energy)
    without explaining them.
  source:
    address: 0274-0275
    page: 35
    reference: Table 6 Value Data Field, A Gen Power kWh
