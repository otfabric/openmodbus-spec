- id: generator_voltage_c
  aliases:
  - Gen UC
  address: 80
  type: i16
  unit: V
  source:
    address: '0080'
    page: 28
    reference: Table 6 Value Data Field, Gen UC
- id: generator_current_a
  aliases:
