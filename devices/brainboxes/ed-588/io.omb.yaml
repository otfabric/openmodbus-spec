openmodbus: 0.1.0
info:
  id: brainboxes/ed-588/io
  title: Brainboxes ED-588 digital inputs and outputs
  version: 0.1.0
  description: 'Read-only input states and output states read back with function code
    1. The input and output polarity settings decide whether a 1 means voltage present.
    The input counters and output overload flags, laid out as on the ED-538, are left
    out to keep the subset within 20 points.

    '
  attribution: Derived from Brainboxes' ED Modbus Product Data Tables.
  source: integrator
  verification: documented
  x-otfabric-corpus-source: brainboxes-ed-tables
