openmodbus: 0.1.0
info:
  id: brainboxes/ed-538/io
  title: Brainboxes ED-538 digital inputs, outputs and 16-bit counters
  version: 0.1.0
  description: 'Read-only input states, output states read back with function code
    1, and input counters. The counter mapping applies when the device is configured
    for 16-bit counters or runs firmware with only 16-bit counter support. The input
    and output polarity settings decide whether a 1 means voltage present. Output
    overload flags are left out of this subset.

    '
  attribution: Derived from Brainboxes' ED Modbus Product Data Tables.
  source: integrator
  verification: documented
  x-otfabric-corpus-source: brainboxes-ed-tables
device:
  manufacturer: Brainboxes
  model: ED-538
  classes:
  - remote_io
  transports:
  - type: tcp
  documentation:
  - title: ED Modbus Product Data Tables
    url: https://docs.brainboxes.com/reference/protocols/ed-modbus-product-data-tables
