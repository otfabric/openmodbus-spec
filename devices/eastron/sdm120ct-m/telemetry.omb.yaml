openmodbus: 0.1.0
info:
  id: eastron/sdm120ct-m/telemetry
  title: Eastron SDM120CT-M telemetry
  version: 0.1.0
  description: Subset of the Modbus RTU input registers for the SDM120CT-M, which
    the document writes SDM120CTM. Read each selected value as a complete two-register
    float. The register order is taken from the document's worked response, which
    sends the high register first (Volts 1 = 230.2 as 43 66 33 34).
  attribution: Derived from Eastron's SDM120CTM Smart Meter Modbus Protocol Implementation.
  source: integrator
  verification: documented
  x-otfabric-corpus-source: eastron-sdm120ctm-modbus
device:
  manufacturer: Eastron
  model: SDM120CT-M
  classes:
  - energy_meter
  transports:
  - type: rtu
  documentation:
  - title: SDM120CTM Smart Meter Modbus Protocol Implementation
    url: https://www.eastroneurope.com/images/uploads/products/protocol/SDM120CT_Modbus_protocol.pdf
    revision: '1.3'
defaults:
  table: input_register
  access: r
  wordOrder: big
  byteOrder: big
points:
- id: voltage
  address: 0
  type: f32
  unit: V
  aliases:
  - Voltage
  source:
    address: '30001'
    page: 5
    reference: Input register map
- id: current
