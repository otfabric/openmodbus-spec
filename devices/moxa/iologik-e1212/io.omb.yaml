openmodbus: 0.1.0
info:
  id: moxa/iologik-e1212/io
  title: Moxa ioLogik E1212 digital inputs, outputs and counters
  version: 0.1.0
  description: 'Read-only subset of the Appendix A default Modbus/TCP map for the
    ioLogik E1212 and E1212-T (8 DIs and 8 DIOs): the DI rows cover 16 channels and
    the DO rows 8, as the map lists them; a DIO channel''s direction is set by jumper.
    Counters are 32-bit, high word first. Writable rows are read-only in this contract.

    '
  attribution: Derived from Moxa's ioLogik E1200 Series User's Manual.
  source: integrator
  verification: documented
  x-otfabric-corpus-source: moxa-iologik-e1200-manual
device:
  manufacturer: Moxa
  family: ioLogik E1200
  model: ioLogik E1212
  classes:
  - remote_io
  transports:
  - type: tcp
  unitId:
    default: 1
  documentation:
  - title: ioLogik E1200 Series User's Manual
    url: https://www.moxa.com/Moxa/media/PDIM/S100000327/moxa-iologik-e1200-series-manual-v15.2.pdf
    revision: Edition 15.2, February 2018
defaults:
  access: r
