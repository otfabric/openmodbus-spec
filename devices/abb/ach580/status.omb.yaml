openmodbus: 0.1.0
info:
  id: abb/ach580/status
  title: ABB ACH580 drive status and actual values (embedded fieldbus)
  version: 0.1.0
  description: 'Read-only subset of the embedded fieldbus interface (EFB) of the ACH580
    HVAC control program, version 2.22 and later, with the protocol set to Modbus
    RTU; the EFB also offers BACnet MS/TP and N2. The points hold for the EFB defaults:
    58.25 Control profile = ABB Drives, 58.33 Addressing mode = Mode 0, 58.34 Word
    order = LO-HI, and Data I/O 4 and 5 (58.104, 58.105) unchanged. The manual writes
    holding registers as the 6-digit numbers 400001 to 465536 for a 16-bit address
    field, which puts 400001 at address 0; that base follows from the manual''s ranges
    and is not spelled out in it. Parameters are read at 400000 + 100 x group + index
    (16-bit) or 420000 + 200 x group + 2 x index (32-bit, low-order register first).
    The manual does not state how negative parameter values are encoded, so only parameters
    whose range starts at zero are included: speed, frequency, torque and power are
    the absolute-value parameters 01.61 to 01.65.

    '
  attribution: Derived from ABB's ACH580 HVAC control program firmware manual.
  source: integrator
  verification: documented
  x-otfabric-corpus-source: abb-ach580-firmware-manual
device:
  manufacturer: ABB
  model: ACH580
  classes:
  - drive
  transports:
  - type: rtu
    notes: Embedded fieldbus interface, enabled with parameter 58.01 Protocol enable
      = Modbus RTU.
  unitId:
    mode: configurable
    default: 1
    notes: Parameter 58.03 Node address.
  documentation:
  - title: ACH580 HVAC control program firmware manual
    url: https://search.abb.com/library/Download.aspx?DocumentID=3AXD50000027537&LanguageCode=en&DocumentPartId=1&Action=Launch
    revision: 3AXD50000027537 Rev J (effective 2026-02-23)
defaults:
  table: holding_register
  access: r
  byteOrder: big
points:
- id: status_word
  address: 3
  type: u16
  flags:
    flags:
    - bit: 0
      name: rdy_on
      label: RDY_ON
      description: '1: READY TO SWITCH ON; 0: NOT READY TO SWITCH ON'
    - bit: 1
      name: rdy_run
      label: RDY_RUN
      description: '1: READY TO OPERATE; 0: OFF1 ACTIVE'
    - bit: 2
      name: rdy_ref
      label: RDY_REF
      description: '1: OPERATION ENABLED; 0: OPERATION INHIBITED'
    - bit: 3
      name: tripped
      label: TRIPPED
      description: '1: FAULT; 0: No fault'
    - bit: 4
      name: off_2_status
      label: OFF_2_STATUS
      description: '1: OFF2 inactive; 0: OFF2 ACTIVE'
    - bit: 5
      name: off_3_status
      label: OFF_3_STATUS
      description: '1: OFF3 inactive; 0: OFF3 ACTIVE'
    - bit: 6
      name: swc_on_inhib
      label: SWC_ON_INHIB
      description: '1: SWITCH-ON INHIBITED'
    - bit: 7
      name: alarm
      label: ALARM
      description: '1: Warning/Alarm; 0: No warning/alarm'
    - bit: 8
      name: at_setpoint
      label: AT_SETPOINT
      description: '1: OPERATING. Actual value equals Reference (is within tolerance
        limits, for example, in speed control, speed error is 10% max. of nominal
        motor speed); 0: Actual value differs from Reference (is outside tolerance
        limits)'
    - bit: 9
      name: remote
      label: REMOTE
      description: '1: Drive control location: REMOTE (EXT1 or EXT2); 0: Drive control
        location: LOCAL'
    - bit: 10
      name: above_limit
      label: ABOVE_LIMIT
      description: '1: Actual frequency or speed equals or exceeds supervision limit
        (set by drive parameter). Valid in both directions of rotation. Set by drive
        parameters 46.31 Above speed limit and 46.32 Above frequency limit. These
        parameters are indicated by bit 10 of 06.11 Main status word; 0: Actual frequency
        or speed within supervision limit'
  description: Status word of the ABB Drives profile, the default of 58.25 Control
    profile and of 58.104 Data I/O 4. Bits 0 to 10 are listed.
  aliases:
  - Status Word (SW)
  source:
    address: '400004'
    page: 306
    reference: Modbus holding register addresses; Status Word for the ABB Drives profile
- id: actual_value_1
  address: 4
  type: i16
  description: 'Raw fieldbus actual value 1, a signed integer. Its type and scaling
    follow 58.28 EFB act1 type: for speed and frequency, 20000 stands for the value
    of 46.01 Speed scaling or 46.02 Frequency scaling.'
  aliases:
  - Actual value 1 (ACT1)
  source:
    address: '400005'
    page: 306
    reference: Modbus holding register addresses
- id: efb_error_code
  address: 91
  type: u16
  enum:
    values:
    - value: 0
      name: no_error
      label: No error
    - value: 2
      name: low_high_limit_exceeded
      label: Low/High limit exceeded
    - value: 3
      name: faulty_index
      label: Faulty Index
      description: Unavailable index of an array parameter
    - value: 5
      name: incorrect_data_type
      label: Incorrect Data Type
      description: Value does not match the data type of the parameter
    - value: 101
      name: general_error
      label: General Error
      description: Undefined error when handling query
  description: Error of the last Modbus query that the drive answered with exception
    code 04h; cleared when a query succeeds.
  aliases:
  - Error Code
  source:
    address: '400092'
    page: 313
    reference: Error code registers (holding registers 400090…400100)
