openmodbus: 0.1.0
info:
  id: abb/a44/telemetry
  title: ABB A44 telemetry
  version: 0.1.0
  description: 'Read-only subset of the A43/A44 Modbus mapping tables (function code
    3) for the A44, the transformer-connected three-phase meter; this applies to variants
    with RS-485 set to the Modbus protocol. Quantities that the meter variant lacks
    read as the documented "invalid" value: FFFF in every register for unsigned quantities,
    the highest positive value for signed ones. The manual lists harmonics for the
    Platinum subgroup only.

    '
  attribution: Derived from ABB's A43/A44 User Manual.
  source: integrator
  verification: documented
  x-otfabric-corpus-source: abb-a43-a44-manual
device:
  manufacturer: ABB
  model: A44
  classes:
  - energy_meter
  transports:
  - type: rtu
    notes: RS-485 with the protocol set to Modbus (manual chapter 9.1); frames carry
      a CRC (chapter 9.2).
  documentation:
  - title: A43/A44 User Manual
    url: https://search.abb.com/library/Download.aspx?DocumentID=2CMC484001M0201&LanguageCode=en&DocumentPartId=&Action=Launch
    revision: 2CMC484001M0201 Revision E (2025-11-07)
defaults:
  table: holding_register
  access: r
constraints:
  ranges:
  - table: holding_register
    start: 4096
    count: 32512
    policy: safe_gap
    reason: 'Manual 9.3: reading any register in 1000-8EFF (hex) returns a normal
      response; quantities the meter lacks read as invalid.'
