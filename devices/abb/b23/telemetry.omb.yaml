openmodbus: 0.1.0
info:
  id: abb/b23/telemetry
  title: ABB B23 telemetry
  version: 0.1.0
  description: 'Read-only subset of the B23/B24 Modbus mapping tables (function code
    3) for the B23, the direct-connected three-phase meter; this applies to variants
    with RS-485 set to the Modbus protocol. Quantities that the meter variant lacks
    read as the documented "invalid" value: FFFF in every register for unsigned quantities,
    the highest positive value for signed ones.

    '
  attribution: Derived from ABB's B23/B24 User Manual.
  source: integrator
  verification: documented
  x-otfabric-corpus-source: abb-b23-b24-manual
device:
  manufacturer: ABB
  model: B23
  classes:
  - energy_meter
  transports:
  - type: rtu
    notes: RS-485 with the protocol set to Modbus; frames carry a CRC (manual chapter
      9.1).
  documentation:
  - title: B23/B24 User Manual
    url: https://library.e.abb.com/public/6d7783fdb45ace75c1257c3f00474022/B23_B24_User_Manual.pdf.pdf
    revision: 2CMC485003M0201 Revision A (2013-06-20)
defaults:
  table: holding_register
  access: r
constraints:
  ranges:
  - table: holding_register
    start: 4096
    count: 32512
    policy: safe_gap
    reason: 'Manual 9.2: reading any register in 1000-8EFF (hex) returns a normal
      response; quantities the meter lacks read as invalid.'
