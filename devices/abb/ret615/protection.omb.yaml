openmodbus: 0.1.0
info:
  id: abb/ret615/protection
  title: ABB RET615 ANSI transformer protection measurements and indications
  version: 0.1.0
  description: 'Read-only subset of the ANSI point list for RET615 Ver. 5.0 FP1. The
    point list describes a superset of the data of standard configurations B (TA02)
    and F (TA06); the functions used here are listed for both. Scale factors and the
    zero offset are the default settings, and the register holds the value multiplied
    by the scale factor. Register and bit addresses are PLC addresses with base address
    1, as the 615 series ANSI Modbus communication protocol manual states; registers
    are listed for both 3X and 4X. HV and MV are the high-voltage and medium-voltage
    sides.

    '
  attribution: Derived from ABB's RET615 ANSI Modbus Point List Manual.
  source: integrator
  verification: documented
  x-otfabric-corpus-source: abb-ret615-ansi-modbus
device:
  manufacturer: ABB
  family: Relion 615 series
  model: RET615
  classes:
  - protection_relay
  documentation:
  - title: Relion 615 series RET615 ANSI Modbus Point List Manual
    url: https://library.e.abb.com/public/a1aa125c30c9473989a8e24a8873ffdd/RET615_ANSI_modbuspoint_203705_ENb.pdf
    revision: 1MAC203705-MB rev. B, 2019-06-07, product version 5.0 FP1
  - title: Relion 615 series ANSI Modbus Communication Protocol Manual
    url: https://library.e.abb.com/public/d3ef0d113e844c3cb30ec235e3d0471a/RE_615ANSI_modbusprot_057386_ENa.pdf
    revision: 1MAC057386-MB rev. A, 2018-02-26, product version 5.0 FP1
