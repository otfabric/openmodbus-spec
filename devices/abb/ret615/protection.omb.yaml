      description: LD0.TRPPTRC2.Op.general
    - bit: 10
      name: master_trip_2_output
      description: LD0.TRPPTRC2.Tr.general
  description: Momentary global pickup, global trip and master trip bits; each odd
    bit is the change-detect (MCD) copy of the bit below it.
  source:
