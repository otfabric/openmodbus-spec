openmodbus: 0.1.0
info:
  id: abb/m4m-30-modbus/telemetry
  title: ABB M4M 30 Modbus telemetry
  version: 0.1.0
  description: 'Read-only subset of the M4M Modbus map for product type 7 (M4M 30
    Modbus). Read with FC 3; 32- and 64-bit values put the most significant word first;
    unavailable quantities read all ones (unsigned) or the largest positive value
    (signed). These conventions are stated in ABB''s Modbus manual for M4M network
    analyzers, 2CSG445050D0201 v1.05, which defines the map''s columns. The selected
    rows apply to all firmware versions.

    '
  attribution: Derived from ABB's Modbus protocol map for M4M network analyzers.
  source: integrator
  verification: documented
  x-otfabric-corpus-source: abb-m4m-modbus-map
device:
  manufacturer: ABB
  family: M4M
  model: M4M 30 Modbus
  classes:
  - power_meter
  transports:
  - type: rtu
  documentation:
  - title: Modbus protocol map for M4M network analyzers
    url: https://search.abb.com/library/Download.aspx?DocumentID=9AKK107492A7627&LanguageCode=en&DocumentPartId=&Action=Launch
    revision: 9AKK107492A7627 rev. F, map v1.3O
  - title: Modbus manual, M4M network analyzers
    url: https://search.abb.com/library/Download.aspx?DocumentID=2CSG445050D0201&LanguageCode=en&DocumentPartId=&Action=Launch
    revision: 2CSG445050D0201 v1.05
defaults:
  table: holding_register
  access: r
  wordOrder: big
  byteOrder: big
