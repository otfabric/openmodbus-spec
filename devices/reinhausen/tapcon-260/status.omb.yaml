openmodbus: 0.1.0
info:
  id: reinhausen/tapcon-260/status
  title: Reinhausen TAPCON 260 voltage regulator status
  version: 0.1.0
  description: 'Read-only subset of the TAPCON 260 MODBUS protocol description: discrete
    inputs for function monitoring, limit, operating-mode and parallel-operation messages,
    and the tap position. Values with a Multiplier column other than 1 (voltages,
    currents, frequency) are left out because the document does not say whether the
    factor multiplies or divides the raw value.

    '
  attribution: Derived from Maschinenfabrik Reinhausen's Voltage regulator TAPCON
    260 Protocol description MODBUS.
  source: integrator
  verification: documented
  x-otfabric-corpus-source: reinhausen-tapcon-260
device:
  manufacturer: Maschinenfabrik Reinhausen
  family: TAPCON
  model: TAPCON 260
  classes:
  - tap_changer_controller
  transports:
  - type: rtu
    notes: RS-232, RS-485 or optical fibre; 8E1.
  - type: ascii
    notes: RS-232, RS-485 or optical fibre.
  - type: rtu_over_tcp
    notes: RJ45, TCP port 1234, fixed 19.2 kBaud; the supplement states this is not
      Modbus TCP.
  unitId:
    mode: configurable
    notes: Local SCADA address 1 to 255 (0 = broadcast) on RS232; the supplement gives
      0 to 254 (255 = broadcast) for RS485, FOC and RJ45.
  documentation:
  - title: Voltage regulator TAPCON 260 Protocol description MODBUS
    url: https://www.reinhausen.com/fileadmin/downloadcenter/products/voltage_regulators/discontinued_products/tapcon_260/protocol/modbus/2531994_01protokollbeschreibung_modbus_tc260_en.pdf
    revision: Supplement 2531994/01 EN
