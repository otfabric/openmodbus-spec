- id: parallel_operation_method
  table: holding_register
  address: 6
  type: u16
  enum:
    values:
    - value: 0
      name: 'off'
      label: 'off'
    - value: 1
      name: circulating_current
      label: circulating curr
    - value: 2
      name: master
      label: master
    - value: 3
      name: follower
      label: follower
    - value: 4
      name: auto_synchronous
      label: auto synchron.
    - value: 5
      name: xpa
      label: XPA
  description: Read with function code 03; the device also accepts writes (06), which
    this read-only contract does not describe.
  aliases:
  - parallel operation method
  source:
    address: '6'
    page: 6
    reference: 6.4 Holding registers (4X references)
- id: paralleling_group
  table: holding_register
  address: 7
  type: u16
  enum:
    values:
    - value: 0
      name: 'off'
      label: 'off'
    - value: 1
      name: group_1
      label: group1
    - value: 2
      name: group_2
      label: group2
  description: Read with function code 03; the device also accepts writes (06), which
    this read-only contract does not describe.
  aliases:
  - paralleling group
  source:
    address: '7'
    page: 6
    reference: 6.4 Holding registers (4X references)
- id: tap_position
  table: input_register
  address: 0
  type: i16
  description: Range -50 to 140 ((50L...140R) in the supplement).
  aliases:
  - tap position
  source:
    address: '0'
    page: 6
    reference: 6.3 Input registers (3X references)
