openmodbus: 0.1.0
info:
  id: reinhausen/tapcon-250/status
  title: Reinhausen TAPCON 250 voltage controller status
  version: 0.1.0
  description: 'Read-only subset of the TAPCON 250 MODBUS data points: input status
    bits for operating mode, limit and parallel-control messages, the tap position
    and two documented parallel-control parameters. Values with a Scale column other
    than 1 (voltages, currents, frequency) are left out because the document does
    not say whether the factor multiplies or divides the raw value.

    '
  attribution: Derived from Maschinenfabrik Reinhausen's Digital OLTC Voltage Controller
    TAPCON 250 Implementation of MODBUS (ASCII/RTU) Protocol.
  source: integrator
  verification: documented
  x-otfabric-corpus-source: reinhausen-tapcon-250
device:
  manufacturer: Maschinenfabrik Reinhausen
  family: TAPCON
  model: TAPCON 250
  classes:
  - tap_changer_controller
  transports:
  - type: rtu
    notes: RS232 (default), RS485 or optional optical fibre; 9600 baud default, 8E1
      default.
  - type: ascii
    notes: RS232 (default), RS485 or optional optical fibre.
  unitId:
    mode: configurable
    default: 1
    notes: Address 0 to 255, 1 is the default; address 0 is broadcast.
  documentation:
  - title: Digital OLTC Voltage Controller TAPCON 250 Implementation of MODBUS (ASCII/RTU)
      Protocol
    url: https://www.reinhausen.com/fileadmin/downloadcenter/spannungsregler/tapcon_250_previous_generation/bb2072201_en_tc250_modbus.pdf
    revision: Supplement BB 2072201/02
defaults:
  access: r
points:
- id: auto_mode
  table: discrete_input
  address: 0
  type: bool
  description: 0 = manual, 1 = auto.
  aliases:
  - status manual/auto
  source:
    address: '0'
    page: 5
    reference: 6.2 Input Status (1X references)
- id: operation_counter_circuit_closed
  table: discrete_input
  address: 10
  type: bool
  description: 0 = open, 1 = closed.
  aliases:
