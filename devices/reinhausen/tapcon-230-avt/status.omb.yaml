openmodbus: 0.1.0
info:
  id: reinhausen/tapcon-230-avt/status
  title: Reinhausen TAPCON 230 AVT voltage regulator status
  version: 0.1.0
  description: 'Read-only subset of the TAPCON 230 AVT MODBUS profile: discrete inputs
    for tap-change outputs, operating mode and limit messages, the tap position and
    the 32-bit operation counter. Values the supplement scales with a Multiplier column
    (voltages, currents, frequency) are left out because the document does not say
    whether the factor multiplies or divides the raw value.

    '
  attribution: Derived from Maschinenfabrik Reinhausen's TAPCON 230 AVT Supplement
    Device Profile Document MODBUS.
  source: integrator
  verification: documented
  x-otfabric-corpus-source: reinhausen-tapcon-230-avt
device:
  manufacturer: Maschinenfabrik Reinhausen
  family: TAPCON
  model: TAPCON 230 AVT
  classes:
  - tap_changer_controller
  transports:
  - type: rtu
    notes: RS-232, RS-485 or optical fibre; 9600 to 57600 baud.
  - type: ascii
    notes: RS-232, RS-485 or optical fibre.
  - type: rtu_over_tcp
    notes: RJ45, TCP port 1234; the supplement states this is not Modbus TCP.
  unitId:
    mode: configurable
    notes: Local SCADA address 1 to 255; 0 is broadcast.
  documentation:
  - title: TAPCON 230 AVT Supplement Device Profile Document MODBUS
    url: https://www.reinhausen.com/fileadmin/downloadcenter/spannungsregler/tapcon230_previous_generation/2224208_00_en_tapcon230-avt_supplement-modbus_f0223000.pdf
    revision: 2224208/00 EN
defaults:
  access: r
