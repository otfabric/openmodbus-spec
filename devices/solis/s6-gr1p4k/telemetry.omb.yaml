- id: working_status
  aliases:
  - Working Status
  address: 3071
  type: u16
  flags:
    flags:
    - bit: 0
      name: normal_operation
      label: Normal operation
    - bit: 1
      name: initial_standby
      label: Initial standby
    - bit: 2
      name: controlled_shutdown
      label: Controlled shutdown
    - bit: 3
      name: fault_shutdown
      label: Fault shutdown
    - bit: 4
      name: standby
      label: Standby
    - bit: 5
      name: derating_operation
      label: Derating operation
    - bit: 6
      name: power_limit_operation
      label: Power-limit operation
    - bit: 7
      name: over_voltage_reduction
      label: Over voltage reduction
    - bit: 8
      name: grid_surge
      label: Grid surge
    - bit: 10
      name: external_fan_fault
      label: External fan fault
    - bit: 14
      name: phase_ground_alarm
      label: Phase-ground alarm
    - bit: 15
      name: igbt_fault
      label: IGBT Fault
  source:
    address: '3071'
    page: 9
    reference: 5.1 Inverter Parameter Address Definition for 0x04; Appendix 3 Status
      Bits Definition (page 28)
