- id: operating_state
  address: 40107
  type: u16
  enum:
    values:
    - value: 1
      name: 'off'
      label: I_STATUS_OFF
      description: Inverter is off
    - value: 2
      name: sleeping
      label: I_STATUS_SLEEPING
      description: Auto shutdown
    - value: 3
      name: starting
      label: I_STATUS_STARTING
      description: Inverter starting
    - value: 4
      name: mppt
      label: I_STATUS_MPPT
      description: Inverter working normally
    - value: 5
      name: throttled
      label: I_STATUS_THROTTLED
      description: Power reduction active
    - value: 6
      name: shutting_down
      label: I_STATUS_SHUTTING_DOWN
      description: Inverter shutting down
    - value: 7
      name: fault
      label: I_STATUS_FAULT
      description: One or more faults present, see St*or Evt* register
    - value: 8
      name: standby
      label: I_STATUS_STANDBY
      description: Standby
  invalid:
  - 65535
  description: Enumerated value. Operating state
  aliases:
  - St
  source:
    address: '40108'
    reference: Verto_Inverter_Register_Map_4MPPT_Int&SF_ROW.xlsx Complete Map!A54
      (inverter (103))
- id: pv_connection_status
  address: 40183
  type: u16
  flags:
