openmodbus: 0.1.0
info:
  id: fronius/verto-4-mppt/inverter
  title: Fronius Verto (4 MPP trackers) inverter telemetry (int+SF)
  version: 0.1.0
  description: 'Read-only subset of the SunSpec map that the inverter serves when
    the Modbus setting "SunSpec Model Type" is int + SF (inverter model 103) on a
    Verto with 4 MPP trackers, taken from the ROW map of the bundle 1.2.7-2. The default
    setting is float (inverter model 111 to 113) with a different register layout;
    the float maps are not mapped because neither they nor the operating instructions
    state the register order of 32-bit values, which also leaves out AC energy (WH)
    and the event flags here. The operating instructions state that register addresses
    depend on the composition of the SunSpec model chain: check the model ID registers
    (register numbers 40003, 40070, 40182 and 40254 hold 1, 103, 122 and 160) before
    relying on these addresses. The map lists 1-based register numbers; the operating
    instructions state that the address is the register number minus 1 and list the
    values returned for unavailable data. The operating instructions are titled for
    the GEN24 series; they link this bundle of register maps, which includes the Verto
    maps. The operating states are the SunSpec Operating Codes table of the operating
    instructions. Scale factors can change at runtime.'
  attribution: Derived from Fronius's GEN24 Plus Modbus SunSpec Maps.
  source: integrator
  verification: documented
  x-otfabric-corpus-source: fronius-gen24-modbus
device:
  manufacturer: Fronius
  family: Verto
  model: Verto (4 MPPT)
  classes:
  - pv_inverter
  transports:
  - type: tcp
  - type: rtu
  unitId:
    mode: configurable
    notes: The Fronius GEN24 Modbus operating instructions state unit ID 1 over Modbus
      TCP and a slave ID set in the inverter web interface over Modbus RTU.
  documentation:
  - title: GEN24 Plus Modbus SunSpec Maps
    url: https://www.fronius.com/de/~/downloads/Solar%20Energy/Operating%20Instructions/gen24-modbus-api-external-docs.zip
    revision: 1.2.7-2
  - title: Fronius GEN24 - Modbus TCP and RTU Operating instructions
    url: https://manuals.fronius.com/html/4204102649/en-US.html
    revision: 034-28092026
defaults:
  table: holding_register
  access: r
