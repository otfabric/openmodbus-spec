openmodbus: 0.1.0
info:
  id: fronius/primo-gen24-plus/inverter
  title: Fronius Primo GEN24 Plus inverter and battery telemetry (int+SF, battery
    configured)
  version: 0.1.0
  description: 'Read-only subset of the SunSpec map that the inverter serves when
    the Modbus setting "SunSpec Model Type" is int + SF (inverter model 101 or 103)
    and a battery is configured, taken from the ROW map of the bundle 1.2.7-2 for
    GEN24 software 1.36.x. The default setting is float (inverter model 111 to 113)
    with a different register layout; the float maps are not mapped because neither
    they nor the operating instructions state the register order of 32-bit values,
    which also leaves out AC energy (WH) and the event flags here. The operating instructions
    state that register addresses depend on the composition of the SunSpec model chain:
    check the model ID registers (register numbers 40003, 40070, 40182, 40254 and
    40344 hold 1, 101 or 103, 122, 160 and 124) before relying on these addresses.
    The map lists 1-based register numbers; the operating instructions state that
    the address is the register number minus 1 and list the values returned for unavailable
    data. The map names the models without "Plus"; the storage model 124 is only available
    for inverters with a storage solution. The operating states are the SunSpec Operating
    Codes table of the operating instructions. Scale factors can change at runtime.'
  attribution: Derived from Fronius's GEN24 Plus Modbus SunSpec Maps.
  source: integrator
  verification: documented
  x-otfabric-corpus-source: fronius-gen24-modbus
device:
  manufacturer: Fronius
  family: GEN24 Plus
  model: Primo GEN24 Plus
  classes:
  - pv_inverter
  - battery_inverter
  transports:
  - type: tcp
  - type: rtu
  unitId:
    mode: configurable
    notes: Over Modbus TCP the inverter unit ID is always 1. Over Modbus RTU the slave
      ID is set in the inverter web interface.
  documentation:
  - title: GEN24 Plus Modbus SunSpec Maps
    url: https://www.fronius.com/de/~/downloads/Solar%20Energy/Operating%20Instructions/gen24-modbus-api-external-docs.zip
    revision: 1.2.7-2
  - title: Fronius GEN24 - Modbus TCP and RTU Operating instructions
    url: https://manuals.fronius.com/html/4204102649/en-US.html
    revision: 034-28092026
