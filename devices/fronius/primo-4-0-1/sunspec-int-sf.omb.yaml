openmodbus: 0.1.0
info:
  id: fronius/primo-4-0-1/sunspec-int-sf
  title: Fronius Primo 4.0-1 SunSpec inverter model (int+SF)
  version: 0.1.0
  description: Read-only subset of the SunSpec Common block and integer inverter model
    (101, single phase) that the Fronius Datamanager 2.0 serves for a Fronius Primo
    4.0-1 inverter. Valid only while the Datamanager's SunSpec model type is int+SF
    (sunspec_model_type = 2); with the default float setting the inverter model is
    111 with a different layout. The vendor map numbers registers from 1; the Fronius
    Datamanager Modbus TCP & RTU operating instructions (section Register addresses)
    state that register 40001 is read at address 40000, and section Unavailable data
    records gives the not-available values used in invalid. The vendor recommends
    locating SunSpec models by scanning; these addresses are the vendor's Complete
    Map for the first two blocks. Scale factors are read from their registers and
    may change with firmware. AC lifetime energy and event flags are 32-bit values
    and are left out because the documents do not state their word order. DC current
    and voltage of the inverter model are not supported on inverters with several
    DC inputs and then read as not available.
  attribution: Derived from Fronius's Modbus SunSpec Maps, State Codes and Events.
  source: integrator
  verification: documented
  x-otfabric-corpus-source: fronius-primo-sunspec-maps
device:
  manufacturer: Fronius
  family: Primo
  model: Primo 4.0-1
  classes:
  - pv_inverter
  transports:
  - type: tcp
    notes: Served by the Fronius Datamanager 2.0.
  - type: rtu
    notes: Served by the Fronius Datamanager 2.0 over RS-485.
  unitId:
    mode: configurable
    notes: The device ID equals the inverter number set on the inverter; inverter
      number 00 maps to device ID 100.
  documentation:
  - title: Modbus SunSpec Maps, State Codes and Events
    url: https://www.fronius.com/en/~/downloads/Solar%20Energy/Operating%20Instructions/SE_EI_Modbus_Sunspec_Maps_State_Codes_Events_EN.zip
    revision: 1.1.7-0
  - title: Fronius Datamanager - Modbus TCP and RTU, Operating instructions
    url: https://manuals.fronius.com/html/4204102049/en-US.html
    revision: 033-24022026
