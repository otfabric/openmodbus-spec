openmodbus: 0.1.0
info:
  id: fronius/smart-meter/telemetry
  title: Fronius Smart Meter telemetry served by a GEN24 inverter (int+SF)
  version: 0.1.0
  description: 'Read-only subset of the SunSpec meter map that a Fronius GEN24 inverter
    serves for a Fronius Smart Meter connected to it when the inverter''s Modbus setting
    "SunSpec Model Type" is int + SF (meter model 201 to 204; map from the bundle
    1.2.7-2 for GEN24 software 1.36.x). The default setting is float, with a different
    register layout; the float map is not mapped because neither it nor the operating
    instructions state the register order of 32-bit values, which also leaves out
    the energy counters here. The operating instructions state that register addresses
    depend on the composition of the SunSpec model chain: check that register number
    40003 holds 1 and that meter_model (register number 40070) holds a meter model
    ID before relying on these addresses. The map lists 1-based register numbers;
    the operating instructions state that the address is the register number minus
    1 and list the values returned for unavailable data. The sign of the power values
    depends on the meter location set on the inverter (operating instructions, Meter
    Model). Scale factors can change at runtime.'
  attribution: Derived from Fronius's GEN24 Plus Modbus SunSpec Maps.
  source: integrator
  verification: documented
  x-otfabric-corpus-source: fronius-gen24-modbus
device:
  manufacturer: Fronius
  model: Smart Meter
  classes:
  - energy_meter
  transports:
  - type: tcp
    notes: Served by the inverter the meter is connected to.
  - type: rtu
    notes: Served by the inverter the meter is connected to.
  unitId:
    mode: configurable
    default: 200
    notes: 'Set as "Meter address offset" in the inverter''s Modbus settings (factory
      setting 200): the Smart Meter with address 1 is device ID 200, address 2 is
      201, and so on.'
  documentation:
  - title: GEN24 Plus Modbus SunSpec Maps
    url: https://www.fronius.com/de/~/downloads/Solar%20Energy/Operating%20Instructions/gen24-modbus-api-external-docs.zip
    revision: 1.2.7-2
  - title: Fronius GEN24 - Modbus TCP and RTU Operating instructions
    url: https://manuals.fronius.com/html/4204102649/en-US.html
    revision: 034-28092026
defaults:
  table: holding_register
  access: r
points:
- id: model
  address: 40020
  type: string
  registers: 16
  description: Smart Meter Model
  aliases:
  - Md
  source:
    address: '40021'
    reference: Smart_Meter_Register_Map_Int&SF.xlsx Complete Map!A10 (common (1))
- id: meter_model
  address: 40069
  type: u16
  enum:
    values:
    - value: 201
      name: single_phase
      label: Single Phase (AN or AB)
    - value: 202
      name: split_single_phase
      label: Split Single Phase (ABN)
    - value: 203
      name: wye_connect_three_phase
      label: WYE-Connect Three Phase (ABCN)
    - value: 204
      name: delta_connect_three_phase
      label: Delta-Connect Three Phase (ABC)
  invalid:
  - 65535
  description: Well-known value. Uniquely identifies this as a sunspec model ac_meter
    (20x)
  aliases:
  - ID
  source:
    address: '40070'
    reference: Smart_Meter_Register_Map_Int&SF.xlsx Complete Map!A17 (ac_meter (20x))
- id: current_total
  address: 40071
  type: i16
  unit: A
  conversion:
    exponent10:
      point: a_sf
  invalid:
  - -32768
  description: Total AC Current
  aliases:
  - A
  source:
    address: '40072'
    reference: Smart_Meter_Register_Map_Int&SF.xlsx Complete Map!A19 (ac_meter (20x))
- id: a_sf
  address: 40075
  type: i16
  invalid:
  - -32768
  description: Current scale factor. auto-scaled on A, AphA, AphB and AphC
  aliases:
  - A_SF
  source:
    address: '40076'
    reference: Smart_Meter_Register_Map_Int&SF.xlsx Complete Map!A23 (ac_meter (20x))
- id: voltage_l1_n
  address: 40077
  type: i16
  unit: V
