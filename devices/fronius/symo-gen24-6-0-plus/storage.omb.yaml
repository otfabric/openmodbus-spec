openmodbus: 0.1.0
info:
  id: fronius/symo-gen24-6-0-plus/storage
  title: Fronius Symo GEN24 6.0 Plus battery and AC telemetry (int+SF, battery configured)
  version: 0.1.0
  description: 'Read-only subset of the SunSpec map that the inverter serves when
    the Modbus setting "SunSpec Model Type" is int+SF and a battery is configured
    (ROW map from the bundle 1.2.7-2 for GEN24 software 1.36.x). The operating instructions
    state that register addresses depend on the composition of the SunSpec model chain:
    check the model ID registers (register numbers 40003, 40070, 40254 and 40344 hold
    1, the inverter model ID 101 or 103, 160 and 124) before relying on these addresses.
    The map lists 1-based register numbers; the operating instructions state that
    the address is the register number minus 1 and list the values returned for unavailable
    data. MPPT modules 3 and 4 are the battery charge and discharge ports; from inverter
    software 1.31 module 3 reports the battery port voltage continuously. Scale factors
    can change at runtime. 32-bit values are left out because the documents do not
    state their register order.

    '
  attribution: Derived from Fronius's GEN24 Plus Modbus SunSpec Maps.
  source: integrator
  verification: documented
  x-otfabric-corpus-source: fronius-gen24-modbus
device:
  manufacturer: Fronius
  family: GEN24 Plus
  model: Symo GEN24 6.0 Plus
  classes:
  - energy_storage
  - battery_inverter
  transports:
  - type: tcp
  - type: rtu
  unitId:
    mode: configurable
    notes: Over Modbus TCP the inverter unit ID is always 1. Over Modbus RTU the slave
      ID is set in the inverter web interface.
  documentation:
  - title: GEN24 Plus Modbus SunSpec Maps
    url: https://www.fronius.com/de/~/downloads/Solar%20Energy/Operating%20Instructions/gen24-modbus-api-external-docs.zip
    revision: 1.2.7-2
  - title: Fronius GEN24 - Modbus TCP and RTU Operating instructions
    url: https://manuals.fronius.com/html/4204102649/en-US.html
    revision: 034-28092026
